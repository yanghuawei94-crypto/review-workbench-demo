// ============================================================
// ===== 拼接文件 1/14：js/db.js =====
// ============================================================
// ============================================================
// db.js — sql.js(SQLite WASM) 封装 + DDL 初始化 + IndexedDB 持久化
// 数据红线：全部账户数据仅存本地浏览器，绝不外发（产品文档 §7.1
// 「你的交割单不离开你的电脑」）
// ============================================================

// sql.js 资源基址：本地 file:// 双击打开 → CDN（单文件自包含）；
// http(s) 部署（开发服务 / GitHub Pages / 自建 nginx）→ 同源 vendor/
// （大陆访问 Cloudflare CDN（cdnjs）慢且不稳，同源资源快且可控；两个目录内容同版本 1.10.3）
const SQLJS_CDN = location.protocol === 'file:'
  ? 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3'
  : 'vendor';
const IDB_NAME = 'astock_review_proto';
const IDB_STORE = 'kv';
const DUMP_KEY = 'sqlite_dump';

let db = null;
let saveTimer = null;

// ---------- 通用工具 ----------
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = (Math.random() * 16) | 0;
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
}
function now() { return Math.floor(Date.now() / 1000); }

function pad(n) { return String(n).padStart(2, '0'); }

function fmtDate(ts) {           // 秒级时间戳 -> 'YYYY-MM-DD'
  const d = new Date(ts * 1000);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function fmtTime(ts) {           // -> 'HH:MM'
  const d = new Date(ts * 1000);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDateTime(ts) { return `${fmtDate(ts)} ${fmtTime(ts)}`; }
function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '-';
  return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(x, digits = 1) { // 0.833 -> '83.3%'
  if (x === null || x === undefined || isNaN(x)) return '-';
  return (x * 100).toFixed(digits) + '%';
}
function dayKey(ts) { return fmtDate(ts); }
function monthKey(ts) { const d = new Date(ts * 1000); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }

// ISO 周（周一起算）：'2026-W37'，供「单周交易次数」规则使用
function weekKey(ts) {
  const d = new Date(ts * 1000);
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (dt.getUTCDay() + 6) % 7;            // 周一=0
  dt.setUTCDate(dt.getUTCDate() - dayNum + 3);        // 本周周四
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
  const fday = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - fday + 3);
  const week = 1 + Math.round((dt - firstThursday) / (7 * 24 * 3600 * 1000));
  return `${dt.getUTCFullYear()}-W${pad(week)}`;
}

// 模板表头指纹（sample_hash）：简单稳定字符串哈希
function simpleHash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return 'h' + h.toString(16);
}

async function sha256Hex(buffer) {
  const digest = await crypto.subtle.digest('SHA-256', buffer);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// 费用确定性计算（导入缺费用列时使用，与模拟数据同一口径）：
// 佣金 万2.5 最低5元；印花税 卖出 0.05%；过户费 0.001%（双向）
function calcFee(direction, amount) {
  const commission = Math.max(amount * 0.00025, 5);
  const stamp = direction === 'sell' ? amount * 0.0005 : 0;
  const transfer = amount * 0.00001;
  return Math.round((commission + stamp + transfer) * 100) / 100;
}

// ---------- CSV / 文本解析共享工具（import.js 与 signal.js 同一实现，勿再复制） ----------

// 轻量 CSV 解析（支持引号包裹、逗号转义、\r\n）
function parseCSV(text) {
  const rows = [];
  let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = '';
      if (row.some(x => x.trim() !== '')) rows.push(row.map(x => x.trim()));
      row = [];
    } else cur += c;
  }
  row.push(cur);
  if (row.some(x => x.trim() !== '')) rows.push(row.map(x => x.trim()));
  return rows;
}

// 确定性伪随机数（固定种子，模拟数据/模拟信号评审可复现）
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 方向归一化共享表（覆盖聚宽/掘金/QMT/券商交割单写法）
const DIR_MAP = {
  'buy': 'buy', 'b': 'buy', 'long': 'buy', '买入': 'buy', '买': 'buy', '多': 'buy', '开多': 'buy', '买开': 'buy', '23': 'buy',
  'sell': 'sell', 's': 'sell', 'short': 'sell', '卖出': 'sell', '卖': 'sell', '空': 'sell', '开空': 'sell', '卖平': 'sell', '24': 'sell',
  // 真实券商导出的方向用语（东财「操作」列=证券买入/证券卖出，华泰信用账户=担保品买入，
  // 两融=融资买入/融券卖出，成交回报=买入成交）。全部精确匹配，不做模糊兜底。
  '证券买入': 'buy', '担保品买入': 'buy', '融资买入': 'buy', '买入成交': 'buy', '买券还券': 'buy',
  '证券卖出': 'sell', '担保品卖出': 'sell', '融券卖出': 'sell', '卖出成交': 'sell', '卖券还款': 'sell',
};
// 宽松归一化（信号导入用）：精确命中共享表，否则复合写法兜底（融资买入/卖出开仓 等）
// 注意：交割单导入（import.js）只用 DIR_MAP 精确匹配，宽松兜底会吞掉脏数据，勿用
function normDirection(s) {
  const raw = String(s || '').trim().toLowerCase();
  if (DIR_MAP[raw]) return DIR_MAP[raw];
  const t = raw.replace(/融资|融券|担保|平仓|开仓|成交/g, '');
  if (/^(买|多)/.test(t) || t.indexOf('买入') >= 0) return 'buy';
  if (/^(卖|空)/.test(t) || t.indexOf('卖出') >= 0) return 'sell';
  return null;
}

// 日期解析：2026-10-03 / 2026/10/03 / 2026年10月3日 / 20261003 → [年, 月-1, 日]
function parseDatePart(s) {
  const m = String(s || '').match(/(\d{4})\s*[-/年.]\s*(\d{1,2})\s*[-/月.]\s*(\d{1,2})/);
  if (m) return [+m[1], +m[2] - 1, +m[3]];
  const c = String(s || '').replace(/\D/g, '');
  if (c.length === 8) return [+c.slice(0, 4), +c.slice(4, 6) - 1, +c.slice(6, 8)];
  return null;
}

// 时间解析：09:35:21 / 09:35 / 093521 / 0935（QMT 常导纯数字）→ [时, 分, 秒]
function parseTimePart(s) {
  const t = String(s || '').trim();
  if (/^\d{6}$/.test(t)) return [+t.slice(0, 2), +t.slice(2, 4), +t.slice(4, 6)];
  if (/^\d{4}$/.test(t)) return [+t.slice(0, 2), +t.slice(2, 4), 0];
  const m = t.match(/(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?/);
  if (!m) return null;
  return [+m[1], +m[2], m[3] ? +m[3] : 0];
}

// [年,月-1,日] + [时,分,秒] → 秒级时间戳（本地时区）
function toTs(d, t) {
  return Math.floor(new Date(d[0], d[1], d[2], t[0], t[1], t[2]).getTime() / 1000);
}

// ---------- IndexedDB 持久化 ----------
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v) {
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const tx = d.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(v, k);
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k) {
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const r = d.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(k);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

// 变更后自动持久化（防抖 300ms）：sql.js export() 二进制 -> IndexedDB
function scheduleSave() {
  if (!db) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await idbSet(DUMP_KEY, db.export()); } catch (e) { console.error('持久化失败', e); }
  }, 300);
  // 页面隐藏/关闭时尽力立即落库——防抖 300ms 窗口内的刷新/关标签会丢最后一段写入，
  // 导入完就关页面是真实场景，必须兜住（beforeunload 里 IndexedDB 写通常能完成）
  if (!scheduleSave._bound) {
    scheduleSave._bound = true;
    const flush = () => {
      if (!db) return;
      clearTimeout(saveTimer);
      try { idbSet(DUMP_KEY, db.export()); } catch (e) { /* 尽力而为 */ }
    };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
    window.addEventListener('pagehide', flush);
  }
}

// 「导出 .sqlite 文件」按钮：浏览器下载当前数据库快照
function exportSqliteFile() {
  const data = db.export();
  const blob = new Blob([data], { type: 'application/x-sqlite3' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `复盘账本_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.sqlite`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- SQL 便捷方法 ----------
function q(sql, params = {}) {          // 查询 -> 对象数组
  const stmt = db.prepare(sql);
  stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}
function q1(sql, params = {}) { const r = q(sql, params); return r[0] || null; }
function run(sql, params = {}) {        // 写操作 + 自动持久化
  db.run(sql, params);
  scheduleSave();
}

// ---------- 删除墓碑（Phase 1 同步补全） ----------
// 本地删除「已同步行」时必须登记墓碑，否则服务端与其他设备上的旧行删不掉，
// 下次拉取会被「复活」。重建类流程（规则引擎 / autoMatch）只登记
// 「旧 ID − 新 ID」差集——确定性 ID 下存活行 ID 不变，不算删除。
function recordDeletes(table, ids) {
  if (!ids || !ids.length) return;
  const ts = now();
  for (const id of ids) {
    run('INSERT OR REPLACE INTO sync_tombstones (id, table_name, user_id, deleted_at) VALUES ($id, $t, $u, $ts)',
      { $id: id, $t: table, $u: LOCAL_USER_ID, $ts: ts });
  }
}
function recordDelete(table, id) { recordDeletes(table, [id]); }

// ---------- 初始化：加载 sql.js -> 恢复/新建库 -> 建表 -> 播种 ----------
async function initDB() {
  const SQL = await initSqlJs({ locateFile: f => `${SQLJS_CDN}/${f}` });
  const dump = await idbGet(DUMP_KEY);
  db = dump ? new SQL.Database(new Uint8Array(dump)) : new SQL.Database();
  db.exec(DDL);
  migrate();
  seed();
  scheduleSave();
  return db;
}

// 轻量迁移：为存量库补 updated_at（Phase 1 同步水位）。新列允许 NULL，
// 回填为 created_at，使「从未编辑过」的旧行也参与首次全量同步。
function migrate() {
  for (const t of ['trades', 'trade_plans', 'review_reports', 'discipline_rules']) {
    try { db.run(`ALTER TABLE ${t} ADD COLUMN updated_at INTEGER`); } catch (e) { /* 列已存在 */ }
    run(`UPDATE ${t} SET updated_at=created_at WHERE updated_at IS NULL`);
  }
  // broker_templates 纳入同步（§4.2）：补归属与水位。存量自定义模板归属本地账号，
  // 首次同步随推送到云端；内置模板 user_id 恒为 NULL，永不推送。
  try { db.run('ALTER TABLE broker_templates ADD COLUMN user_id TEXT'); } catch (e) { /* 列已存在 */ }
  try { db.run('ALTER TABLE broker_templates ADD COLUMN updated_at INTEGER'); } catch (e) { /* 列已存在 */ }
  run('UPDATE broker_templates SET user_id=$u WHERE is_builtin=0 AND user_id IS NULL', { $u: LOCAL_USER_ID });
  run('UPDATE broker_templates SET updated_at=created_at WHERE updated_at IS NULL');
  try { db.run('DROP INDEX IF EXISTS idx_broker_tpl'); } catch (e) { /* 索引不存在 */ }
  // 内置纪律规则收敛为确定性 ID（'builtin-'+rule_key）：多端各自播种时 ID 一致，
  // 云端 INSERT OR REPLACE 才会幂等去重；否则每台设备 5 条规则会变成 N×5 条。
  // 存量随机 UUID 规则：保留最早一条改写 ID，删除重复（其违规由引擎确定性重跑补齐）。
  for (const r of BUILTIN_RULES) {
    const fixed = 'builtin-' + r.rule_key;
    const rows = q('SELECT id FROM discipline_rules WHERE user_id=$u AND rule_key=$k ORDER BY created_at, id', { $u: LOCAL_USER_ID, $k: r.rule_key });
    if (!rows.length) continue;
    for (const dup of rows.slice(1)) {
      // 登记墓碑：去重删除的规则及其违规也要从云端/其他设备消失
      recordDeletes('rule_violations', q('SELECT id FROM rule_violations WHERE rule_id=$id', { $id: dup.id }).map(r => r.id));
      recordDeletes('discipline_rules', [dup.id]);
      run('DELETE FROM rule_violations WHERE rule_id=$id', { $id: dup.id });
      run('DELETE FROM discipline_rules WHERE id=$id', { $id: dup.id });
    }
    if (rows[0].id !== fixed) {
      run('UPDATE rule_violations SET rule_id=$new WHERE rule_id=$old', { $new: fixed, $old: rows[0].id });
      run('UPDATE discipline_rules SET id=$new WHERE id=$old', { $new: fixed, $old: rows[0].id });
    }
  }
}

function seed() {
  const ts = now();
  if (!q1('SELECT id FROM users WHERE id=$id', { $id: LOCAL_USER_ID })) {
    run(`INSERT INTO users (id, nickname, plan_tier, created_at, updated_at)
         VALUES ($id, '本地用户', 'free', $ts, $ts)`, { $id: LOCAL_USER_ID, $ts: ts });
  }
  for (const t of BUILTIN_TEMPLATES) {
    const exists = q1('SELECT id FROM broker_templates WHERE broker_name=$n AND is_builtin=1', { $n: t.broker_name });
    if (!exists) {
      run(`INSERT INTO broker_templates (id, broker_name, source_type, version, column_mapping, parse_rules, is_builtin, sample_hash, created_at)
           VALUES ($id, $n, 'csv', 1, $m, $p, 1, $h, $ts)`, {
        $id: uuid(), $n: t.broker_name,

        $p: JSON.stringify({ direction_map: DIR_MAP, amount_check: 'price*quantity≈amount' }),
        $h: simpleHash(t.headers.join(',')),
        $ts: ts,
      });
    }

  for (const r of BUILTIN_RULES) {
    const exists = q1('SELECT id FROM discipline_rules WHERE user_id=$u AND rule_key=$k', { $u: LOCAL_USER_ID, $k: r.rule_key });
    if (!exists) {
      run(`INSERT INTO discipline_rules (id, user_id, rule_key, rule_name, params_json, is_builtin_tpl, enabled, created_at)
           VALUES ($id, $u, $k, $n, $p, 1, 1, $ts)`, {
        $id: 'builtin-' + r.rule_key, $u: LOCAL_USER_ID, $k: r.rule_key, $n: r.rule_name, $p: JSON.stringify(r.params), $ts: ts,
      });
    }
  }
}

// ledger.js — 复盘账本（P0-M2）：流水视图 + FIFO 配对 + T+1 校验 + 笔记/标签
// ============================================================

// ---------- FIFO 配对（确定性，可复算） ----------
// 规则：同一 symbol 按 traded_at 升序，买入入队，卖出从队首依次消耗；
// 一笔卖单 + 其消耗的买单份额 = 一个「完整交易笔」（US-04）。
// 返回 { closed: [...完整交易], open: [...未平仓买入], t1: [...当日买回卖违规对] }
function computePairs(trades) {
  const bySymbol = {};
  for (const t of trades) (bySymbol[t.symbol] = bySymbol[t.symbol] || []).push(t);

  const closed = [], open = [], t1 = [];
  let pairSeq = 1;

  for (const symbol of Object.keys(bySymbol)) {
    const list = bySymbol[symbol].slice().sort((a, b) => a.traded_at - b.traded_at || a.source_row_no - b.source_row_no);
    const queue = []; // {trade, remaining}
    for (const t of list) {
      if (t.direction === 'buy') {
        queue.push({ trade: t, remaining: t.quantity });
      } else {
        let remaining = t.quantity;
        const buyIds = [], fragBuys = [];
        let cost = 0, earliestBuy = null;
        while (remaining > 0 && queue.length > 0) {
          const head = queue[0];
          const take = Math.min(head.remaining, remaining);
          // 费用按成交份额线性分摊（确定性）
          cost += take * head.trade.price + head.trade.fee * (take / head.trade.quantity);
          if (!earliestBuy) earliestBuy = head.trade;
          if (dayKey(head.trade.traded_at) === dayKey(t.traded_at)) {
            t1.push({ sellTrade: t, buyTrade: head.trade }); // T+1 硬规则违规线索
          }
          buyIds.push(head.trade.id);
          fragBuys.push(head.trade);
          head.remaining -= take;
          remaining -= take;
          if (head.remaining <= 0) queue.shift();
        }
        const proceeds = t.quantity * t.price - t.fee;
        if (buyIds.length > 0) {
          const closedQty = t.quantity - remaining;
          const closedProceeds = proceeds * (closedQty / t.quantity);
          const pnl = Math.round((closedProceeds - cost) * 100) / 100;
          const tags = new Set();
          for (const b of fragBuys) JSON.parse(b.tags || '[]').forEach(x => tags.add(x));
          JSON.parse(t.tags || '[]').forEach(x => tags.add(x));
          closed.push({
            pairId: `P${String(pairSeq++).padStart(4, '0')}`,
            symbol, symbolName: t.symbol_name || symbol,
            qty: closedQty,
            openAt: earliestBuy.traded_at,
            closeAt: t.traded_at,
            holdingDays: Math.round((t.traded_at - earliestBuy.traded_at) / 86400),
            cost: Math.round(cost * 100) / 100,
            proceeds: Math.round(closedProceeds * 100) / 100,
            pnl,
            ret: cost > 0 ? pnl / cost : 0,
            buyTradeIds: buyIds,
            sellTradeIds: [t.id],
            sellTrade: t,
            tags: Array.from(tags),
          });
        } else {
          // 无持仓可卖：数据异常（超卖），记入异常台账
          t1.push({ sellTrade: t, buyTrade: null });
        }
      }
    }
    for (const it of queue) open.push({ trade: it.trade, remaining: it.remaining });
  }
  closed.sort((a, b) => b.closeAt - a.closeAt);
  return { closed, open, t1 };
}

// 配对结果回写 trades.pair_id / is_t1_locked（[确定性] 字段，仅计算层写入）
function repairAll() {
  const trades = q('SELECT * FROM trades WHERE user_id=$u', { $u: LOCAL_USER_ID });
  const pairs = computePairs(trades);
  const today = dayKey(now());
  run('UPDATE trades SET pair_id=NULL, is_t1_locked=0 WHERE user_id=$u', { $u: LOCAL_USER_ID });
  for (const c of pairs.closed) {
    for (const id of [...c.buyTradeIds, ...c.sellTradeIds]) {
      run('UPDATE trades SET pair_id=$p WHERE id=$id', { $p: c.pairId, $id: id });
    }
  }
  for (const t of trades) {
    if (t.direction === 'buy' && dayKey(t.traded_at) === today) {
      run('UPDATE trades SET is_t1_locked=1 WHERE id=$id', { $id: t.id });
    }
  }
  return pairs;
}

// ============================================================
// discipline.js — 纪律系统（P0-M4）
// 交易前计划 / 规则模板 / 违规自动标记 / 纪律执行率（对标 Edgewonk Tiltmeter）
// 判定 100% 确定性、可复算、可回放（rule_snapshot + evidence_json）
// ============================================================

// ---------- 规则判定纯函数（不读库、不写库，供引擎与影子账户共用） ----------
// 约定：输入 { trades, pairs, params }（trades 已按 traded_at, source_row_no 升序），
// 输出 [{ trade, evidence, violatedAt }]。相同输入必得相同输出（确定性）。
const RULE_CHECKS = {
  // ① 单票仓位上限：单笔买入金额 > 本金 × max_pct
  max_position_pct({ trades, params: p }) {
    const limit = (p.capital || 0) * (p.max_pct || 1);
    const out = [];
    for (const t of trades) {
      if (t.direction === 'buy' && t.amount > limit) {
        out.push({ trade: t, violatedAt: t.traded_at, evidence: { 买入金额: t.amount, 仓位上限: limit, 假设本金: p.capital, 超限金额: Math.round((t.amount - limit) * 100) / 100 } });
      }
    }
    return out;
  },
  // ② 止损纪律：完整交易收益率 < -max_loss_pct（说明 -7% 未执行止损）
  stop_loss({ pairs, params: p }) {
    const out = [];
    for (const c of pairs.closed) {
      if (c.ret < -(p.max_loss_pct || 0.07)) {
        out.push({ trade: c.sellTrade, violatedAt: c.closeAt, evidence: { 标的: c.symbol, 持仓成本: c.cost, 卖出净额: c.proceeds, 收益率: fmtPct(c.ret, 2), 止损线: fmtPct(-(p.max_loss_pct || 0.07), 0) } });
      }
    }
    return out;
  },
  // ③ 尾盘追高：买入时间 ≥ after（默认 14:50）
  no_tail_chase({ trades, params: p }) {
    const [hh, mm] = (p.after || '14:50').split(':').map(Number);
    const out = [];
    for (const t of trades) {
      if (t.direction !== 'buy') continue;
      const d = new Date(t.traded_at * 1000);
      if (d.getHours() * 60 + d.getMinutes() >= hh * 60 + mm) {
        out.push({ trade: t, violatedAt: t.traded_at, evidence: { 买入时间: fmtTime(t.traded_at), 红线: p.after, 买入金额: t.amount } });
      }
    }
    return out;
  },
  // ④ T+1 硬规则：卖出与所消耗买入同日（A股制度红线）
  t1_check({ pairs }) {
    const out = [];
    for (const v of pairs.t1) {
      if (!v.buyTrade) continue; // 超卖异常另行标记
      out.push({ trade: v.sellTrade, violatedAt: v.sellTrade.traded_at, evidence: { 卖出日: fmtDate(v.sellTrade.traded_at), 对应买入日: fmtDate(v.buyTrade.traded_at), 说明: '当日买入当日卖出，违反T+1' } });
    }
    return out;
  },
  // ⑤ 单周交易次数上限：同一 ISO 周内第 N+1 笔起逐笔记违规（防过度交易）
  max_weekly_trades({ trades, params: p }) {
    const max = p.max || 10;
    const byWeek = {};
    for (const t of trades) (byWeek[weekKey(t.traded_at)] = byWeek[weekKey(t.traded_at)] || []).push(t);
    const out = [];
    for (const wk of Object.keys(byWeek)) {
      const list = byWeek[wk];
      if (list.length > max) {
        list.slice(max).forEach((t, i) => out.push({ trade: t, violatedAt: t.traded_at, evidence: { 周: wk, 当周第几笔: max + 1 + i, 上限: max } }));
      }
    }
    return out;
  },
  // ⑥ 报复性交易：一笔亏损平仓后 after_loss_minutes 分钟内新开买入（ZenTrade Revenge Guard 语义）
  // 判定窗口：同 symbol 内「买入 → 连续卖出段」为一个完整平仓事件，卖出段整体盈亏 < 0 且随后 N 分钟内再买入即违规
  revenge_window({ trades, params: p }) {
    const win = (p.after_loss_minutes || 30) * 60;
    const bySymbol = {};
    for (const t of trades) (bySymbol[t.symbol] = bySymbol[t.symbol] || []).push(t);
    const out = [];
    for (const symbol of Object.keys(bySymbol)) {
      let window = null; // {cost, proceeds, lastTs, sellCnt} 当前持仓/平仓累计窗口
      for (const t of bySymbol[symbol]) {
        if (t.direction === 'buy') {
          if (window && window.sellCnt > 0 && t.traded_at - window.lastTs <= win) {
            const pnl = Math.round((window.proceeds - window.cost) * 100) / 100;
            if (pnl < 0) {
              out.push({ trade: t, violatedAt: t.traded_at, evidence: {
                前笔平仓亏损: pnl, 间隔分钟: Math.round((t.traded_at - window.lastTs) / 60),
                冷静期分钟: p.after_loss_minutes || 30, 说明: '亏损平仓后短时间内再次买入（报复性交易）' } });
            }
          }
          window = { cost: t.amount + t.fee, proceeds: 0, lastTs: t.traded_at, sellCnt: 0 }; // 新买入重启窗口
        } else if (window) {
          window.proceeds += t.amount - t.fee; window.lastTs = t.traded_at; window.sellCnt++;
        }
      }
    }
    return out;
  },
  // ⑦ 连败加仓：连续 streak 笔完整交易亏损后，下一笔完整交易的买入成本 > 历史笔均成本
  loss_streak_add({ trades, pairs, params: p }) {
    const streak = p.streak || 2;
    const byId = new Map(trades.map(t => [t.id, t]));
    const closed = pairs.closed.slice().sort((a, b) => a.closeAt - b.closeAt);
    const out = [], hist = [];
    for (const c of closed) {
      if (hist.length >= streak && hist.slice(-streak).every(h => h.pnl < 0)) {
        const avgCost = hist.reduce((s, h) => s + h.cost, 0) / hist.length;
        if (c.cost > avgCost) {
          const bt = byId.get(c.buyTradeIds[0]);
          if (bt) out.push({ trade: bt, violatedAt: c.openAt, evidence: {
            连亏笔数: streak, 本次买入成本: Math.round(c.cost * 100) / 100,
            历史笔均成本: Math.round(avgCost * 100) / 100, 说明: '连续亏损后加仓买入（摊低成本冲动）' } });
        }
      }
      hist.push(c);
    }
    return out;
  },
};

// 对给定规则集 + 成交流执行全部判定（纯函数；影子账户复用同一入口保证口径一致）
function evaluateRules(rules, trades, pairs) {
  const out = [];
  for (const rule of rules) {
    const check = RULE_CHECKS[rule.rule_key];
    if (!check) continue;
    const params = JSON.parse(rule.params_json || '{}');
    for (const hit of check({ trades, pairs, params })) {
      out.push({ rule, trade: hit.trade, evidence: hit.evidence, violatedAt: hit.violatedAt });
    }
  }
  return out;
}

// ---------- 规则引擎：全量重跑（确定性，可回放） ----------
function runRuleEngine() {
  const rules = q('SELECT * FROM discipline_rules WHERE user_id=$u AND enabled=1', { $u: LOCAL_USER_ID });
  const trades = q('SELECT * FROM trades WHERE user_id=$u ORDER BY traded_at, source_row_no', { $u: LOCAL_USER_ID });
  // 墓碑差集：重建前的旧违规 ID 快照；重建后仍存在的（确定性 ID）不算删除
  const oldIds = q('SELECT id FROM rule_violations WHERE user_id=$u', { $u: LOCAL_USER_ID }).map(r => r.id);
  run('DELETE FROM rule_violations WHERE user_id=$u', { $u: LOCAL_USER_ID });
  if (!trades.length) { recordDeletes('rule_violations', oldIds); return; }

  const hits = evaluateRules(rules, trades, computePairs(trades));
  const newIds = new Set();
  // 违规 ID 确定性（'rv-'+rule_id+'-'+trade_id）：引擎全量重跑 DELETE+INSERT 后 ID 不变，
  // 多设备同步 upsert 幂等收敛；若用随机 UUID，每次重跑都会在云端叠加一套新违规。
  for (const h of hits) {
    const vid = 'rv-' + h.rule.id + '-' + h.trade.id;
    newIds.add(vid);
    run(`INSERT INTO rule_violations (id, user_id, rule_id, trade_id, rule_snapshot, evidence_json, violated_at, created_at)
         VALUES ($id, $u, $rid, $tid, $snap, $ev, $va, $ts)`, {
      $id: vid, $u: LOCAL_USER_ID, $rid: h.rule.id, $tid: h.trade.id,
      $snap: h.rule.params_json, $ev: JSON.stringify(h.evidence), $va: h.violatedAt, $ts: now(),
    });
  }
  // 消失的违规（旧 ID 不在新集合中）登记墓碑，随同步传播删除
  recordDeletes('rule_violations', oldIds.filter(id => !newIds.has(id)));
}

// 纪律执行率 = 1 - 违规笔数/总交易笔数（违规笔数按去重交易计）
function disciplineScore() {
  const total = q1('SELECT COUNT(*) c FROM trades WHERE user_id=$u', { $u: LOCAL_USER_ID }).c;
  const violated = q1('SELECT COUNT(DISTINCT trade_id) c FROM rule_violations WHERE user_id=$u', { $u: LOCAL_USER_ID }).c;
  return { total, violated, score: total ? 1 - violated / total : null };
}

// ---------- 交易前计划：确定性匹配（标的+时间窗口，不由 LLM 判定） ----------
function reMatchPlans() {
  const plans = q('SELECT * FROM trade_plans WHERE user_id=$u', { $u: LOCAL_USER_ID });
  for (const p of plans) {
    const m = q1(`SELECT id FROM trades WHERE user_id=$u AND symbol=$s AND direction='buy'
                  AND traded_at BETWEEN $a AND $b ORDER BY traded_at LIMIT 1`,
      { $u: LOCAL_USER_ID, $s: p.symbol, $a: p.plan_window_start, $b: p.plan_window_end });
    const expired = !m && p.plan_window_end < now();
    run('UPDATE trade_plans SET status=$st, matched_trade_id=$mt, updated_at=$ts WHERE id=$id', {
      $st: m ? 'executed' : (expired ? 'expired' : 'open'),
      $mt: m ? m.id : null, $id: p.id, $ts: now(),
    });
  }
}

// ---------- 编码兼容：UTF-8 严格解码失败则 GBK 兜底（券商导出常见 GBK） ----------
function decodeBuffer(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('gbk').decode(buf); }
}

// 交割单日期时间 → 秒级时间戳；时间可空（默认 10:00）
function parseDateTime(dateStr, timeStr) {
  const d = parseDatePart(dateStr);
  if (!d) return null;
  const t = parseTimePart(timeStr || '10:00') || [10, 0, 0];
  return toTs(d, t);
}

function marketOf(symbol) {
  if (symbol.startsWith('6')) return 'SH';
  if (symbol.startsWith('8') || symbol.startsWith('4')) return 'BJ';
  return 'SZ';
}

// ---------- 文件导入主流程 ----------
async function handleFile(file, el) {
  const buf = await file.arrayBuffer();
  const fileHash = await sha256Hex(buf);
  if (q1('SELECT id FROM import_batches WHERE file_hash=$h', { $h: fileHash })) {
    alert('该文件已导入过（SHA256 指纹重复），已拦截重复导入。');
    return;
  }
  const text = decodeBuffer(buf);
  const rows = parseCSV(text);
  if (rows.length < 2) { alert('未解析到有效数据行'); return; }
  const headers = rows[0];
  const dataRows = rows.slice(1);

  // 模板自动命中：表头哈希匹配 broker_templates.sample_hash
  const hash = simpleHash(headers.join(','));
  let tpl = q1('SELECT * FROM broker_templates WHERE sample_hash=$h', { $h: hash });
  if (!tpl) tpl = subsetMatchTemplate(headers);
  if (tpl) {
    const mapping = JSON.parse(tpl.column_mapping);
    doImport({ el, file, fileHash, rows: dataRows, headers, mapping, templateId: tpl.id, templateName: tpl.broker_name });
  } else {
    renderMapper(el, { file, fileHash, headers, dataRows });
  }
}

// 子集命中：模板 column_mapping 覆盖 6 个必填字段、且映射列名全部存在于文件表头即可命中，
// 与列序、额外噪音列无关（doImport 按列名取索引，多余列天然不参与）。
// 解决「同一券商不同版本导出差一列就指纹失效」的问题；多个模板同时满足时取映射列最多者。
function subsetMatchTemplate(headers) {
  const REQUIRED = ['traded_date', 'symbol', 'direction', 'price', 'quantity', 'amount'];
  const inFile = new Set(headers.map(h => String(h || '').trim()));
  let best = null, bestKeys = 0;
  for (const t of q('SELECT * FROM broker_templates')) {
    let mapping;
    try { mapping = JSON.parse(t.column_mapping); } catch (e) { continue; }
    const keys = Object.keys(mapping);
    const fields = Object.values(mapping);
    if (!REQUIRED.every(f => fields.includes(f))) continue;
    if (!keys.every(k => inFile.has(k))) continue;
    if (keys.length > bestKeys) { best = t; bestKeys = keys.length; }
  }
  return best;
}

// 通用 CSV 映射工具（US-03）：前 5 行预览 + 列->标准字段下拉
function renderMapper(el, ctx) {
  const { headers, dataRows } = ctx;
  const customCount = customTemplates().length;      // 已占用的自定义模板数（内置模板不占配额）
  const quota = customTemplateQuota();               // null = 会员不限；数字 = 上限
  const overQuota = quota !== null && customCount >= quota;
  const quotaHint = quota === null
    ? `会员·自定义模板不限（已用 ${customCount}）`
    : `免费版 ${customCount}/${quota}${overQuota ? '，再保存将覆盖旧模板' : ''}`;
  const area = el.querySelector('#mapper-area');
  area.innerHTML = `
  <div class="bg-white rounded-xl border-2 border-indigo-200 p-5 space-y-4">
    <h3 class="font-semibold">未命中模板 — 通用 CSV 映射工具</h3>
    <p class="text-xs text-slate-500">为每一列选择对应的标准字段。保存为自定义模板后，同格式文件再次导入零配置。</p>
    <div class="overflow-x-auto"><table class="min-w-full text-sm">
      <thead><tr>${headers.map((h, i) => `
        <th class="px-3 py-2 text-left">
          <div class="text-xs text-slate-400 mb-1">原始列：${h || '(空)'}</div>
          <select data-col="${i}" class="map-sel border rounded-lg px-2 py-1 text-sm w-36">${STD_FIELDS.map(([v, label]) => `<option value="${v}">${label}</option>`).join('')}</select>
        </th>`).join('')}
      </tr></thead>
      <tbody>${dataRows.slice(0, 5).map(r => `<tr class="border-t border-slate-100">${headers.map((_, i) => `<td class="px-3 py-1.5 text-xs text-slate-500">${r[i] ?? ''}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <div class="flex flex-wrap items-center gap-3">
      <label class="text-sm text-slate-600">模板名（券商/来源）<input id="tpl-name" class="ml-1 border rounded-lg px-2 py-1.5 text-sm" placeholder="如：QMT客户端导出"></label>
      <label class="text-sm text-slate-600 flex items-center gap-1"><input id="tpl-save" type="checkbox" checked> 保存为自定义模板
        <span class="text-xs ${overQuota ? 'text-amber-600' : 'text-slate-400'}">${quotaHint}</span>
      </label>
      <button id="do-import" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">确认映射并导入</button>
      <button id="cancel-import" class="px-4 py-2 bg-slate-100 rounded-lg text-sm hover:bg-slate-200">取消</button>
    </div>
  </div>`;

  // 猜测映射：表头关键字启发式
  const GUESS = [[/日期/, 'traded_date'], [/时间|时刻/, 'traded_time'], [/代码/, 'symbol'], [/名称/, 'symbol_name'], [/方向|操作|买卖/, 'direction'], [/价格|均价|单价|成交价|价/, 'price'], [/数量|股数|份额/, 'quantity'], [/金额/, 'amount'], [/佣金|手续费/, 'commission'], [/印花/, 'stamp_tax'], [/过户/, 'transfer_fee']];
  area.querySelectorAll('.map-sel').forEach(sel => {
    const h = headers[+sel.dataset.col] || '';
    for (const [re, f] of GUESS) if (re.test(h)) { sel.value = f; break; }
  });

  area.querySelector('#cancel-import').onclick = () => area.innerHTML = '';
  area.querySelector('#do-import').onclick = () => {
    const mapping = {};
    area.querySelectorAll('.map-sel').forEach(sel => { if (sel.value) mapping[headers[+sel.dataset.col]] = sel.value; });
    const need = ['traded_date', 'symbol', 'direction', 'price', 'quantity', 'amount'];
    const got = Object.values(mapping);
    const missing = need.filter(f => !got.includes(f));
    if (missing.length) { alert(`必填字段未映射：${missing.join('、')}`); return; }

    let templateId = null, templateName = '未保存模板';
    if (area.querySelector('#tpl-save').checked) {
      const name = area.querySelector('#tpl-name').value.trim() || '自定义模板';
      const mappingJson = JSON.stringify(mapping);
      const sampleHash = simpleHash(headers.join(','));
      const mine = customTemplates(); // 已占用的自定义模板（内置模板不占配额）
      // 额度实时重取：用户可能刚在会员页开通，映射工具已渲染的提示不做依据
      const limit = customTemplateQuota();
      const prev = (limit !== null && mine.length >= limit) ? mine[0] : null; // 达上限则覆盖最早创建的那个

      // 模板名唯一索引校验（broker_name + source_type + version），避免直接抛约束错误中断导入
      const dup = q1(`SELECT id, is_builtin FROM broker_templates WHERE broker_name=$n AND source_type='csv' AND version=1`, { $n: name });
      if (dup && (!prev || dup.id !== prev.id)) {
        alert(`模板名「${name}」已被${dup.is_builtin ? '内置' : '其他自定义'}模板占用，请换一个名称。`);
        return;
      }

      if (prev) {
        const okOverwrite = confirm(
          `免费版仅保留 ${limit} 个自定义模板，当前已用 ${mine.length}/${limit}。\n\n` +
          `保存「${name}」将覆盖「${prev.broker_name}」。\n` +
          `被覆盖模板的列名与映射会记入模板备注，升级会员后可据此恢复。\n\n` +
          `继续导入并覆盖？`
        );
        if (okOverwrite) {
          // 原地 UPDATE 而非删除重建：import_batches.template_id 归属不变，历史批次不会失去模板名
          templateId = prev.id; templateName = name;
          let prevMapping = null;
          try { prevMapping = JSON.parse(prev.column_mapping); } catch (e) { prevMapping = null; }
          run(`UPDATE broker_templates
                  SET broker_name=$n, version=1, column_mapping=$m, sample_hash=$h, parse_rules=$p, created_at=$ts, updated_at=$ts
                WHERE id=$id`, {
            $n: name, $m: mappingJson, $h: sampleHash, $ts: now(), $id: prev.id,
            $p: JSON.stringify({
              direction_map: DIRECTION_MAP,
              // 被覆盖模板的留存信息（升级恢复用），不参与任何解析逻辑
              overwritten_prev: prevMapping ? { broker_name: prev.broker_name, column_mapping: prevMapping } : { broker_name: prev.broker_name },
            }),
          });
        }
        // 取消覆盖：跳过模板保存，导入照常完成（额度提示不阻断数据入库）
      } else {
        templateId = uuid(); templateName = name;
        run(`INSERT INTO broker_templates (id, broker_name, source_type, version, column_mapping, parse_rules, is_builtin, sample_hash, user_id, created_at, updated_at)
             VALUES ($id, $n, 'csv', 1, $m, $p, 0, $h, $u, $ts, $ts)`, {
          $id: templateId, $n: name, $m: mappingJson,
          $p: JSON.stringify({ direction_map: DIRECTION_MAP }),
          $h: sampleHash, $u: LOCAL_USER_ID, $ts: now(),
        });
      }
    }
    doImport({ el, file: ctx.file, fileHash: ctx.fileHash, rows: ctx.dataRows, headers, mapping, templateId, templateName }); // 内部已重新渲染（模板库计数随之刷新）
  };
}

// 按映射解析入库 + 批次记录（解析失败行逐行标注原因，US-01 验收）
function doImport({ el, file, fileHash, rows, headers, mapping, templateId, templateName }) {
  const batchId = uuid(), ts = now();
  const colIdx = {};
  for (const [h, f] of Object.entries(mapping)) {
    const i = headers.indexOf(h);
    if (i >= 0) colIdx[f] = i;
  }
  let ok = 0; const errors = [];
  rows.forEach((r, i) => {
    const rowNo = i + 2; // 原文件行号（含表头行）
    try {
      const tradedAt = parseDateTime(r[colIdx.traded_date], colIdx.traded_time !== undefined ? r[colIdx.traded_time] : null);
      // 代码归一化：券商导出常带交易所前后缀（SH600887 / 600887.SH / sh.600887），
      // 统一提取 6 位数字后再校验，否则真实文件会被整批判为格式异常
      const rawSymbol = String(r[colIdx.symbol] || '').trim();
      const symbol = (rawSymbol.match(/\d{6}/) || [rawSymbol])[0];
      const direction = DIRECTION_MAP[String(r[colIdx.direction] || '').trim()];
      const price = parseFloat(r[colIdx.price]), quantity = parseInt(r[colIdx.quantity]), amount = parseFloat(r[colIdx.amount]);
      if (!tradedAt) throw new Error('成交日期无法解析');
      if (!/^\d{6}$/.test(symbol)) throw new Error(`证券代码格式异常：${rawSymbol}`);
      if (!direction) throw new Error(`买卖方向无法识别：${r[colIdx.direction]}`);
      if (!(price > 0)) throw new Error('成交价格必须为正数');
      if (!(quantity > 0)) throw new Error('成交数量必须为正数');
      if (!(amount > 0)) throw new Error('成交金额必须为正数');
      if (Math.abs(price * quantity - amount) / amount > 0.01) throw new Error('价格×数量 与成交金额偏差 >1%，校验未过');
      let fee;
      if (colIdx.commission !== undefined || colIdx.stamp_tax !== undefined || colIdx.transfer_fee !== undefined) {
        fee = (parseFloat(r[colIdx.commission]) || 0) + (parseFloat(r[colIdx.stamp_tax]) || 0) + (parseFloat(r[colIdx.transfer_fee]) || 0);
        fee = Math.round(fee * 100) / 100;
      } else {
        fee = calcFee(direction, amount); // 缺费用列时按费率确定性补算
      }
      run(`INSERT INTO trades (id, user_id, import_batch_id, source_row_no, symbol, symbol_name, direction, price, quantity, amount, fee, traded_at, market, created_at)
           VALUES ($id, $u, $b, $row, $sym, $name, $dir, $price, $qty, $amt, $fee, $ts2, $mkt, $ts)`, {
        $id: uuid(), $u: LOCAL_USER_ID, $b: batchId, $row: rowNo, $sym: symbol,
        $name: colIdx.symbol_name !== undefined ? String(r[colIdx.symbol_name] || '') : '',
        $dir: direction, $price: price, $qty: quantity, $amt: amount, $fee: fee,
        $ts2: tradedAt, $mkt: marketOf(symbol), $ts: ts,
      });
      ok++;
    } catch (e) { errors.push({ 行号: rowNo, 原因: e.message }); }
  });

  run(`INSERT INTO import_batches (id, user_id, template_id, source_type, file_name, file_hash, raw_file_path, total_rows, parsed_rows, failed_rows, parse_errors, status, created_at)
       VALUES ($id, $u, $tid, 'csv', $fn, $fh, $path, $total, $ok, $fail, $err, $st, $ts)`, {
    $id: batchId, $u: LOCAL_USER_ID, $tid: templateId, $fn: file.name, $fh: fileHash,
    $path: `local://${file.name}`, // 原型无本地文件系统，记录逻辑路径
    $total: rows.length, $ok: ok, $fail: errors.length,
    $err: JSON.stringify(errors), $st: errors.length ? (ok ? 'partial' : 'failed') : 'done', $ts: ts,
  });

  repairAll();       // FIFO 配对回写
  reMatchPlans();    // 计划-成交确定性匹配
  runRuleEngine();   // 纪律规则跑批
  alert(`导入完成（模板：${templateName}）\n成功 ${ok} 行，失败 ${errors.length} 行${errors.length ? '\n失败原因可在批次记录 parse_errors 查看' : ''}`);
  renderImport(el);
  autoSync();        // 已登录时静默推送（未登录为 no-op）
}

// ---------- 模拟数据（确定性 RNG，评审可复现；mulberry32 见 db.js） ----------
const STOCKS = [
  ['600519', '贵州茅台', 1480, 1720, 100, 100], ['000001', '平安银行', 11.2, 13.1, 500, 2000],
  ['300750', '宁德时代', 182, 218, 100, 300], ['601318', '中国平安', 45, 54, 200, 800],
  ['000858', '五粮液', 122, 148, 100, 400], ['002594', '比亚迪', 232, 276, 100, 300],
  ['600036', '招商银行', 32, 39.5, 300, 1000], ['601899', '紫金矿业', 17.5, 22, 500, 2000],
  ['300059', '东方财富', 15, 19.5, 500, 2000], ['688981', '中芯国际', 84, 99, 100, 300],
];

function generateMock(el) {
  const rnd = mulberry32(20261027); // 固定种子，评审可复现
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const rr = (lo, hi, dp = 2) => { const f = Math.pow(10, dp); return Math.round((lo + rnd() * (hi - lo)) * f) / f; };
  const round100 = n => Math.max(100, Math.round(n / 100) * 100);
  const ts = (y, m, d, h, mi) => Math.floor(new Date(y, m - 1, d, h, mi).getTime() / 1000);
  const isWeekday = (y, m, d) => { const w = new Date(y, m - 1, d).getDay(); return w >= 1 && w <= 5; };
  const nextWeekday = (y, m, d) => { while (!isWeekday(y, m, d)) { const t2 = new Date(y, m - 1, d + 1); y = t2.getFullYear(); m = t2.getMonth() + 1; d = t2.getDate(); } return [y, m, d]; };

  const batchId = uuid(), nowTs = now();
  const rows = []; // {symbol,name,dir,price,qty,t,tag}
  let rowNo = 1;
  const addTrade = (s, dir, price, qty, t, tag) => {
    rows.push({ symbol: s[0], name: s[1], dir, price, qty, t, tag: tag || null, rowNo: rowNo++ });
  };
  const tradeTime = () => pick([[9, 35], [9, 48], [10, 12], [10, 40], [11, 5], [13, 15], [13, 50], [14, 20]]);

  // --- 常规往返 22 趟（2026-07-27 ~ 2026-10-24） ---
  for (let i = 0; i < 22; i++) {
    const s = pick(STOCKS);
    const dayOff = Math.floor(rnd() * 62); // 07-27 起 62 天内
    let d = new Date(2026, 6, 27 + dayOff);
    let [by, bm, bd] = nextWeekday(d.getFullYear(), d.getMonth() + 1, d.getDate());
    const hold = pick([1, 2, 3, 3, 5, 5, 8, 13, 15]);
    let close = new Date(by, bm - 1, bd + hold);
    const buyPrice = rr(s[2], s[3]);
    const qty = round100(s[4] + rnd() * (s[5] - s[4]));
    const [bh, bmi] = tradeTime();
    const buyT = ts(by, bm, bd, bh, bmi);
    const openEnded = close > new Date(2026, 9, 24) || rnd() < 0.09; // 少量未平仓
    if (openEnded) { addTrade(s, 'buy', buyPrice, qty, buyT); continue; }
    let [sy, sm, sd] = nextWeekday(close.getFullYear(), close.getMonth() + 1, close.getDate());
    const sellPrice = Math.round(buyPrice * (1 + rr(-0.08, 0.115, 3)) * 100) / 100;
    const [sh, smi] = tradeTime();
    addTrade(s, 'buy', buyPrice, qty, buyT, rnd() < 0.25 ? '计划内' : null);
    addTrade(s, 'sell', sellPrice, qty, ts(sy, sm, sd, sh, smi));
  }

  // --- 冲动交易周：2026-09-07 当周密集 6 趟（12+ 笔，触发单周 ≤10 规则） ---
  const clusterDays = [[9, 7, 9, 8], [9, 7, 9, 9], [9, 8, 9, 9], [9, 8, 9, 10], [9, 9, 9, 10], [9, 9, 9, 11]];
  clusterDays.forEach((cd, i) => {
    const s = pick(STOCKS);
    const buyPrice = rr(s[2], s[3]);
    const qty = round100(s[4] + rnd() * (s[5] - s[4]));
    addTrade(s, 'buy', buyPrice, qty, ts(2026, cd[0], cd[1], i % 2 ? 14 : 10, i % 2 ? 52 : 20), '追涨'); // 部分尾盘追高
    addTrade(s, 'sell', Math.round(buyPrice * (1 + rr(-0.05, 0.07, 3)) * 100) / 100, qty, ts(2026, cd[2], cd[3], 10, 5));
  });

  // --- 违规1：尾盘追高买入（14:50 后） ---
  [[9, 15, 14, 53], [10, 13, 14, 55]].forEach(v => {
    const s = pick(STOCKS);
    const buyPrice = rr(s[2], s[3]);
    const qty = round100(s[4] + rnd() * (s[5] - s[4]));
    addTrade(s, 'buy', buyPrice, qty, ts(2026, v[0], v[1], v[2], v[3]), '追涨');
    addTrade(s, 'sell', Math.round(buyPrice * (1 + rr(-0.04, 0.06, 3)) * 100) / 100, qty, ts(2026, v[0], v[1] + 4, 10, 30));
  });

  // --- 违规2：单票超仓位（茅台 200 股 ≈ 32 万 > 100 万本金 × 30%） ---
  addTrade(STOCKS[0], 'buy', 1605.50, 200, ts(2026, 8, 20, 9, 40));
  addTrade(STOCKS[0], 'sell', 1678.00, 200, ts(2026, 9, 11, 10, 15));

  // --- 违规3：止损纪律（宁德时代 -10% 才割，超 -7% 红线） ---
  addTrade(STOCKS[2], 'buy', 210.00, 100, ts(2026, 8, 26, 10, 0));
  addTrade(STOCKS[2], 'sell', 189.00, 100, ts(2026, 9, 2, 13, 40), '止损');

  // --- 违规4：报复性交易（宁德时代止损亏损后 25 分钟内再买回；同标的情绪报复） ---
  // 9-02 13:40 止损卖出亏损后，14:05 立刻反手买入（间隔 25 分钟 < 30 分钟），触发 revenge_window
  addTrade(STOCKS[2], 'buy', 190.50, 100, ts(2026, 9, 2, 14, 5), '报复性买入');
  addTrade(STOCKS[2], 'sell', 195.20, 100, ts(2026, 9, 4, 10, 0));

  // --- 违规5：报复性交易（平安银行割肉后 15 分钟内再追买；同标的情绪报复） ---
  // 9-18 10:00 买入、11:30 割出亏损、11:45 立刻买回（间隔 15 分钟 < 30 分钟），触发 revenge_window
  addTrade(STOCKS[1], 'buy', 12.30, 2000, ts(2026, 9, 18, 10, 0));
  addTrade(STOCKS[1], 'sell', 11.85, 2000, ts(2026, 9, 18, 11, 30), '止损');
  addTrade(STOCKS[1], 'buy', 11.92, 2000, ts(2026, 9, 18, 11, 45), '报复性买入');
  addTrade(STOCKS[1], 'sell', 12.05, 2000, ts(2026, 9, 19, 10, 0));

  // --- 今日买入（演示 T+1 锁定） + 2 笔未平仓 ---
  addTrade(STOCKS[6], 'buy', 36.80, 500, ts(2026, 10, 27, 9, 45));
  addTrade(STOCKS[8], 'buy', 17.60, 1000, ts(2026, 10, 23, 13, 20));
  addTrade(STOCKS[9], 'buy', 92.30, 100, ts(2026, 10, 26, 10, 50));

  // 落库（费用确定性计算：佣金万2.5最低5元/印花税卖出0.05%/过户费0.001%）
  rows.sort((a, b) => a.t - b.t);
  rows.forEach((r, i) => {
    const amount = Math.round(r.price * r.qty * 100) / 100;
    run(`INSERT INTO trades (id, user_id, import_batch_id, source_row_no, symbol, symbol_name, direction, price, quantity, amount, fee, traded_at, market, tags, created_at)
         VALUES ($id, $u, $b, $row, $sym, $name, $dir, $price, $qty, $amt, $fee, $t, $mkt, $tags, $ts)`, {
      $id: uuid(), $u: LOCAL_USER_ID, $b: batchId, $row: i + 2, $sym: r.symbol, $name: r.name,
      $dir: r.dir, $price: r.price, $qty: r.qty, $amt: amount, $fee: calcFee(r.dir, amount),
      $t: r.t, $mkt: marketOf(r.symbol), $tags: JSON.stringify(r.tag ? [r.tag] : []), $ts: nowTs,
    });
  });
  run(`INSERT INTO import_batches (id, user_id, template_id, source_type, file_name, file_hash, raw_file_path, total_rows, parsed_rows, failed_rows, parse_errors, status, created_at)
       VALUES ($id, $u, NULL, 'csv', '模拟数据（内置生成）', $fh, 'generated://mock', $n, $n, 0, '[]', 'done', $ts)`, {
    $id: batchId, $u: LOCAL_USER_ID, $fh: 'mock-' + nowTs, $n: rows.length, $ts: nowTs,
  });

  repairAll();
  reMatchPlans();
  runRuleEngine();
  alert(`已生成 ${rows.length} 笔模拟成交（2026-07-27 至 2026-10-27），含故意埋入的违规样本，去「归因看板」和「纪律系统」查看效果。`);
  renderImport(el);
  autoSync();
}

let heatMonth = null; // 日历热力图当前月份

function renderDashboard(el) {
  const trades = q('SELECT * FROM trades WHERE user_id=$u ORDER BY traded_at', { $u: LOCAL_USER_ID });
  if (!trades.length) {
    el.innerHTML = `
    <div class="p-6">
      <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-16 text-center">
        <div class="text-lg font-semibold text-slate-700 mb-2">还没有数据，先导入交割单</div>
        <p class="text-sm text-slate-500 mb-5">导入交割单是激活路径的必经环节——归因与纪律都建立在真实成交之上。<br>也可以先生成 3 个月模拟数据，零成本体验完整闭环。</p>
        <a href="#/import" class="inline-block px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm">前往交割单导入中心</a>
      </div>
    </div>`;
    return;
  }

  const pairs = repairAll();
  const closed = pairs.closed;

  // ---------- 指标区（每个指标附 SQL 口径注释） ----------
  // 累计盈亏：SELECT SUM(每笔完整交易净盈亏) —— 净盈亏=卖出净额−买入成本(含费)，来自 FIFO 配对
  const totalPnl = Math.round(closed.reduce((s, c) => s + c.pnl, 0) * 100) / 100;
  // 本月盈亏：SELECT SUM(pnl) WHERE strftime('%Y-%m', closeAt)=本月
  const thisMonth = monthKey(Date.now() / 1000);
  const monthPnl = Math.round(closed.filter(c => monthKey(c.closeAt) === thisMonth).reduce((s, c) => s + c.pnl, 0) * 100) / 100;
  // 胜率：盈利笔数 / 已平仓总笔数（SELECT COUNT(*) WHERE pnl>0 / COUNT(*)）
  const wins = closed.filter(c => c.pnl > 0);
  const winRate = closed.length ? wins.length / closed.length : null;
  // 盈亏比：平均盈利 / 平均亏损绝对值
  const losses = closed.filter(c => c.pnl < 0);
  const avgWin = wins.length ? wins.reduce((s, c) => s + c.pnl, 0) / wins.length : 0;
  const avgLoss = losses.length ? Math.abs(losses.reduce((s, c) => s + c.pnl, 0) / losses.length) : 0;
  const profitFactor = avgLoss > 0 ? avgWin / avgLoss : null;
  // 平均持仓周期：AVG(closeAt - openAt)，单位天
  const avgHold = closed.length ? closed.reduce((s, c) => s + c.holdingDays, 0) / closed.length : null;
  // 纪律执行率：1 − 违规笔数/总交易笔数（来自纪律系统）
  const ds = disciplineScore();

  // 持仓周期分布：<1天 / 1-3天 / 3-10天 / >10天
  const buckets = [
    { label: '<1天(T+0)', test: d => d < 1, count: 0, pnl: 0 },
    { label: '1-3天', test: d => d >= 1 && d <= 3, count: 0, pnl: 0 },
    { label: '3-10天', test: d => d > 3 && d <= 10, count: 0, pnl: 0 },
    { label: '>10天', test: d => d > 10, count: 0, pnl: 0 },
  ];
  for (const c of closed) {
    const b = buckets.find(b => b.test(c.holdingDays));
    b.count++; b.pnl = Math.round((b.pnl + c.pnl) * 100) / 100;
  }
  const maxBucket = Math.max(...buckets.map(b => b.count), 1);

  // 个股盈亏排名（已实现）：SELECT symbol, SUM(pnl) GROUP BY symbol ORDER BY ...
  const bySymbol = {};
  for (const c of closed) {
    (bySymbol[c.symbol] = bySymbol[c.symbol] || { symbol: c.symbol, name: c.symbolName, pnl: 0, count: 0, trades: [] });
    bySymbol[c.symbol].pnl += c.pnl; bySymbol[c.symbol].count++; bySymbol[c.symbol].trades.push(c);
  }
  const symList = Object.values(bySymbol).map(s => ({ ...s, pnl: Math.round(s.pnl * 100) / 100 }));
  const topWin = symList.filter(s => s.pnl > 0).sort((a, b) => b.pnl - a.pnl).slice(0, 5);
  const topLose = symList.filter(s => s.pnl < 0).sort((a, b) => a.pnl - b.pnl).slice(0, 5);

  // 月度盈亏日历：已实现盈亏按平仓日落位（A股习惯：红涨绿跌）
  if (!heatMonth) heatMonth = monthKey(closed[0] ? closed[0].closeAt : Date.now() / 1000);
  const byDay = {};
  for (const c of closed) {
    const k = dayKey(c.closeAt);
    (byDay[k] = byDay[k] || { pnl: 0, trades: [] }).pnl += c.pnl;
    byDay[k].trades.push(c);
  }

  // 标签维度归因（行为归因雏形）：SELECT tag, SUM(pnl) FROM 完整交易×标签
  const byTag = {};
  for (const c of closed) {
    for (const tag of c.tags) {
      (byTag[tag] = byTag[tag] || { tag, pnl: 0, count: 0, trades: [] });
      byTag[tag].pnl += c.pnl; byTag[tag].count++; byTag[tag].trades.push(c);
    }
  }
  const tagList = Object.values(byTag).map(t => ({ ...t, pnl: Math.round(t.pnl * 100) / 100 })).sort((a, b) => a.pnl - b.pnl);

  el.innerHTML = `
  <div class="p-6 space-y-6">
    <!-- KPI 卡片：每个数字可点击溯源 -->
    <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3">
      ${[
        ['累计盈亏', pnlTxt(totalPnl), pnlCls(totalPnl), 'closed', `已平仓 ${closed.length} 笔`],
        ['本月已实现盈亏', pnlTxt(monthPnl), pnlCls(monthPnl), 'month', thisMonth],
        ['胜率', winRate === null ? '—' : fmtPct(winRate), 'text-slate-800', 'winrate', `${wins.length}胜 / ${closed.length}笔`],
        ['盈亏比', profitFactor === null ? '—' : profitFactor.toFixed(2), 'text-slate-800', 'pf', `均盈${fmtMoney(avgWin)} / 均亏${fmtMoney(avgLoss)}`],
        ['平均持仓周期', avgHold === null ? '—' : avgHold.toFixed(1) + ' 天', 'text-slate-800', 'hold', 'FIFO 配对口径'],
        ['纪律执行率', ds.score === null ? '—' : fmtPct(ds.score), ds.score !== null && ds.score < 0.9 ? 'text-amber-500' : 'text-emerald-600', 'discipline', `${ds.violated} 笔违规 / ${ds.total} 笔 · 全历史`],
      ].map(([label, value, cls, key, sub]) => `
        <button class="kpi-card bg-white rounded-xl border border-slate-200 p-4 text-left hover:border-indigo-300 hover:shadow-sm transition" data-trace="${key}">
          <div class="text-xs text-slate-500">${label}</div>
          <div class="text-xl font-bold mt-1 ${cls}">${value}</div>
          <div class="text-xs text-slate-400 mt-1">${sub}</div>
        </button>`).join('')}
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <!-- 持仓周期分布（SVG 手绘柱状图） -->
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <h3 class="font-semibold text-sm mb-4">持仓周期分布 <span class="text-xs font-normal text-slate-400">笔数 / 合计盈亏</span></h3>
        <div class="space-y-3">${buckets.map(b => `
          <button class="bucket-row w-full flex items-center gap-3 group" data-bucket="${b.label}">
            <span class="w-20 text-xs text-slate-500 text-right">${b.label}</span>
            <div class="flex-1 h-6 bg-slate-100 rounded overflow-hidden">
              <div class="h-full rounded ${b.pnl >= 0 ? 'bg-red-300' : 'bg-green-300'} group-hover:opacity-80" style="width:${b.count / maxBucket * 100}%"></div>
            </div>
            <span class="w-28 text-xs text-left ${pnlCls(b.pnl)}">${b.count}笔 · ${pnlTxt(b.pnl)}</span>
          </button>`).join('')}
        </div>
      </div>

      <!-- 持仓时长 vs 盈亏散点图 -->
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <h3 class="font-semibold text-sm mb-3">持仓时长 vs 盈亏 <span class="text-xs font-normal text-slate-400">每笔一个点 · 红盈绿亏</span></h3>
        ${(() => {
          const maxDays = Math.max(...closed.map(c => c.holdingDays), 1);
          const maxAbsPnl = Math.max(...closed.map(c => Math.abs(c.pnl)), 1);
          const W = 400, H = 220, pad = { l: 45, r: 15, t: 15, b: 30 };
          const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
          const x = d => pad.l + (d / maxDays) * iw;
          const y = p => pad.t + ih / 2 - (p / maxAbsPnl) * (ih / 2) * 0.9;
          const pts = closed.map(c => {
            const px = x(c.holdingDays), py = y(c.pnl);
            const col = c.pnl >= 0 ? '#dc2626' : '#16a34a';
            return `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="${col}" fill-opacity="0.7" stroke="${col}" stroke-width="1" class="scatter-pt" data-pair="${c.pairId}" style="cursor:pointer"><title>${c.symbolName} · ${c.holdingDays}天 · ${pnlTxt(c.pnl)}</title></circle>`;
          }).join('');
          const gridY = [0, 0.5, 1].map(f => {
            const gy = pad.t + ih / 2 - (f - 0.5) * ih * 0.9;
            return `<line x1="${pad.l}" y1="${gy}" x2="${W - pad.r}" y2="${gy}" stroke="#e2e8f0" stroke-width="1"/>`;
          }).join('');
          const labelY = [1, 0, -1].map(f => {
            const gy = pad.t + ih / 2 - (f * 0.9) * ih / 2;
            const v = Math.round(maxAbsPnl * f * 0.9);
            return `<text x="${pad.l - 6}" y="${gy + 4}" text-anchor="end" font-size="11" fill="#94a3b8">${fmtMoney(v)}</text>`;
          }).join('');
          return `<div class="overflow-x-auto -mx-1 px-1"><svg viewBox="0 0 ${W} ${H}" class="h-auto w-full" style="min-width:400px">
            <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${H - pad.b}" stroke="#cbd5e1" stroke-width="1"/>
            <line x1="${pad.l}" y1="${H - pad.b}" x2="${W - pad.r}" y2="${H - pad.b}" stroke="#cbd5e1" stroke-width="1"/>
            <line x1="${pad.l}" y1="${pad.t + ih / 2}" x2="${W - pad.r}" y2="${pad.t + ih / 2}" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
            ${gridY}
            ${labelY}
            <text x="${pad.l - 6}" y="${pad.t + ih / 2 + 4}" text-anchor="end" font-size="11" fill="#64748b" font-weight="500">0</text>
            <text x="${(pad.l + W - pad.r) / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#94a3b8">持仓天数</text>
            <text x="${pad.l - 30}" y="${pad.t + 8}" font-size="11" fill="#94a3b8" transform="rotate(-90 ${pad.l - 30} ${pad.t + 8})" text-anchor="end">盈亏</text>
            ${pts}
          </svg></div>`;
        })()}
        <p class="text-xs text-slate-400 mt-2">右上=拿得住且赚；右下=拿得住但亏；左上=短炒赚钱；左下=短炒亏钱。点击点可溯源。</p>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4">
      <!-- 时段 × 星期 归因热力图 -->
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <h3 class="font-semibold text-sm mb-1">建仓时段 × 星期 归因 <span class="text-xs font-normal text-slate-400">什么时间下的单最容易亏</span></h3>
        <p class="text-xs text-slate-400 mb-3">按建仓（买入）时间落位，非平仓时间。红=合计盈利，绿=合计亏损，颜色越深金额越大；格内为笔数。</p>
        ${(() => {
          // 归因口径：以每个完整交易的「首笔买入时间」定位时段与星期
          const tMap = new Map(trades.map(t => [t.id, t]));
          const slots = [
            ['09:30-10:00', 570, 600], ['10:00-11:30', 600, 690],
            ['13:00-14:00', 780, 840], ['14:00-14:50', 840, 890], ['14:50-15:00', 890, 900],
          ];
          const days = ['周一', '周二', '周三', '周四', '周五'];
          const grid = slots.map(() => days.map(() => ({ pnl: 0, n: 0 })));
          let unplaced = 0;
          for (const c of closed) {
            const bt = tMap.get((c.buyTradeIds || [])[0]);
            if (!bt) { unplaced++; continue; }
            const d = new Date(bt.traded_at * 1000);
            const wd = d.getDay() - 1;           // 周一=0
            if (wd < 0 || wd > 4) { unplaced++; continue; }
            const mm = d.getHours() * 60 + d.getMinutes();
            const si = slots.findIndex(s => mm >= s[1] && mm < s[2]);
            if (si < 0) { unplaced++; continue; }
            grid[si][wd].pnl += c.pnl;
            grid[si][wd].n++;
          }
          const maxAbs = Math.max(1, ...grid.flat().map(x => Math.abs(x.pnl)));
          const cell = (v, n, si, di) => {
            if (!n) return `<div class="h-10 rounded bg-slate-50" data-si="${si}" data-di="${di}"></div>`;
            const a = Math.min(0.85, Math.abs(v) / maxAbs * 0.85);
            const bg = v >= 0 ? `rgba(220,38,38,${a.toFixed(2)})` : `rgba(22,163,74,${a.toFixed(2)})`;
            return `<div class="h-10 rounded flex flex-col items-center justify-center leading-tight" data-si="${si}" data-di="${di}" style="background:${bg}" title="${slots[si][0]} ${days[di]} · ${n} 笔 · 合计 ${v >= 0 ? '+' : ''}${fmtMoney(v)}">
              <span class="text-xs font-medium ${a > 0.5 ? 'text-white' : (v >= 0 ? 'text-red-600' : 'text-green-600')}">${v >= 0 ? '+' : ''}${Math.round(v)}</span>
              <span class="text-xs ${a > 0.5 ? 'text-white/80' : 'text-slate-400'}">${n}笔</span>
            </div>`;
          };

// ===== 拼接文件 7/14：js/signal.js =====
// ============================================================
// ============================================================
// signal.js — P1-M6 信号 vs 成交三层对照
// 全部确定性计算：匹配规则 v1 / 滑点 / 延迟 / 执行率 / 漏跟单率
// 红线：不引入 LLM；signal_fills 全部字段为确定性写入
// ============================================================

// ---------- 表头归一化：去 BOM / 空白 / 单位括号 ----------
function normHeader(h) {
  return String(h || '')
    .replace(/^\uFEFF/, '')
    .replace(/[\s\u3000]/g, '')
    .replace(/（/g, '(').replace(/）/g, ')')
    .replace(/\([^)]*\)/g, '')          // 委托价格(元) → 委托价格
    .replace(/[，,.:：]/g, '')
    .toLowerCase();
}

// ---------- 股票代码归一化：600519.SH / SH600519 / sh.600519 → 600519 ----------
// 必须归一化，否则与 trades.symbol（6 位纯数字）永远匹配不上，全部误判为漏跟单
function normSymbol(s) {
  const raw = String(s || '').trim();
  const m = raw.match(/(\d{6})/);
  return m ? m[1] : (raw || null);
}

// ---------- 数值清洗：千分位 / 单位后缀 ----------
function parsePrice(v) {
  const s = String(v === null || v === undefined ? '' : v).replace(/[,\s元]/g, '');
  const n = parseFloat(s);
  return n > 0 ? Math.round(n * 1000) / 1000 : null;
}
function parseQty(v) {
  const s = String(v === null || v === undefined ? '' : v).replace(/[,\s]/g, '');
  const isHand = s.indexOf('手') >= 0;   // A 股 1 手 = 100 股
  const n = Math.floor(parseFloat(s.replace(/[手股张]/g, '')));
  if (!(n > 0)) return null;
  return isHand ? n * 100 : n;
}

// ---------- 表头语义识别（不绑定列数 / 列序） ----------
// 真实导出文件普遍带「委托编号 / 证券名称 / 成交金额 / 手续费」等噪音列，
// 且各家列数不同，因此放弃「表头与模板逐列相等」的硬匹配，改按语义角色识别。
const FIELD_LABEL = {
  signal_time: '时间', trade_date: '日期', symbol: '代码',
  direction: '方向', target_price: '价格', target_qty: '数量',
};
const IGNORE_RE = /金额|额|名称|name|编号|order_?id|委托号|合同|手续费|佣金|印花税|过户费|fee|commission|备注|remark|状态|status|账户|账号|策略|strategy|持仓|可用|市值|盈亏/;

const BASE_ROLES = [
  ['signal_time', /时间|^(datetime|time)$|_time$/],
  ['trade_date', /日期|date/],
  ['symbol', /代码|symbol|security|标的|^code$|stock_?code|sec_?code/],
  ['direction', /方向|买卖|操作|^side$|^dir(ection)?$|order_?type|entrust_?side|bs_?flag/],
];
// 价格 / 数量分强弱两轮：先认「委托 / 信号 / 目标」语义，缺列时降级取通用价 / 量
const PRICE_ROLES = [/(委托|信号|目标|计划|预计)价/, /价|price|prc/];
const QTY_ROLES = [/(委托|信号|目标|计划|预计)(数)?量/, /量|qty|volume|vol/];

function detectColumns(headers) {
  const norm = headers.map(normHeader);
  const used = new Set();
  const map = {};
  const pick = re => norm.findIndex((h, idx) => !used.has(idx) && !!h && !IGNORE_RE.test(h) && re.test(h));
  for (const [field, re] of BASE_ROLES) {
    const i = pick(re);
    if (i >= 0) { map[field] = i; used.add(i); }
  }
  for (const re of PRICE_ROLES) {
    const i = pick(re);
    if (i >= 0) { map.target_price = i; used.add(i); break; }
  }
  for (const re of QTY_ROLES) {
    const i = pick(re);
    if (i >= 0) { map.target_qty = i; used.add(i); break; }
  }
  return { map, norm };
}

function mappingText(headers, map) {
  return Object.entries(FIELD_LABEL)
    .filter(([f]) => map[f] !== undefined)
    .map(([f, label]) => `${label}←「${headers[map[f]]}」`)
    .join('  ');
}
function unmappedHeaders(headers, map) {
  const usedIdx = new Set(Object.values(map));
  return headers.filter((h, i) => !usedIdx.has(i) && String(h).trim()).slice(0, 6);
}

// ---------- 信号 CSV 解析入口 ----------
// 返回 { ok, errors, mapping, unmapped, dupCount }；mapping 供 UI 展示识别结果（可审计）
function parseSignalsCSV(text, platformHint = 'other') {
  const rows = parseCSV(text);
  if (rows.length < 2) return { ok: [], errors: [{ 行号: 1, 原因: '无有效数据行' }], mapping: '', unmapped: [] };

  const headers = rows[0];
  const dataRows = rows.slice(1);
  const { map } = detectColumns(headers);

  // 时间可由「时间列自带日期」或「日期列 + 时间列」拼出，至少要有一列
  const need = [];
  if (map.signal_time === undefined && map.trade_date === undefined) need.push('signal_time');
  ['symbol', 'direction', 'target_price', 'target_qty'].forEach(f => { if (map[f] === undefined) need.push(f); });

  const base = { mapping: mappingText(headers, map), unmapped: unmappedHeaders(headers, map) };
  if (need.length) {
    const missTxt = need.map(f => FIELD_LABEL[f]).join('、');
    return {
      ...base,
      ok: [],
      errors: [{ 行号: 1, 原因: `无法识别必要字段：${missTxt}；实际表头：${headers.join(' / ')}` }],
    };
  }

  const ok = [], errors = [];
  const nowTs = now();
  const seen = new Set();
  let dupCount = 0;

  dataRows.forEach((r, i) => {
    const lineNo = i + 2;
    try {
      const tCell = map.signal_time !== undefined ? String(r[map.signal_time] || '').trim() : '';
      const dCell = map.trade_date !== undefined ? String(r[map.trade_date] || '').trim() : '';

      // 时间列可能自带日期（2026-10-03 09:35:21），否则用日期列拼
      const d = parseDatePart(tCell) || parseDatePart(dCell);
      if (!d) throw new Error('日期缺失或无法解析');
      const t = parseTimePart(tCell) || parseTimePart(dCell) || [9, 30, 0];
      const ts = toTs(d, t);

      const symbol = normSymbol(r[map.symbol]);
      if (!symbol) throw new Error('标的代码为空');
      const dir = normDirection(r[map.direction]);
      if (!dir) throw new Error(`方向无法识别：${r[map.direction]}`);
      const price = parsePrice(r[map.target_price]);
      if (price === null) throw new Error(`价格异常：${r[map.target_price]}`);
      const qty = parseQty(r[map.target_qty]);
      if (qty === null) throw new Error(`数量异常：${r[map.target_qty]}`);

      // 完全重复行剔除（同一秒 / 标的 / 方向 / 价格 / 数量）
      const key = [symbol, dir, price, qty, ts].join('|');
      if (seen.has(key)) { dupCount++; return; }
      seen.add(key);

      ok.push({
        id: uuid(),
        user_id: LOCAL_USER_ID,
        platform: platformHint,
        symbol, direction: dir, signal_price: price, signal_qty: qty,
        signaled_at: ts, strategy_name: null, backtest_ref: null,
        import_batch_id: null,
        created_at: nowTs,
      });
    } catch (e) { errors.push({ 行号: lineNo, 原因: e.message }); }
  });

  return { ...base, ok, errors, dupCount };
}

// ---------- autoMatch 核心算法 v1 ----------
// 规则：同一 symbol + 同方向 + 成交时间在信号 [0, +3600] 秒窗口内
// 一条信号可能对应多笔成交（分批）→ filled / partial
function autoMatch() {
  const ts = now();
  // 墓碑差集快照：重建后仍存在的 fill（确定性 ID）不算删除
  const oldFillIds = q('SELECT id FROM signal_fills').map(r => r.id);
  // 清空旧 fill（重新跑）
  run('DELETE FROM signal_fills');

  const signals = q('SELECT * FROM signals WHERE user_id=$u ORDER BY signaled_at', { $u: LOCAL_USER_ID });
  const allTrades = q('SELECT * FROM trades WHERE user_id=$u ORDER BY traded_at', { $u: LOCAL_USER_ID });

  if (!signals.length || !allTrades.length) {
    recordDeletes('signal_fills', oldFillIds);
    return { signals, fills: [] };
  }

  const fills = [];
  // 信号 vs 成交匹配
  for (const sig of signals) {
    // 窗口内候选成交
    const candidates = allTrades.filter(t =>
      t.symbol === sig.symbol && t.direction === sig.direction &&
      t.traded_at >= sig.signaled_at && t.traded_at <= sig.signaled_at + 3600
    );
    if (!candidates.length) {
      // missed（漏跟单）；fill ID 确定性：autoMatch 全量 DELETE+重建后 ID 不变，多端同步幂等
      fills.push({
        id: 'sf-m-' + sig.id, user_id: LOCAL_USER_ID, signal_id: sig.id, trade_id: null,
        match_status: 'missed', slippage: null, delay_seconds: null,
        deviation_amount: null, match_rule_version: 'v1', created_at: ts,
      });
      continue;
    }
    // 取最早时间 <= 目标数量累加
    candidates.sort((a, b) => a.traded_at - b.traded_at);
    let filledQty = 0, earliest = null, weightedPrice = 0;
    const matchedTradeIds = [];
    for (const t of candidates) {
      matchedTradeIds.push(t.id);
      filledQty += t.quantity;
      weightedPrice += t.price * t.quantity;
      if (earliest === null) earliest = t.traded_at;
      if (filledQty >= sig.signal_qty) break;
    }
    // 滑点 & 延迟
    const avgPrice = weightedPrice / filledQty;
    const slippage = Math.round((avgPrice - sig.signal_price) * 10000) / 10000;
    const delay = earliest - sig.signaled_at;
    const deviation = Math.round((avgPrice - sig.signal_price) * filledQty * 100) / 100;
    const status = filledQty >= sig.signal_qty ? 'filled' : 'partial';

    // 逐成交写 signal_fills（每个 matched trade 一条 fill）
    matchedTradeIds.forEach((tradeId, i) => {
      fills.push({
        id: 'sf-' + sig.id + '-' + tradeId, user_id: LOCAL_USER_ID, signal_id: sig.id, trade_id: tradeId,
        match_status: i === matchedTradeIds.length - 1 ? status : 'partial',
        slippage, delay_seconds: delay, deviation_amount: deviation,
        match_rule_version: 'v1', created_at: ts,
      });
    });
  }

  // extra（有成交但无信号）
  const signalWins = new Set(signals.map(s => s.symbol + '|' + s.direction));
  allTrades.forEach(t => {
    const inSignalWindow = signals.some(s =>
      s.symbol === t.symbol && s.direction === t.direction &&
      t.traded_at >= s.signaled_at - 10 && t.traded_at <= s.signaled_at + 3600 + 30
    );
    if (!inSignalWindow) {
      fills.push({
        id: 'sf-x-' + t.id, user_id: LOCAL_USER_ID, signal_id: null, trade_id: t.id,
        match_status: 'extra', slippage: null, delay_seconds: null,
        deviation_amount: null, match_rule_version: 'v1', created_at: ts,
      });
    }
  });

  // 批量写入
  fills.forEach(f => {
    run(`INSERT INTO signal_fills (id, user_id, signal_id, trade_id, match_status, slippage, delay_seconds, deviation_amount, match_rule_version, created_at)
         VALUES ($id, $u, $sid, $tid, $s, $sl, $d, $dev, $v, $ts)`, {
      $id: f.id, $u: f.user_id, $sid: f.signal_id, $tid: f.trade_id,
      $s: f.match_status, $sl: f.slippage, $d: f.delay_seconds,
      $dev: f.deviation_amount, $v: f.match_rule_version, $ts: f.created_at,
    });
  });

  // 消失的 fill（旧 ID 不在新集合中）登记墓碑，随同步传播删除
  const newFillIds = new Set(fills.map(f => f.id));
  recordDeletes('signal_fills', oldFillIds.filter(id => !newFillIds.has(id)));

  return { signals, fills };
}

// ---------- computeAttribution ----------
function computeAttribution() {
  const sigCount = q1('SELECT COUNT(*) c FROM signals WHERE user_id=$u', { $u: LOCAL_USER_ID }).c;
  if (!sigCount) return null;

  const f = q(`SELECT sf.*, s.symbol, s.direction, s.signal_price, s.signal_qty, s.signaled_at, t.price AS trade_price, t.quantity AS trade_qty
               FROM signal_fills sf
               LEFT JOIN signals s ON s.id = sf.signal_id
               LEFT JOIN trades t ON t.id = sf.trade_id
               WHERE sf.user_id=$u`, { $u: LOCAL_USER_ID });

  const filled = f.filter(x => x.match_status === 'filled');
  const partials = f.filter(x => x.match_status === 'partial');
  const missed = f.filter(x => x.match_status === 'missed');
  const extra = f.filter(x => x.match_status === 'extra');
  const totalSignals = sigCount;
  const execRate = filled.length / totalSignals;
  const missRate = missed.length / totalSignals;

  // 滑点分布（对信号去重：每个 signal_id 取最后一条 fill 的 slippage）
  const sigLast = {};
  f.forEach(x => { if (x.signal_id) sigLast[x.signal_id] = x; });
  const slipArr = Object.values(sigLast).filter(x => x.slippage !== null && x.match_status !== 'missed');
  const slipBuckets = [
    { label: '≤0', test: v => v <= 0, count: 0 },
    { label: '0–0.5%', test: v => v > 0 && v <= 0.005, count: 0 },
    { label: '0.5–2%', test: v => v > 0.005 && v <= 0.02, count: 0 },
    { label: '>2%', test: v => v > 0.02, count: 0 },
  ];
  slipArr.forEach(x => {
    // slippage 是价格差绝对值，归一化为 %：slippage / signal_price
    const pct = x.slippage / x.signal_price;
    const b = slipBuckets.find(b => b.test(pct)); if (b) b.count++;
  });

  // 平均滑点（简单均值；加权需额外查 trades 量）
  const avgSlip = slipArr.length ? slipArr.reduce((s, x) => s + x.slippage, 0) / slipArr.length : 0;

  // 延迟分布（秒）
  const delayArr = Object.values(sigLast).filter(x => x.delay_seconds !== null);
  const delayBuckets = [
    { label: '≤30s', test: d => d <= 30, count: 0 },
    { label: '30–120s', test: d => d > 30 && d <= 120, count: 0 },
    { label: '2–10min', test: d => d > 120 && d <= 600, count: 0 },
    { label: '>10min', test: d => d > 600, count: 0 },
  ];
  delayArr.forEach(x => { const b = delayBuckets.find(b => b.test(x.delay_seconds)); if (b) b.count++; });

  // 执行偏差总金额
  const totalDev = Math.round(f.reduce((s, x) => s + (x.deviation_amount || 0), 0) * 100) / 100;

  // 个股偏差 Top5
  const bySym = {};
  f.forEach(x => {
    if (!x.signal_id || x.deviation_amount === null) return;
    (bySym[x.symbol] = bySym[x.symbol] || { symbol: x.symbol, pnl: 0, abs: 0 }).pnl += x.deviation_amount;
    bySym[x.symbol].abs = Math.abs(bySym[x.symbol].pnl);
  });
  const topDev = Object.values(bySym).sort((a, b) => b.abs - a.abs).slice(0, 5)
    .map(s => ({ ...s, pnl: Math.round(s.pnl * 100) / 100 }));

  return {
    totalSignals, execRate, missRate, avgSlip, totalDev,
    filledCount: filled.length, missedCount: missed.length, partialCount: partials.length,
    slipBuckets, delayBuckets, delayArr: delayArr.length, extraCount: extra.length,
    topDev, f, sigLast,
  };
}

// ---------- 信号准确率统计（结果层：跟单之后赚不赚钱） ----------
// 口径（确定性计算 v1，全部可溯源）：
//   1. 仅「买入信号」做盈亏归因——卖出信号在多腿 FIFO 下无法干净归属，只统计执行/漏跟；
//   2. 归因规则：闭环配对的「首笔开仓成交」（buyTradeIds[0]）若被某信号匹配
//      （signal_fills.trade_id），该配对盈亏计给该信号；
//      一笔开仓被多条信号命中时只计给信号时间最早的一条，避免重复计数；
//   3. 未闭环（仍持仓中）的已执行信号不计入胜率，只计入「已执行」；
//   4. 胜率 = 归属配对合计盈亏 > 0 的信号数 / 有归属配对的信号数。
// 合规：本统计是对历史跟单结果的事后核对，不构成对任何信号来源的推荐或评价。
const PLATFORM_LABEL = { joinquant: '聚宽', qmt: 'QMT', csv: 'CSV 导入', mock: '模拟', other: '其他' };

// R 倍数口径：名义风险 = 持仓成本 × 止损假设。止损比例必须让用户可见可调，
// 否则所有 R 值都建立在一个隐藏的 7% 前提上（违反「指标可溯源」）。
const RISK_KEY = 'trae_risk_pct_v1';
const RISK_OPTIONS = [0.03, 0.05, 0.07, 0.1];
function getRiskPct() {
  const v = Number(localStorage.getItem(RISK_KEY));
  return RISK_OPTIONS.includes(v) ? v : 0.07;
}
function setRiskPct(v) {
  if (RISK_OPTIONS.includes(Number(v))) localStorage.setItem(RISK_KEY, String(Number(v)));
}

// R 分析当前选中的信号来源（'all' 或 platform 值）；仅会话内记忆
let rSrc = 'all';
// 直方图选中的 R 区间（与累计曲线联动高亮）：{min, max} 或 null
let hlBucket = null;

function computeSignalAccuracy() {
  const signals = q('SELECT * FROM signals WHERE user_id=$u ORDER BY signaled_at', { $u: LOCAL_USER_ID });
  if (!signals.length) return null;
  const fills = q('SELECT * FROM signal_fills WHERE user_id=$u AND signal_id IS NOT NULL AND trade_id IS NOT NULL', { $u: LOCAL_USER_ID });
  const trades = q('SELECT * FROM trades WHERE user_id=$u ORDER BY traded_at', { $u: LOCAL_USER_ID });

  const sigById = Object.fromEntries(signals.map(s => [s.id, s]));
  const groups = {};
  const g = p => (groups[p] = groups[p] || {
    platform: p, total: 0, buyTotal: 0, executed: 0,
    closed: 0, wins: 0, pnl: 0, slipSum: 0, slipN: 0,
    rSum: 0, rN: 0, rArr: [],
  });
  // 分标的下钻（同一套口径，group key 换成 symbol）
  const symGroups = {};
  const gs = sym => (symGroups[sym] = symGroups[sym] || {
    symbol: sym, total: 0, buyTotal: 0, executed: 0,
    closed: 0, wins: 0, pnl: 0, slipSum: 0, slipN: 0,
    rSum: 0, rN: 0, rArr: [],
  });
  signals.forEach(s => {
    const grp = g(s.platform || 'other');
    grp.total++;
    if (s.direction === 'buy') grp.buyTotal++;
    const sg = gs(s.symbol);
    sg.total++;
    if (s.direction === 'buy') sg.buyTotal++;
  });

  // trade_id → 信号 id（同笔成交被多信号命中时，最早信号优先）
  const tradeToSig = {};
  fills.slice()
    .sort((a, b) => (sigById[a.signal_id]?.signaled_at || 0) - (sigById[b.signal_id]?.signaled_at || 0))
    .forEach(f => { if (!tradeToSig[f.trade_id]) tradeToSig[f.trade_id] = f.signal_id; });

  // 已执行信号（filled/partial，按 signal 去重）
  new Set(fills.map(f => f.signal_id)).forEach(sid => {
    const s = sigById[sid];
    if (s) { g(s.platform || 'other').executed++; gs(s.symbol).executed++; }
  });

  // 每个信号一条代表 fill（滑点在同一信号的各 fill 上数值相同，取一条即可）
  const lastFill = {};
  fills.forEach(f => { lastFill[f.signal_id] = f; });
  Object.values(lastFill).forEach(f => {
    if (f.slippage === null || f.slippage === undefined) return;
    const s = sigById[f.signal_id];
    if (!s) return;
    const grp = g(s.platform || 'other');
    grp.slipSum += f.slippage; grp.slipN++;
    const sg = gs(s.symbol);
    sg.slipSum += f.slippage; sg.slipN++;
  });

  // 闭环配对归因：首笔开仓成交 → 最早命中信号（仅买入信号）
  const pairs = computePairs(trades);
  // 用户可调的止损假设（默认 7%），决定所有 R 值的分母
  const RISK_PCT = getRiskPct();
  for (const c of pairs.closed) {
    const openTradeId = c.buyTradeIds[0];
    const sid = tradeToSig[openTradeId];
    if (!sid) continue;
    const s = sigById[sid];
    if (!s || s.direction !== 'buy') continue;
    const grp = g(s.platform || 'other');
    grp.closed++;
    grp.pnl += c.pnl;
    if (c.pnl > 0) grp.wins++;
    // R 倍数：盈亏 ÷ 名义风险（Edgewonk 核心口径；名义风险 = 配对成本 × 止损假设）
    const risk = Math.abs(c.cost * RISK_PCT);
    if (risk > 0) {
      const r = c.pnl / risk;
      grp.rSum += r; grp.rN++; grp.rArr.push(r);
      // 逐笔明细：累计 R 曲线 + tooltip 反查用
      (grp.rDetails = grp.rDetails || []).push({ r, pnl: c.pnl, symbol: c.symbolName, tradedAt: c.closeAt });
    }
    const sg = gs(s.symbol);
    sg.closed++;
    sg.pnl += c.pnl;
    if (c.pnl > 0) sg.wins++;
    if (risk > 0) {
      const r = c.pnl / risk;
      sg.rSum += r; sg.rN++; sg.rArr.push(r);
      (sg.rDetails = sg.rDetails || []).push({ r, pnl: c.pnl, symbol: c.symbolName, tradedAt: c.closeAt });
    }
  }

  const fin = x => {
    const rs = x.rArr.slice().sort((a, b) => a - b);
    return {
      ...x,
      pnl: Math.round(x.pnl * 100) / 100,
      winRate: x.closed ? x.wins / x.closed : null,
      avgSlip: x.slipN ? Math.round((x.slipSum / x.slipN) * 10000) / 10000 : null,
      avgR: x.rN ? Math.round((x.rSum / x.rN) * 100) / 100 : null,
      expectancy: x.closed ? Math.round((x.pnl / x.closed) * 100) / 100 : null,
      profitFactor: rs.length ? (() => {
        const pos = rs.filter(r => r > 0).reduce((s, r) => s + r, 0);
        const neg = Math.abs(rs.filter(r => r < 0).reduce((s, r) => s + r, 0));
        return neg > 0 ? Math.round((pos / neg) * 100) / 100 : null;
      })() : null,
      rDetails: x.rDetails || [], // 逐笔 R 明细（累计曲线 + tooltip）
    };
  };
  const rows = Object.values(groups).map(fin).sort((a, b) => b.total - a.total);
  // 分标的：按已闭环数降序，闭环相同按 |盈亏| 降序，最多展示 10 行
  const bySymbol = Object.values(symGroups).map(fin)
    .sort((a, b) => b.closed - a.closed || Math.abs(b.pnl) - Math.abs(a.pnl))
    .slice(0, 10);

  const overall = rows.length ? {
    total: rows.reduce((s, x) => s + x.total, 0),
    executed: rows.reduce((s, x) => s + x.executed, 0),
    closed: rows.reduce((s, x) => s + x.closed, 0),
    wins: rows.reduce((s, x) => s + x.wins, 0),
    pnl: Math.round(rows.reduce((s, x) => s + x.pnl, 0) * 100) / 100,
    avgR: rows.length ? Math.round((rows.reduce((s, x) => s + (x.avgR || 0), 0) / rows.length) * 100) / 100 : null,
    expectancy: rows.length ? Math.round((rows.reduce((s, x) => s + (x.expectancy || 0), 0) / rows.length) * 100) / 100 : null,
  } : null;
  if (overall) overall.winRate = overall.closed ? overall.wins / overall.closed : null;

  return { rows, bySymbol, overall };
}

const MOCK_STOCKS = [
  ['600519', '贵州茅台', 1480, 1720], ['000001', '平安银行', 11.2, 13.1],
  ['300750', '宁德时代', 182, 218], ['601318', '中国平安', 45, 54],
  ['000858', '五粮液', 122, 148], ['002594', '比亚迪', 232, 276],
  ['600036', '招商银行', 32, 39.5], ['601899', '紫金矿业', 17.5, 22],
  ['300059', '东方财富', 15, 19.5], ['688981', '中芯国际', 84, 99],
];

function generateMockSignals() {
  // 依赖 trades 表已有交易（模拟交割单数据）
  const trades = q('SELECT * FROM trades WHERE user_id=$u ORDER BY traded_at', { $u: LOCAL_USER_ID });
  if (!trades.length) { alert('请先生成/导入模拟成交数据'); return; }

  const rnd = mulberry32(987654);
  const nowTs = now();
  const signals = [];

  // 已有 trades 的 symbol + direction 作为信号基底
  const byKey = {};
  trades.forEach(t => {
    const k = t.symbol + '|' + t.direction;
    (byKey[k] = byKey[k] || []).push(t);
  });

  Object.entries(byKey).forEach(([key, arr]) => {
    if (rnd() < 0.85) {
      arr.forEach(t => {
        // 信号时间在成交时间之前 0~60 秒（模拟提前发信号）
        const offset = Math.floor(rnd() * 60);
        // 故意埋入一些漏跟单（信号不对应任何成交——选一个独特的信号时间，窗口外）
        const miss = rnd() < 0.12;
        const priceBase = t.price * (miss ? 1.003 : 1); // 漏跟单略抬价避免匹配
        signals.push({
          id: uuid(), user_id: LOCAL_USER_ID, platform: rnd() < 0.5 ? 'joinquant' : 'qmt',
          symbol: t.symbol, direction: t.direction,
          signal_price: Math.round(priceBase * 100) / 100,
          signal_qty: t.quantity,
          signaled_at: t.traded_at - offset,
          strategy_name: `mock_${t.direction}_${t.symbol}`, backtest_ref: 'mock_backtest',
          import_batch_id: null, created_at: nowTs,
        });
      });
    }
  });

  // 额外生成 5 条 missed 信号（窗口内无成交，故意拉远时间）
  for (let i = 0; i < 5; i++) {
    const s = MOCK_STOCKS[Math.floor(rnd() * MOCK_STOCKS.length)];
    const dt = new Date(2026, 8 + Math.floor(rnd() * 2), 1 + Math.floor(rnd() * 25), 9 + Math.floor(rnd() * 3), 15 + Math.floor(rnd() * 45));
    signals.push({
      id: uuid(), user_id: LOCAL_USER_ID, platform: rnd() < 0.5 ? 'joinquant' : 'qmt',
      symbol: s[0], direction: rnd() < 0.5 ? 'buy' : 'sell',
      signal_price: Math.round((s[2] + rnd() * (s[3] - s[2])) * 100) / 100,
      signal_qty: 100 + Math.floor(rnd() * 500),
      signaled_at: Math.floor(dt.getTime() / 1000),
      strategy_name: `missed_mock_${i}`, backtest_ref: 'mock_backtest',
      import_batch_id: null, created_at: nowTs,
    });
  }

  // 落库（去重：同一 symbol+time+direction）。先给旧数据登记墓碑——
  // 新信号用全新 UUID，旧信号及挂在旧信号上的 fill 都要从云端/他端删除
  recordDeletes('signals', q('SELECT id FROM signals').map(r => r.id));
  recordDeletes('signal_fills', q('SELECT id FROM signal_fills').map(r => r.id));
  run('DELETE FROM signals');
  run('DELETE FROM signal_fills');
  signals.forEach(s => run(`INSERT INTO signals (id, user_id, platform, symbol, direction, signal_price, signal_qty, signaled_at, strategy_name, backtest_ref, import_batch_id, created_at)
    VALUES ($id, $u, $p, $s, $d, $sp, $sq, $st, $sn, $br, $ib, $ct)`, {
    $id: s.id, $u: s.user_id, $p: s.platform, $s: s.symbol, $d: s.direction,
    $sp: s.signal_price, $sq: s.signal_qty, $st: s.signaled_at,
    $sn: s.strategy_name, $br: s.backtest_ref, $ib: s.import_batch_id, $ct: s.created_at,
  }));

  autoMatch();
  alert(`已播种 ${signals.length} 条模拟信号（含 missed）+ autoMatch 完成`);
  autoSync();
}

async function handleSignalFile(file) {
  const buf = await file.arrayBuffer();
  const text = new TextDecoder('utf-8').decode(buf);
  const res = parseSignalsCSV(text, 'csv');

  if (!res.ok.length) {
    LAST_IMPORT = { ok: 0, err: res.errors.length, dup: 0, mapping: res.mapping, unmapped: res.unmapped, errors: res.errors.slice(0, 5) };

    return 0;
  }

  const ts = now();
  const batchId = uuid();
  res.ok.forEach(s => {
    run(`INSERT INTO signals (id, user_id, platform, symbol, direction, signal_price, signal_qty, signaled_at, strategy_name, backtest_ref, import_batch_id, created_at)
      VALUES ($id, $u, $p, $s, $d, $sp, $sq, $st, $sn, $br, $ib, $ct)`, {

  });

  autoMatch();
  LAST_IMPORT = { ok: res.ok.length, err: res.errors.length, dup: res.dupCount || 0, mapping: res.mapping, unmapped: res.unmapped, errors: res.errors.slice(0, 5) };

  autoSync();
  return res.ok.length;
}

      // ---- 累计 R 曲线 ----

      const yMin = Math.min(...yAll, -1);

      const y = v => pad.t + ih - ((v - yMin) / yRange) * ih;

      let pathD = `M ${x(0)} ${y(cumArr[0])}`;
      const pts = cumArr.map((v, i) => { pathD += ` L ${x(i)} ${y(v)}`; return v; });
      const areaD = pathD + ` L ${x(cumArr.length-1)} ${y(0)} L ${x(0)} ${y(0)} Z`;

      const buckets = [
        { label: '≤-2R', min: -Infinity, max: -2 },

        { label: '-1~0R', min: -1, max: 0 },

        { label: '>2R', min: 2, max: Infinity },

      allDetails.forEach(d => { const b = buckets.find(b => d.r > b.min && d.r <= b.max); if (b) b.details.push(d); });
      const maxCount = Math.max(...buckets.map(b => b.details.length), 1);
      const BW = 420, BH = 220, Bpad = { l: 40, r: 15, t: 20, b: 40 };
      const Biw = BW - Bpad.l - Bpad.r, Bih = BH - Bpad.t - Bpad.b;
      const bw = Biw / buckets.length - 6;
      // R 神奇数字参考线位置（按 maxAbsR 估算）
      const maxAbsR = Math.max(2, ...allDetails.map(d => Math.abs(d.r)));
      // 连续亏损统计（按平仓时间顺序）：风控核心指标，连亏越长越该停手
      let maxStreak = 0, cur = 0, maxEnd = null;
      for (const d of allDetails) {
        if (d.r < 0) { cur++; if (cur > maxStreak) { maxStreak = cur; maxEnd = d; } }
        else cur = 0;
      }
      const curStreak = cur; // 末尾尚未被盈利打断的连亏笔数

      // 蒙特卡洛：从历史 R 分布有放回抽样，模拟 1000 条「未来 100 笔」资金曲线。
      // 固定随机种子 -> 同数据同结果，可复现（对齐「指标可溯源」红线）
      const mcRuns = 1000, mcHorizon = 100;
      const rPool = allDetails.map(d => d.r);
      const mcRand = mulberry32(20261029);
      const mcFinals = [], mcDDs = [];
      for (let k = 0; k < mcRuns; k++) {
        let cum = 0, peak = 0, dd = 0;
        for (let i = 0; i < mcHorizon; i++) {
          cum += rPool[Math.floor(mcRand() * rPool.length)];
          if (cum > peak) peak = cum;
          if (cum - peak < dd) dd = cum - peak;
        }

      const sortedF = mcFinals.slice().sort((a, b) => a - b);
      const quantile = q => sortedF[Math.min(sortedF.length - 1, Math.floor(q * sortedF.length))];
      const mcP5 = quantile(0.05), mcP50 = quantile(0.5), mcP95 = quantile(0.95);
      const probNeg = mcFinals.filter(v => v < 0).length / mcRuns;
      const sortedDD = mcDDs.slice().sort((a, b) => a - b);
      const medDD = sortedDD[Math.floor(sortedDD.length / 2)];
      const mcMin = sortedF[0], mcMax = sortedF[sortedF.length - 1];
      const mcSpan = (mcMax - mcMin) || 1;
      const MCB = 9;
      const mcBins = Array.from({ length: MCB }, () => 0);
      for (const v of mcFinals) {
        const idx = Math.min(MCB - 1, Math.max(0, Math.floor((v - mcMin) / mcSpan * MCB)));

          <!-- 柱状图 -->
          ${buckets.map((b, i) => {
            const count = b.details.length;

            const bx = Bpad.l + (i / buckets.length) * Biw + 3;
