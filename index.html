        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
          <div class="bg-slate-50 rounded-lg p-3">
            <div class="text-xs text-slate-500 mb-1">亏损概率</div>
            <div class="text-2xl font-bold ${probNeg >= 0.5 ? 'text-red-600' : probNeg >= 0.3 ? 'text-amber-500' : 'text-emerald-600'}">${(probNeg * 100).toFixed(0)}%</div>
            <div class="text-xs text-slate-400 mt-0.5">${mcHorizon} 笔后累计 R &lt; 0 的比例</div>
          </div>
          <div class="bg-slate-50 rounded-lg p-3">
            <div class="text-xs text-slate-500 mb-1">中位数结果</div>
            <div class="text-2xl font-bold ${mcP50 >= 0 ? 'text-emerald-600' : 'text-red-600'}">${mcP50 >= 0 ? '+' : ''}${mcP50.toFixed(1)}R</div>
            <div class="text-xs text-slate-400 mt-0.5">一半情形好于此</div>
          </div>
          <div class="bg-slate-50 rounded-lg p-3">
            <div class="text-xs text-slate-500 mb-1">90% 结果区间</div>
            <div class="text-lg font-bold text-slate-700">${mcP5 >= 0 ? '+' : ''}${mcP5.toFixed(1)} ~ ${mcP95 >= 0 ? '+' : ''}${mcP95.toFixed(1)}R</div>

          </div>

        <div class="flex items-end gap-1 h-20">

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

        });
        body = `<table class="min-w-full text-sm"><thead class="bg-slate-50 text-xs"><tr>${['信号时间','标的','方向','信号价','状态'].map(h=>`<th class="px-3 py-2 text-left">${h}</th>`).join('')}</tr></thead><tbody>
        ${ms.map(x=>`<tr class="border-t"><td class="px-3 py-2 text-xs">${fmtDateTime(x.sig_time)}</td><td class="px-3 py-2 font-mono">${x.sig_symbol}</td><td class="px-3 py-2">${dirTxt(x.sig_dir)}</td><td class="px-3 py-2 text-right">${fmtMoney(x.signal_price)}</td><td class="px-3 py-2"><span class="text-xs px-2 py-0.5 rounded ${stCls(x.match_status)}">${stTxt(x.match_status)}</span></td></tr>`).join('')}</tbody></table>`; }
      else if (key === 'avg-slip') { title = '滑点明细';
        body = `<table class="min-w-full text-sm"><thead class="bg-slate-50 text-xs"><tr>${['标的','方向','信号价','成交价','滑点','延迟'].map(h=>`<th class="px-3 py-2 text-left">${h}</th>`).join('')}</tr></thead><tbody>
        ${Object.values(attr.sigLast).filter(x=>x.slippage!==null).map(x=>`<tr class="border-t"><td class="px-3 py-2 font-mono">${x.symbol}</td><td class="px-3 py-2">${dirTxt(x.sig_dir)}</td><td class="px-3 py-2 text-right">${fmtMoney(x.signal_price)}</td><td class="px-3 py-2 text-right">${fmtMoney(x.trade_price)}</td><td class="px-3 py-2 text-right ${x.slippage>0?'text-red-600':'text-green-600'}">${fmtMoney(x.slippage)}</td><td class="px-3 py-2 text-right text-xs">${x.delay_seconds}s</td></tr>`).join('')}</tbody></table>`; }
      else if (key === 'total-dev') { title = '执行偏差明细';
        body = `<p class="text-sm text-slate-500 mb-2">偏差金额 = (成交价 − 信号价) × 成交数量，正值表示比信号贵（不利），负值表示比信号便宜（有利）</p>
        <table class="min-w-full text-sm"><thead class="bg-slate-50 text-xs"><tr>${['标的','方向','偏差','延迟'].map(h=>`<th class="px-3 py-2 text-left">${h}</th>`).join('')}</tr></thead><tbody>
        ${Object.values(attr.sigLast).filter(x=>x.deviation_amount!==null).map(x=>`<tr class="border-t"><td class="px-3 py-2 font-mono">${x.symbol}</td><td class="px-3 py-2">${dirTxt(x.sig_dir)}</td><td class="px-3 py-2 ${x.deviation_amount>0?'text-red-600':'text-green-600'}">${fmtMoney(x.deviation_amount)}</td><td class="px-3 py-2 text-xs">${x.delay_seconds}s</td></tr>`).join('')}</tbody></table>`; }
      else if (key === 'extra') { title = '无信号成交明细';
        body = `<p class="text-sm text-slate-500 mb-2">以下 ${attr.extraCount} 笔成交不在任何信号的 ±3600s 窗口内，属于信号外交易</p>`; }
      openModal({ title: esc(title), bodyHTML: body });
    };
  });

  // 直方图 bucket 点击 → 与累计曲线联动高亮（同柱再点取消）+ 弹出该区间明细
  el.querySelectorAll('.rb-bar').forEach(bar => {
    bar.onclick = () => {
      const label = bar.dataset.label || '';
      const raw = bar.dataset.details;
      const mn = Number(bar.dataset.min), mx = Number(bar.dataset.max);
      if (raw) {
        const same = hlBucket && hlBucket.min === mn && hlBucket.max === mx;
        hlBucket = same ? null : { min: mn, max: mx };
        renderSignal(el);
      }
      if (!raw) { openModal({ title: esc(label), bodyHTML: '<p class="text-sm text-slate-500">该区间无数据</p>' }); return; }
      try {
        const details = JSON.parse(raw);
        const body = `<p class="text-sm text-slate-500 mb-3">共 ${details.length} 笔（R 倍数区间 ${esc(label)}）</p>
          <table class="min-w-full text-sm"><thead class="bg-slate-50 text-xs"><tr>${['标的','R 倍数','盈亏','平仓时间'].map(h=>`<th class="px-3 py-2 text-left">${h}</th>`).join('')}</tr></thead><tbody>
          ${details.map(d=>`<tr class="border-t"><td class="px-3 py-2">${esc(d.symbol)}</td><td class="px-3 py-2 font-mono font-medium ${d.r>=0?'text-red-600':'text-green-600'}">${d.r>=0?'+':''}${d.r.toFixed(2)}R</td><td class="px-3 py-2 text-right font-mono ${d.pnl>=0?'text-red-600':'text-green-600'}">${d.pnl>=0?'+':''}${fmtMoney(d.pnl)}</td><td class="px-3 py-2 text-xs text-slate-500">${fmtDateTime(d.tradedAt)}</td></tr>`).join('')}</tbody></table>`;
        openModal({ title: esc(label) + ' · ' + details.length + ' 笔', bodyHTML: body });
      } catch (e) { openModal({ title: esc(label), bodyHTML: '<p class="text-sm text-red-500">数据解析失败</p>' }); }
    };
  });

  // 止损假设切换：改变所有 R 值的分母，切换后整页重算重渲染
  el.querySelectorAll('[data-risk]').forEach(btn => {
    btn.onclick = () => { setRiskPct(btn.dataset.risk); hlBucket = null; renderSignal(el); };
  });

  // 信号来源切换：只看某个来源的 R 分布与累计曲线
  el.querySelectorAll('[data-rsrc]').forEach(btn => {
    btn.onclick = () => { rSrc = btn.dataset.rsrc; hlBucket = null; renderSignal(el); };
  });
}

// ============================================================
// llm.js — LLM 接入层（从 report.js 拆出，架构红线物理隔离）
//   本模块只允许产出自然语言文本列：summary_text / report_text /
//   llm_model / llm_prompt_ver（+ 审计元数据 llm_source / llm_note）。
//   数值列名出现在 LLM 输出即视为越界，validateLLMOutput 拦截回退。
//   包含：配置读写(localStorage) / OpenAI 兼容调用 / 越界校验 /
//         合规词表扫描 / 数字溯源自查 / Mock 模板引擎（回退兜底）
// ============================================================

// ---------- 架构红线：禁止进入 LLM 输出的数值列名（用于 validateLLMOutput） ----------
const NUMERIC_COLUMN_KEYS = [
  'win_rate', 'profit_loss', 'discipline_score', 'total_trades',
  'profit_factor', 'avg_holding_days', 'discipline_violations',
];

// ---------- Mock LLM 模板引擎：把 JSON 变量注入中文模板 ----------
// 输入 metricsJson；输出 { summary_text, report_text, llm_model, llm_prompt_ver }
const RULE_KEY_NAME = {
  max_position_pct: '单票仓位超限',
  stop_loss: '止损纪律未执行',
  no_tail_chase: '尾盘追高买入',
  t1_check: 'T+1 违规当日买卖',
  max_weekly_trades: '单周交易次数超上限',
};

const PROMPT_VER = 'mock-v1';          // 每次 mock 模板升级时递增
const MOCK_MODEL = 'template-engine';

function ruleName(key) { return RULE_KEY_NAME[key] || key; }
function fmtDelta(v, digits = 1) {
  if (v === null || v === undefined) return '持平';
  if (v > 0) return `+${(v * 100).toFixed(digits)}%`;
  return `${(v * 100).toFixed(digits)}%`;
}

function mockGenerateReport(metrics) {
  const m = metrics;

  // 一句话摘要（30–50 字）
  const topViolation = m.violations_top3 && m.violations_top3[0];
  const summaryParts = [];
  summaryParts.push(`${m.period.slice(5)}月共 ${m.total_trades} 笔成交`);
  if (m.win_rate !== null) summaryParts.push(`胜率 ${(m.win_rate * 100).toFixed(0)}%`);
  if (m.profit_factor !== null) summaryParts.push(`盈亏比 ${m.profit_factor.toFixed(2)}`);
  if (m.discipline_score !== null) summaryParts.push(`纪律执行率 ${(m.discipline_score * 100).toFixed(1)}%`);
  if (topViolation) summaryParts.push(`${ruleName(topViolation.rule)}是首犯（${topViolation.count} 次）`);
  const summary_text = summaryParts.join('、') + '。';

  // 约 300–500 字分节报告
  const sections = [];

  // ① 月度概览
  let s1 = `【月度概览】\n${m.period} 月共产生 ${m.total_trades} 笔成交流水，`;
  if (m.closed_trades) {
    s1 += `其中已配对完整交易 ${m.closed_trades} 笔；净盈亏 ${(m.profit_loss >= 0 ? '+' : '') + fmtMoney(m.profit_loss)} 元。`;
  }
  if (m.win_rate !== null && m.profit_factor !== null) {
    s1 += `胜率 ${fmtPct(m.win_rate)}，盈亏比 ${m.profit_factor.toFixed(2)}${m.profit_factor >= 1.5 ? '，盈利厚度尚可' : m.profit_factor >= 1 ? '，盈亏基本打平' : '，亏损厚度偏大'}。`;
  }
  if (m.avg_holding_days !== null) {
    s1 += `平均持仓周期 ${m.avg_holding_days} 天。`;
  }
  const hasMoM = m.mom_delta && (m.mom_delta.profit_loss !== undefined || m.mom_delta.win_rate !== undefined || m.mom_delta.discipline_score !== undefined);
  if (hasMoM) {
    const p = m.mom_delta.profit_loss !== undefined ? `盈亏 ${fmtDelta(m.mom_delta.profit_loss)}` : '';
    const w = m.mom_delta.win_rate !== undefined ? `胜率 ${fmtDelta(m.mom_delta.win_rate)}` : '';
    const d = m.mom_delta.discipline_score !== undefined ? `纪律 ${fmtDelta(m.mom_delta.discipline_score)}` : '';
    const parts = [p, w, d].filter(Boolean);
    if (parts.length) s1 += `环比上月：${parts.join('，')}。`;
  }
  sections.push(s1);

  // ② 纪律执行
  let s2 = `【纪律执行】\n纪律执行率 ${m.discipline_score !== null ? fmtPct(m.discipline_score) : '—'}，期内检测到违规 ${m.discipline_violations} 次。`;
  if (m.violations_top3 && m.violations_top3.length) {
    s2 += `Top3 违规集中在：${m.violations_top3.map(v => `${ruleName(v.rule)} ${v.count} 次`).join('、')}。`;
  }
  if (m.discipline_score !== null) {
    if (m.discipline_score >= 0.9) s2 += '整体执行较好，保持目前的规则意识。';
    else if (m.discipline_score >= 0.75) s2 += '纪律执行率尚在可控区间，但需要盯住高频违规项的改善。';
    else s2 += '纪律执行率低于 75%，意味着本月约四分之一以上交易触碰了自定规则。';
  }
  sections.push(s2);

  // ③ 盈亏归因（标签维度）
  let s3 = `【盈亏归因】\n按标签维度拆解：`;
  if (m.tags_pnl && m.tags_pnl.length) {
    const losers = m.tags_pnl.filter(t => t.pnl < 0).slice(-3).reverse();
    const winners = m.tags_pnl.filter(t => t.pnl >= 0).slice(0, 3);
    if (losers.length) {
      s3 += `亏损侧主要来自 ${losers.map(t => `「${t.tag}」${fmtMoney(t.pnl)}`).join('、')}；`;
    }
    if (winners.length) {
      s3 += `盈利侧主要贡献是 ${winners.map(t => `「${t.tag}」+${fmtMoney(t.pnl)}`).join('、')}。`;
    }
  } else {
    s3 += '账本上尚未给成交打标签，暂时无法做行为维度归因。可在「复盘账本」逐笔补上标签。';
  }
  sections.push(s3);

  // ④ 重复犯错模式识别（从违规 Top3 + 亏损标签推断）
  let s4 = `【重复犯错模式识别】\n`;
  if (m.violations_top3 && m.violations_top3.length) {
    if (m.violations_top3.some(v => v.rule === 'no_tail_chase')) {
      s4 += '尾盘追高是本月最明显的行为特征——在 14:50 之后买入了多笔交易，容易追进高点。';
    }
    if (m.violations_top3.some(v => v.rule === 'max_weekly_trades')) {
      s4 += '单周交易次数多次超过上限，说明有过度交易倾向，需要警惕。';
    }
    if (m.violations_top3.some(v => v.rule === 'stop_loss')) {
      s4 += '多笔亏损交易未按 -7% 止损纪律执行，止损纪律是本月最大短板。';
    }
    if (m.violations_top3.some(v => v.rule === 'max_position_pct')) {
      s4 += '曾出现单票仓位超过假设本金 30% 的情况，存在集中持仓风险。';
    }
    if (m.violations_top3.some(v => v.rule === 't1_check')) {
      s4 += '出现 T+1 违规，可能是数据异常或手工配对缺口，建议排查。';
    }
    if (m.violations_top3.some(v => v.rule === 'revenge_window')) {
      s4 += '亏损平仓后短时间内再次买入，属于典型报复性交易，需要给亏损后设一个强制冷静期。';
    }
    if (m.violations_top3.some(v => v.rule === 'loss_streak_add')) {
      s4 += '连续亏损后买入成本明显放大，有摊低成本的冲动，这是连败加仓的危险信号。';
    }
  } else {
    s4 += '本月未检测到任何纪律违规行为，是理想状态，继续保持。';
  }
  sections.push(s4);

  // ④.5 影子账户·反事实回放（数字全部来自 metrics.shadow，确定性回放结果）
  if (m.shadow && m.shadow.real_pnl !== undefined && m.shadow.real_pnl !== null) {
    let s45 = `【影子账户·反事实回放】\n用你当前启用的纪律规则，对全部历史成交做了一次「守规则版」重放（全历史口径）：`;
    s45 += `真实净盈亏 ${(m.shadow.real_pnl >= 0 ? '+' : '') + fmtMoney(m.shadow.real_pnl)} 元，守规则版为 ${(m.shadow.shadow_pnl >= 0 ? '+' : '') + fmtMoney(m.shadow.shadow_pnl)} 元，`;
    s45 += `两者相差 ${(m.shadow.delta_pnl >= 0 ? '+' : '') + fmtMoney(m.shadow.delta_pnl)} 元。`;
    if (m.shadow.delta_pnl > 0) {
      s45 += '差额为正——触规交易实实在在侵蚀了利润，守规则版本的曲线更优。';
    } else if (m.shadow.delta_pnl < 0) {
      s45 += '差额为负——这段区间里触规交易恰好盈利。这不改变规则的价值：纪律的意义在于长期一致性与回撤控制，而不是单笔运气。';
    } else {
      s45 += '两者持平——规则约束在这段历史里没有造成机会成本。';
    }
    if (m.shadow.skipped || m.shadow.adjusted) {
      s45 += `回放共拦截 ${m.shadow.skipped} 笔触规交易、修正 ${m.shadow.adjusted} 笔。`;
    }
    if (m.shadow.unverifiable) {
      s45 += `另有 ${m.shadow.unverifiable} 笔因缺少历史行情证据未纳入回放（如实标注，不做价格假设）。`;
    }
    sections.push(s45);
  }

  // ⑤ 下月建议
  let s5 = `【下月建议】\n`;
  const topRule = m.violations_top3 && m.violations_top3[0];
  if (topRule) {
    const r = topRule.rule;
    if (r === 'no_tail_chase') s5 += '① 把「14:50 后禁止买入」固化到交易前检查清单，买入前扫一眼时钟即可拦截；';
    else if (r === 'max_weekly_trades') s5 += '① 给每周围一个「第 10 笔之后强制冷静 24 小时」的硬规则；';
    else if (r === 'stop_loss') s5 += '① 给每笔买入强制挂一个止损提醒（-7% 无条件执行），不要扛；';
    else if (r === 'max_position_pct') s5 += '① 单票仓位严格控制在 30% 以内，超过即视为违规；';
  }
  if (m.win_rate !== null && m.win_rate < 0.5) {
    s5 += '② 当前胜率低于 50%，建议降低交易频次、把仓位让给胜率更高的机会；';
  }
  if (m.profit_factor !== null && m.profit_factor < 1.2) {
    s5 += '③ 盈亏比偏低，注意亏损单是否砍得太慢或盈利单走得太早；';
  }
  s5 += '④ 所有数字可复算，所有结论可追溯——本体检报告每一个指标都来自本地确定性计算，LLM 只负责把数字写成自然语言，没有任何主观预测。';

  const report_text = sections.join('\n\n') + '\n\n' + s5;

  return {
    summary_text,
    report_text,
    llm_model: MOCK_MODEL,
    llm_prompt_ver: PROMPT_VER,
  };
}

// ---------- 真实 LLM 接入（OpenAI 兼容 chat/completions） ----------
// 纯前端本地优先：API Key 只存本机 localStorage，只发往用户填写的 Base URL
// 架构红线：LLM 的唯一输入是 metrics_json；只取两个自然语言字段，数值列一律不碰
const LLM_CFG_KEY = 'trae_llm_cfg_v1';

const LLM_PROVIDERS = {
  // 模型名以官方 /v1/models 实际清单为准：deepseek-flash / deepseek-v4-pro
  // （旧的 deepseek-chat 仍可作别名使用，但官方已不列，故默认改为 deepseek-flash）
  deepseek: { label: 'DeepSeek', baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-flash' },
  ark: { label: '豆包 / 火山方舟', baseUrl: 'https://ark.cn-beijing.volces.com/api/v3', model: '' },
  custom: { label: '自定义（OpenAI 兼容）', baseUrl: '', model: '' },
};

function llmConfig() {
  try {
    const raw = localStorage.getItem(LLM_CFG_KEY);
    const c = raw ? JSON.parse(raw) : {};
    return {
      provider: c.provider || 'deepseek',
      baseUrl: c.baseUrl || '',
      model: c.model || '',
      apiKey: c.apiKey || '',
    };
  } catch (_) {
    return { provider: 'deepseek', baseUrl: '', model: '', apiKey: '' };
  }
}

function saveLLMConfig(cfg) { localStorage.setItem(LLM_CFG_KEY, JSON.stringify(cfg)); }
function clearLLMConfig() { localStorage.removeItem(LLM_CFG_KEY); }

function llmReady(cfg) { return !!(cfg.baseUrl && cfg.model && cfg.apiKey); }

const LIVE_PROMPT_VER = 'live-v1';   // 真实 LLM 的 prompt 版本（改动 SYSTEM 提示词时递增）

const LLM_SYSTEM_PROMPT = [
  '你是 A 股散户的交易复盘助手。用户会给你一段 JSON，内容是他某个月自己账户的成交统计。',
  '必须严格遵守：',
  '1. 只能使用 JSON 中已经给出的数字，禁止推算、估算、编造任何新的数字；',
  '2. 禁止预测收益、禁止推荐个股、禁止出现「稳赚 / 必涨 / 保证收益 / 年化收益」等承诺性表述；',
  '3. 不评价个股基本面好坏，只评价用户自己的交易行为与纪律执行；',
  '4. 输出必须是一个 JSON 对象，且只包含两个字段：',
  '   summary_text：30–60 字的一句话摘要；',
  '   report_text：300–500 字，分「月度概览 / 纪律执行 / 盈亏归因 / 下月建议」四节，节标题用【】包裹，节与节之间用换行分隔。',
  '不要输出 JSON 以外的任何内容。',
].join('\n');

// 组装请求体（测试连接与正式生成共用）
function buildLLMBody(cfg, messages, withJsonFormat, maxTokens) {
  const body = { model: cfg.model, temperature: 0.2, max_tokens: maxTokens, messages };
  if (withJsonFormat) body.response_format = { type: 'json_object' };
  return body;
}

async function postLLM(cfg, body) {
  const url = cfg.baseUrl.replace(/\/+$/, '') + '/chat/completions';
  return fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + cfg.apiKey,
    },
    body: JSON.stringify(body),
  });
}

// 连通性自检：只花个位数 token，用于设置面板「测试连接」
async function testLLMConnection() {
  const cfg = llmConfig();
  if (!llmReady(cfg)) return { ok: false, msg: 'Base URL / 模型名 / API Key 三项都要填' };
  try {
    let resp = await postLLM(cfg, buildLLMBody(cfg,
      [{ role: 'user', content: '只回复两个字：正常' }], false, 16));
    if (!resp.ok) {
      const t = await resp.text();
      return { ok: false, msg: `HTTP ${resp.status}：${t.slice(0, 160)}` };
    }
    const data = await resp.json();
    const txt = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
    return { ok: true, msg: `连通正常，返回：${String(txt).trim().slice(0, 20) || '(空)'}` };
  } catch (e) {
    return { ok: false, msg: `请求失败：${e.message}。若提示 CORS / Failed to fetch，说明该接口不允许浏览器跨域，请改填可跨域的代理地址。` };
  }
}

async function callLLMAPI(metricsJson) {
  const cfg = llmConfig();
  const mock = mockGenerateReport(metricsJson);

  if (!llmReady(cfg)) {
    return { ...mock, llm_source: 'mock', llm_note: '未配置 API，使用本地模板引擎' };
  }

  const messages = [
    { role: 'system', content: LLM_SYSTEM_PROMPT },
    { role: 'user', content: '以下是该用户本月的交易统计 JSON（唯一数据来源）：\n' + JSON.stringify(metricsJson) },
  ];

  let resp;
  try {
    resp = await postLLM(cfg, buildLLMBody(cfg, messages, true, 1200));
    // 部分模型不支持 response_format，400 时去掉该参数重试一次
    if (resp.status === 400) resp = await postLLM(cfg, buildLLMBody(cfg, messages, false, 1200));
    if (!resp.ok) {
      const t = await resp.text();
      throw new Error(`HTTP ${resp.status} ${t.slice(0, 160)}`);
    }
  } catch (e) {
    return { ...mock, llm_source: 'mock', llm_note: 'LLM 调用失败，已回退模板引擎：' + e.message };
  }

  let content = '';
  try {
    const data = await resp.json();
    content = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
  } catch (e) {
    return { ...mock, llm_source: 'mock', llm_note: '响应不是合法 JSON，已回退模板引擎：' + e.message };
  }

  content = String(content || '').replace(/^\s*```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  if (!content) return { ...mock, llm_source: 'mock', llm_note: 'LLM 返回空内容，已回退模板引擎' };

  // 红线拦截：LLM 输出里出现数值列名 → 视为越界，直接回退
  if (!validateLLMOutput(content)) {
    return { ...mock, llm_source: 'mock', llm_note: 'LLM 输出越界（含数值列名），已拦截并回退模板引擎' };
  }

  let obj = null;
  try { obj = JSON.parse(content); } catch (_) { obj = null; }
  const summary = obj ? (obj.summary_text || obj.summary || '') : '';
  const report = obj ? (obj.report_text || obj.report || '') : content;
  if (!report) return { ...mock, llm_source: 'mock', llm_note: 'LLM 未返回 report_text 字段，已回退模板引擎' };

  return {
    summary_text: summary,
    report_text: report,
    llm_model: cfg.model,
    llm_prompt_ver: LIVE_PROMPT_VER,
    llm_source: 'remote',
    llm_note: '',
  };
}

// ---------- 数字溯源自查（确定性）：找出文本中无法在 metrics 里对上的数字 ----------
// 只作提示，不改写内容；用于暴露「LLM 可能编造数字」的风险
function collectNumbers(obj, out) {
  if (typeof obj === 'number' && isFinite(obj)) out.push(Math.abs(obj));
  else if (Array.isArray(obj)) obj.forEach(v => collectNumbers(v, out));
  else if (obj && typeof obj === 'object') Object.values(obj).forEach(v => collectNumbers(v, out));
  return out;
}

function unverifiedNumbers(text, metrics) {
  if (!text || !metrics) return [];
  const pool = collectNumbers(metrics, []);
  // 月份字符串里的年份与月份也算合法来源
  if (metrics.period) String(metrics.period).split('-').forEach(s => pool.push(Math.abs(+s)));

  const hits = [];
  const seen = new Set();
  // 千分位数字（34,314.24）要整体识别后剥掉逗号再比对，
  // 否则会被拆成 34 与 314.24 两段，双双落在池外造成误报
  const found = String(text).match(/\d[\d,]*(?:\.\d+)?/g) || [];
  for (const raw of found) {
    const n = parseFloat(raw.replace(/,/g, ''));
    if (!isFinite(n)) continue;
    if (seen.has(n)) continue;
    seen.add(n);
    // 允许直接相等、或按百分比放大 100 倍后相等（0.59 → 59%）
    const matched = pool.some(v => Math.abs(n - v) <= 0.05 || Math.abs(n - v * 100) <= 0.5);
    if (!matched) hits.push(raw);
  }
  return hits.slice(0, 8);
}

// ---------- schema 校验层：拒绝含数值列名或 number 类型 key 的 LLM 输出 ----------
function validateLLMOutput(text) {
  if (!text || typeof text !== 'string') return false;
  // 如果返回的是 JSON 字符串，做结构检查
  try {
    const obj = JSON.parse(text);
    const badKeys = NUMERIC_COLUMN_KEYS.filter(k => k in obj);
    if (badKeys.length) {
      console.warn('[llm] validateLLMOutput 拒绝：LLM 输出含数值列名', badKeys);
      return false;
    }
  } catch (_) { /* 非 JSON 文本，放行 */ }
  // 拒绝输出中含明确的数值列名（简单字符串匹配，防 prompt injection）
  // 注意：模型把越界内容塞进 report_text 字符串时，其引号会被 JSON 转义成 \"，
  // 直接 includes('"win_rate"') 会漏检（实测 false），所以先把 \" 还原再匹配；
  // 且要求 key 后面紧跟冒号，避免把正文里「（violations_top3）为空」这类提及误判为越界。
  const norm = text.replace(/\\"/g, '"');
  const keyPattern = new RegExp('"(?:' + NUMERIC_COLUMN_KEYS.join('|') + ')"\\s*:');
  if (keyPattern.test(norm)) {
    console.warn('[llm] validateLLMOutput 拒绝：文本中含数值列 JSON key');
    return false;
  }
  return true;
}

// ---------- 合规扫描（确定性词表匹配，不依赖 LLM 自检） ----------
const COMPLIANCE_BLOCKLIST = [
  '稳赚', '躺赚', '年化收益', '收益率保证', '翻倍', '牛股', '金股',
  '带你上车', '跟单', 'AI 选股推荐', 'AI选股推荐', '明日涨停',
  '抄底逃顶', '胜率保证', '承诺', '保证', '包赚', '保本', '必涨', '零风险',
  '用我们的用户都赚了',
];

function complianceScan(reportText, summaryText = '') {
  const haystack = (reportText || '') + (summaryText || '');
  const hits = COMPLIANCE_BLOCKLIST.filter(w => haystack.includes(w));
  if (hits.length) {
    return JSON.stringify({ status: 'blocked', hits });
  }
  return JSON.stringify({ status: 'pass' });
}

// ============================================================
// ============================================================
// report.js — P1-M5 AI 月度体检报告
// 架构红线：确定性指标 JSON → LLM 自然语言，严格分层
//   - 确定性计算层（本文件）：computeMonthlyMetrics / persistReport
//     只写 metrics_json / win_rate / profit_loss / discipline_score /
//     total_trades / mom_delta_json / violations_top3 / compliance_scan
//   - LLM 层（llm.js）：callLLMAPI / mockGenerateReport /
//     validateLLMOutput / complianceScan / unverifiedNumbers
//     只产出 report_text / summary_text / llm_model / llm_prompt_ver
//   - persistReport 内部分两次写入，LLM 返回值永远不进入数值列
// ============================================================

// ---------- 1. 确定性计算层：computeMonthlyMetrics ----------
// 输入 period = 'YYYY-MM'；输出结构化指标 JSON（即 LLM 的唯一输入）
// 每个字段附 SQL 口径注释（风格对齐 analytics.js）

// 内部函数：计算单期核心指标（仅含 profit_loss / win_rate / discipline_score）
//   —— 用来算 mom_delta，只做一次，不递归，避免栈溢出
function coreMetricsForPeriod(period, pairs, allTrades, allViolations) {
  const periodClosed = pairs.closed.filter(c => monthKey(c.closeAt) === period);
  const closedTrades = periodClosed.length;
  const profitLoss = closedTrades
    ? Math.round(periodClosed.reduce((s, c) => s + c.pnl, 0) * 100) / 100
    : 0;
  const wins = periodClosed.filter(c => c.pnl > 0);
  const winRate = closedTrades
    ? Math.round((wins.length / closedTrades) * 10000) / 10000
    : null;
  const totalTrades = allTrades.filter(t => monthKey(t.traded_at) === period).length;
  const periodViolations = allViolations.filter(v => monthKey(v.violated_at) === period);
  const violatedSet = new Set(periodViolations.map(v => v.trade_id));
  const ds = totalTrades ? Math.round((1 - violatedSet.size / totalTrades) * 10000) / 10000 : null;
  return { profit_loss: profitLoss, win_rate: winRate, discipline_score: ds };
}

function computeMonthlyMetrics(period) {
  const trades = q('SELECT * FROM trades WHERE user_id=$u ORDER BY traded_at', { $u: LOCAL_USER_ID });
  if (!trades.length) {
    return { period, total_trades: 0, closed_trades: 0 };
  }

  const pairs = computePairs(trades);

  // 违规数据一次性全量加载（后续按 period 切片）
  const allViolations = q(
    `SELECT v.*, r.rule_key FROM rule_violations v JOIN discipline_rules r ON r.id=v.rule_id
     WHERE v.user_id=$u`,
    { $u: LOCAL_USER_ID }
  );

  // 期内成交：SELECT * FROM trades WHERE strftime('%Y-%m', traded_at)=period
  const periodTrades = trades.filter(t => monthKey(t.traded_at) === period);
  // 完整交易按平仓日落位（与 analytics.js 月度盈亏口径一致）
  const periodClosed = pairs.closed.filter(c => monthKey(c.closeAt) === period);

  // total_trades：SELECT COUNT(*) FROM trades WHERE 期内
  const totalTrades = periodTrades.length;
  const closedTrades = periodClosed.length;

  // profit_loss：SELECT SUM(pnl) FROM 完整交易 WHERE 期内平仓（含费用已在 FIFO 内扣除）
  const profitLoss = Math.round(periodClosed.reduce((s, c) => s + c.pnl, 0) * 100) / 100;

  // win_rate：盈利笔数 / 已平仓总笔数
  const wins = periodClosed.filter(c => c.pnl > 0);
  const winRate = closedTrades ? Math.round((wins.length / closedTrades) * 10000) / 10000 : null;

  // profit_factor：AVG(盈利) / ABS(AVG(亏损)) —— 盈亏比
  const losses = periodClosed.filter(c => c.pnl < 0);
  const avgWin = wins.length ? wins.reduce((s, c) => s + c.pnl, 0) / wins.length : 0;
  const avgLoss = losses.length ? Math.abs(losses.reduce((s, c) => s + c.pnl, 0) / losses.length) : 0;
  const profitFactor = avgLoss > 0 ? Math.round((avgWin / avgLoss) * 100) / 100 : null;

  // avg_holding_days：AVG(closeAt - openAt) / 86400 —— 平均持仓天数
  const avgHoldingDays = closedTrades
    ? Math.round((periodClosed.reduce((s, c) => s + c.holdingDays, 0) / closedTrades) * 10) / 10
    : null;

  // 纪律执行率（期内）：1 − 期内违规去重笔数 / 期内交易笔数
  // SQL 等价：SELECT COUNT(DISTINCT trade_id) FROM rule_violations WHERE strftime('%Y-%m', violated_at)=period
  const periodViolations = allViolations.filter(v => monthKey(v.violated_at) === period);
  const violatedSet = new Set(periodViolations.map(v => v.trade_id));
  const disciplineScoreVal = totalTrades
    ? Math.round((1 - violatedSet.size / totalTrades) * 10000) / 10000
    : null;

  // discipline_violations：期内违规总条数（不去重，用于 LLM 描述违规频次）
  const disciplineViolations = periodViolations.length;

  // violations_top3：按 rule_key 分组计次取前三
  // SQL：SELECT rule_key, COUNT(*) c FROM rule_violations WHERE 期内 GROUP BY rule_key ORDER BY c DESC LIMIT 3
  const byRule = {};
  for (const v of periodViolations) byRule[v.rule_key] = (byRule[v.rule_key] || 0) + 1;
  const violationsTop3 = Object.entries(byRule)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([rule, count]) => ({ rule, count }));

  // mom_delta：与上期（period-1）的环比变化
  // —— 调一次 coreMetricsForPeriod，不再递归，避免栈溢出
  const [y, m] = period.split('-').map(Number);
  const d = new Date(y, m - 2, 1);  // period - 1 month
  const prevPeriod = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  const prev = coreMetricsForPeriod(prevPeriod, pairs, trades, allViolations);
  const momDelta = {};
  if (prev.profit_loss !== null && profitLoss !== null) {
    momDelta.profit_loss = prev.profit_loss !== 0
      ? Math.round(((profitLoss - prev.profit_loss) / Math.abs(prev.profit_loss)) * 10000) / 10000
      : null;
  }
  if (prev.win_rate !== null && winRate !== null) {
    momDelta.win_rate = Math.round((winRate - prev.win_rate) * 10000) / 10000;
  }
  if (prev.discipline_score !== null && disciplineScoreVal !== null) {
    momDelta.discipline_score = Math.round((disciplineScoreVal - prev.discipline_score) * 10000) / 10000;
  }

  // tags_pnl：按标签分组 SUM(pnl)（SQL：SELECT tag, SUM(pnl) FROM 完整交易×标签 GROUP BY tag）
  const byTag = {};
  for (const c of periodClosed) {
    for (const tag of c.tags) {
      (byTag[tag] = byTag[tag] || { tag, pnl: 0, count: 0 });
      byTag[tag].pnl += c.pnl; byTag[tag].count++;
    }
  }
  const tagsPnl = Object.values(byTag)
    .map(t => ({ tag: t.tag, pnl: Math.round(t.pnl * 100) / 100, count: t.count }))
    .sort((a, b) => a.pnl - b.pnl);

  // shadow：影子账户反事实回放（全历史口径，只读真实成交 + 当前启用规则，确定性可复算）
  // 数字进 metrics_json → LLM 提示词与数字溯源自查自动覆盖，红线不破
  const enabledRules = q('SELECT * FROM discipline_rules WHERE user_id=$u AND enabled=1', { $u: LOCAL_USER_ID });
  const sr = shadowReplay(trades, enabledRules);
  const shadow = {
    scope: 'all',                       // 口径标注：全历史，非月内切片
    real_pnl: sr.real.pnl,
    shadow_pnl: sr.shadow.pnl,
    delta_pnl: sr.delta.pnl,            // 影子 − 真实；正 = 违规的代价
    skipped: sr.delta.skipped,
    adjusted: sr.delta.adjusted,
    unverifiable: sr.delta.unverifiable,
  };

  return {
    period,
    total_trades: totalTrades,
    closed_trades: closedTrades,
    win_rate: winRate,
    profit_loss: profitLoss,
    profit_factor: profitFactor,
    avg_holding_days: avgHoldingDays,
    discipline_score: disciplineScoreVal,
    discipline_violations: disciplineViolations,
    violations_top3: violationsTop3,
    mom_delta: momDelta,
    tags_pnl: tagsPnl,
    shadow,
  };
}

// ---------- 2. 持久化：两次写入（架构红线落地） ----------
// 第一次 INSERT 写全部确定性列 + 全部 LLM 列（空值），第二次 UPDATE 只填 LLM 文本列
// 这样确保 LLM 返回值永远不进入数值列，并且支持离线重试
// 注意：review_reports 的 INSERT 全项目仅此一处（合规扫描逻辑在 llm.js）
function persistReport(metrics, llmText) {
  const id = uuid();
  const ts = now();
  const compBase = JSON.parse(complianceScan(llmText.report_text, llmText.summary_text));
  // 一并记录本次走的是真实 LLM 还是模板引擎（确定性元数据，不含任何数值指标）
  compBase.llm_source = llmText.llm_source || 'mock';
  if (llmText.llm_note) compBase.llm_note = llmText.llm_note;
  const compliance = JSON.stringify(compBase);

  // —— 第 1 次：只写确定性列 ——
  run(`INSERT OR REPLACE INTO review_reports
        (id, user_id, period,
         total_trades, win_rate, profit_loss, discipline_score,
         violations_top3, mom_delta_json, metrics_json, compliance_scan,
         report_text, summary_text, llm_model, llm_prompt_ver, created_at)
      VALUES
        ($id, $u, $period,
         $total, $wr, $pl, $ds,
         $vt3, $mom, $mj, $comp,
         NULL, NULL, NULL, NULL, $ts)`, {
    $id: id, $u: LOCAL_USER_ID, $period: metrics.period,
    $total: metrics.total_trades,
    $wr: metrics.win_rate,
    $pl: metrics.profit_loss,
    $ds: metrics.discipline_score,
    $vt3: JSON.stringify(metrics.violations_top3 || []),
    $mom: JSON.stringify(metrics.mom_delta || {}),
    $mj: JSON.stringify(metrics),
    $comp: compliance,
    $ts: ts,
  });

  // —— 第 2 次：只 UPDATE LLM 文本列（不再触碰任何数值列） ——
  run(`UPDATE review_reports
        SET report_text=$rt, summary_text=$st, llm_model=$m, llm_prompt_ver=$v, updated_at=$ts
        WHERE user_id=$u AND period=$period`, {
    $rt: llmText.report_text,
    $st: llmText.summary_text,
    $m: llmText.llm_model,
    $v: llmText.llm_prompt_ver,
    $u: LOCAL_USER_ID,
    $period: metrics.period,
    $ts: ts,
  });

  return id;
}

// 生成/重新生成体检报告主流程
async function generateReportFor(period) {
  // 先确保纪律规则引擎已跑（最新违规数据）
  runRuleEngine();
  const metrics = computeMonthlyMetrics(period);
  // 走真实 LLM（已配置 API 时）；未配置 / 调用失败 / 输出越界 → 自动回退模板引擎
  const llmText = await callLLMAPI(metrics);
  persistReport(metrics, llmText);
  autoSync();   // 已登录时静默推送（未登录为 no-op）
  return { metrics, llmText };
}

// ---------- 4. 渲染 ----------
function renderReport(el) {
  // 默认周期：最近完整月
  const nowDate = new Date();
  nowDate.setDate(1);
  nowDate.setMonth(nowDate.getMonth() - 1);
  const defaultPeriod = `${nowDate.getFullYear()}-${String(nowDate.getMonth() + 1).padStart(2, '0')}`;

  // 报告历史
  const history = q(
    `SELECT * FROM review_reports WHERE user_id=$u ORDER BY period DESC`,
    { $u: LOCAL_USER_ID }
  );

  // 当前选中的报告
  const state = {
    period: defaultPeriod,
    selectedPeriod: defaultPeriod,
    collapsed: false,
    loading: false,
    llmPanelOpen: false,
    llmMsg: '',
    llmMsgCls: '',
  };

  // 如果已有报告，选中最新的那个
  if (history.length) state.selectedPeriod = history[0].period;

  renderOnce();

  function renderOnce() {
    const selected = history.find(h => h.period === state.selectedPeriod);
    const m = selected ? JSON.parse(selected.metrics_json) : null;

    // Top3 违规名渲染
    const top3List = m && m.violations_top3 ? m.violations_top3 : [];
    const top3HTML = top3List.length
      ? top3List.map(v => `<div class="flex justify-between items-center py-1.5 border-b border-slate-100 last:border-0">
          <span class="text-sm text-slate-600">${ruleName(v.rule)}</span>
          <span class="text-xs bg-red-50 text-red-600 rounded px-2 py-0.5 font-medium">${v.count} 次</span>
        </div>`).join('')
      : '<div class="text-sm text-slate-400">暂无违规记录</div>';

    // 合规扫描
    let compHTML = '';
    let llmMeta = null;
    if (selected && selected.compliance_scan) {
      try {
        const comp = JSON.parse(selected.compliance_scan);
        llmMeta = comp;
        if (comp.status === 'pass') {
          compHTML = `<span class="inline-flex items-center gap-1 text-xs text-emerald-600 bg-emerald-50 rounded px-2 py-0.5">✓ 合规扫描通过</span>`;
        } else {
          compHTML = `<span class="inline-flex items-center gap-1 text-xs text-red-600 bg-red-50 rounded px-2 py-0.5">⚠ 禁用词命中：${(comp.hits || []).map(esc).join('、')}</span>`;
        }
      } catch (_) {
        compHTML = `<span class="text-xs text-slate-400">未扫描</span>`;
      }
    }

    const historyHTML = history.length
      ? history.map(h => `
          <button class="hist-item w-full text-left px-3 py-2 rounded-lg text-sm border ${h.period === state.selectedPeriod ? 'bg-indigo-50 border-indigo-300 text-indigo-700' : 'bg-white border-slate-200 hover:bg-slate-50'}" data-period="${h.period}">
            <div class="font-medium">${h.period} 月</div>
            <div class="text-xs text-slate-400 mt-0.5">${new Date(h.created_at * 1000).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>
          </button>`).join('')
      : '<div class="text-slate-300 text-sm text-center py-6">还没有任何体检报告，选一个月份点击生成</div>';

    const noData = !selected;

    // LLM 引擎状态（Key 只在本机 localStorage）
    const cfg = llmConfig();
    const llmOn = !!(cfg.baseUrl && cfg.model && cfg.apiKey);
    const llmLabel = llmOn ? cfg.model : '本地模板（未配置 API）';
    // 已配置 API 但最近一次生成走了回退：引擎按钮与提示条都要显性化，
    // 否则用户会误以为报告是真实模型写的（失败原因只在卡片底部小字里，容易漏看）
    const fellBack = !!(llmOn && llmMeta && llmMeta.llm_source === 'mock' && llmMeta.llm_note);
    const providerOpts = Object.entries(LLM_PROVIDERS)
      .map(([k, v]) => `<option value="${k}" ${cfg.provider === k ? 'selected' : ''}>${v.label}</option>`).join('');

    // 数字溯源：文本里对不上指标 JSON 的数字（只提示，不阻断）
    // 只对真实 LLM 报告启用——模板引擎的数字是代码常量（-7%、14:50 等），天然不在指标 JSON 里，
    // 对确定性输出做「防编造」检查只会产生误报、稀释徽标公信力
    const unv = (selected && selected.report_text && llmMeta && llmMeta.llm_source === 'remote')
      ? unverifiedNumbers(selected.report_text, m) : [];

    el.innerHTML = `
    <div class="p-6 space-y-6">
      <!-- 顶部：月份选择 + 生成按钮 + 历史列表 -->
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <div class="flex flex-wrap items-end gap-3">
          <label class="text-sm text-slate-600">报告月份
            <input id="r-period" type="month" value="${state.selectedPeriod || defaultPeriod}" class="mt-1 block border rounded-lg px-2 py-1.5 text-sm">
          </label>
          <button id="r-gen" class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 disabled:opacity-50">
            ${state.loading ? '生成中…' : noData ? '生成本月体检报告' : '重新生成'}
          </button>
          <button id="r-llm" class="px-3 py-1.5 rounded-lg text-sm border ${fellBack ? 'bg-amber-50 border-amber-300 text-amber-700' : llmOn ? 'bg-emerald-50 border-emerald-300 text-emerald-700' : 'bg-white border-slate-300 text-slate-600'} hover:bg-slate-50" title="${fellBack ? esc('上次生成已回退：' + llmMeta.llm_note) : '配置真实 LLM 接口'}">
            AI 引擎：${esc(llmLabel)}${fellBack ? ' · 已回退' : ''}
          </button>
          ${!noData ? `<button id="r-pdf" class="px-3 py-1.5 rounded-lg text-sm border bg-white border-slate-300 text-slate-600 hover:bg-slate-50" title="通过浏览器打印管线导出 A4 PDF（含指标、正文与免责声明）">导出 PDF</button>` : ''}
          ${compHTML}
          <span class="ml-auto text-xs text-slate-400">每字段来自本地确定性计算 · LLM 只写自然语言</span>
        </div>

        ${fellBack ? `
        <div class="mt-3 flex flex-wrap items-start gap-2 text-xs bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-3 py-2">
          <span class="font-medium whitespace-nowrap">⚠ 真实模型调用失败，已自动回退模板引擎</span>
          <span class="flex-1 min-w-[12rem] break-all">${esc(llmMeta.llm_note)}</span>
          <button id="r-llm-alert-open" class="underline whitespace-nowrap">检查设置</button>
        </div>` : ''}

        <!-- LLM 配置面板（默认收起） -->
        <div id="r-llm-panel" class="${state.llmPanelOpen ? '' : 'hidden'} mt-4 p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <label class="text-xs text-slate-500">服务商
              <select id="llm-provider" class="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm bg-white">${providerOpts}</select>
            </label>
            <label class="text-xs text-slate-500">Base URL（OpenAI 兼容）
              <input id="llm-base" value="${esc(cfg.baseUrl)}" placeholder="https://api.deepseek.com/v1" class="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm bg-white">
            </label>
            <label class="text-xs text-slate-500">模型名
              <input id="llm-model" value="${esc(cfg.model)}" placeholder="deepseek-flash" class="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm bg-white">
            </label>
          </div>
          <label class="block text-xs text-slate-500">API Key（只存本机 localStorage，不经过我们的服务器）
            <input id="llm-key" type="password" value="${esc(cfg.apiKey)}" placeholder="sk-..." class="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm bg-white font-mono">
          </label>
          <div class="flex flex-wrap items-center gap-2">
            <button id="llm-save" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs hover:bg-indigo-700">保存</button>
            <button id="llm-test" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-xs hover:bg-slate-100">测试连接</button>
            <button id="llm-clear" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-xs text-slate-500 hover:bg-slate-100">清除配置</button>
            <span id="llm-msg" class="text-xs ${state.llmMsgCls || 'text-slate-500'}">${esc(state.llmMsg || '')}</span>
          </div>
          <p class="text-xs text-slate-400 leading-relaxed">纯前端直连：请求从你的浏览器直接发往上面这个 Base URL。若浏览器拦截跨域（控制台报 CORS / Failed to fetch），说明该接口不允许网页直连，请填入你自己搭建的跨域代理地址。生成失败会自动回退本地模板引擎，不会丢报告。</p>
        </div>
        ${history.length ? `<div class="mt-4 flex gap-2 flex-wrap">${history.map(h => `
          <button class="hist-chip text-xs px-2.5 py-1 rounded-full border ${h.period === state.selectedPeriod ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}" data-period="${h.period}">${h.period}</button>
        `).join('')}</div>` : ''}
      </div>

      ${noData ? `
      <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-16 text-center">
        <div class="text-lg font-semibold text-slate-700 mb-2">${state.selectedPeriod} 月还没有体检报告</div>
        <p class="text-sm text-slate-500 mb-5">AI 月度体检报告需要至少一个月以上的交易数据才能生成。先到「交割单导入」生成或导入 ${state.selectedPeriod} 的成交记录。</p>
        <a href="#/import" class="inline-block px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm">前往交割单导入中心</a>
      </div>
      ` : `
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <!-- 指标概览卡（全来自确定性 metrics_json） -->
        <div class="lg:col-span-1 space-y-4">
          <div class="bg-white rounded-xl border border-slate-200 p-5">
            <h3 class="font-semibold text-sm mb-4">指标概览（${selected.period}）
              <span class="ml-1 text-[10px] text-slate-400 font-normal">月内口径</span>
            </h3>
            <div class="space-y-3">
              ${[
                ['净盈亏', m.profit_loss !== null ? (m.profit_loss >= 0 ? '+' : '') + fmtMoney(m.profit_loss) + ' 元' : '—', m.profit_loss >= 0 ? 'text-red-600' : 'text-green-600'],
                ['胜率', m.win_rate !== null ? fmtPct(m.win_rate) : '—', 'text-slate-800'],
                ['盈亏比', m.profit_factor !== null ? m.profit_factor.toFixed(2) : '—', 'text-slate-800'],
                ['纪律执行率', m.discipline_score !== null ? fmtPct(m.discipline_score) : '—', m.discipline_score !== null && m.discipline_score < 0.9 ? 'text-amber-500' : 'text-emerald-600'],
                ['成交笔数', m.total_trades + ' 笔', 'text-slate-800'],
                ['平均持仓', m.avg_holding_days !== null ? m.avg_holding_days + ' 天' : '—', 'text-slate-800'],
              ].map(([k, v, cls]) => `
                <div class="flex justify-between items-center py-1.5 border-b border-slate-100 last:border-0">
                  <span class="text-xs text-slate-500">${k}</span>
                  <span class="text-sm font-medium ${cls}">${v}</span>
                </div>`).join('')}
              ${m.mom_delta && Object.keys(m.mom_delta).length ? `<div class="pt-2 border-t border-slate-100 mt-2">
                <div class="text-xs text-slate-400 mb-1">环比上月</div>
                ${m.mom_delta.profit_loss !== undefined ? `<div class="text-xs text-slate-500">盈亏 ${fmtDelta(m.mom_delta.profit_loss)}</div>` : ''}
                ${m.mom_delta.win_rate !== undefined ? `<div class="text-xs text-slate-500">胜率 ${fmtDelta(m.mom_delta.win_rate)}</div>` : ''}
                ${m.mom_delta.discipline_score !== undefined ? `<div class="text-xs text-slate-500">纪律 ${fmtDelta(m.mom_delta.discipline_score)}</div>` : ''}
              </div>` : ''}
            </div>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 p-5">
            <h3 class="font-semibold text-sm mb-3">违规 Top3</h3>
            ${top3HTML}
          </div>

          ${m.shadow ? `
          <div class="bg-white rounded-xl border border-indigo-200 p-5">
            <h3 class="font-semibold text-sm mb-1">影子账户·反事实回放
              <span class="ml-1 text-[10px] text-slate-400 font-normal">全历史口径</span></h3>
            <div class="text-xs text-slate-400 mb-3">如果完全按你的规矩来</div>
            <div class="flex justify-between items-center py-1.5 border-b border-slate-100">
              <span class="text-xs text-slate-500">违规代价（影子−真实）</span>
              <span class="text-sm font-medium ${m.shadow.delta_pnl >= 0 ? 'text-red-600' : 'text-green-600'}">${m.shadow.delta_pnl >= 0 ? '+' : ''}${fmtMoney(m.shadow.delta_pnl)}</span>
            </div>
            <div class="flex justify-between items-center py-1.5 border-b border-slate-100">
              <span class="text-xs text-slate-500">拦截 / 修正 / 不可回放</span>
              <span class="text-sm font-medium text-slate-800">${m.shadow.skipped} / ${m.shadow.adjusted} / ${m.shadow.unverifiable}</span>
            </div>
            <a href="#/shadow" class="block text-center mt-3 text-xs text-indigo-600 hover:underline">查看逐笔回放明细 →</a>
          </div>` : ''}
        </div>

        <!-- AI 报告正文 + 一句话摘要 -->
        <div class="lg:col-span-3 bg-white rounded-xl border border-slate-200 p-6">
          <div class="flex items-center mb-4">
            <div class="font-semibold text-lg">AI 月度体检报告</div>
            <span class="ml-3 text-xs bg-indigo-50 text-indigo-600 rounded px-2 py-0.5">${selected.period}</span>
            <button id="r-toggle" class="ml-auto text-xs text-slate-500 hover:text-slate-700">${state.collapsed ? '展开' : '折叠'}</button>
          </div>

          <!-- 一句话摘要（LLM summary_text，已转义） -->
          ${selected.summary_text ? `
          <div class="bg-indigo-50 border-l-4 border-indigo-500 rounded-r-lg px-4 py-3 mb-5">
            <div class="text-xs text-indigo-500 font-medium mb-1">一句话摘要</div>
            <div class="text-sm text-slate-700">${esc(selected.summary_text)}</div>
          </div>` : ''}

          <!-- 报告正文（LLM report_text，可折叠，已转义） -->
          ${!state.collapsed && selected.report_text ? `
          <div class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap report-body">
            ${esc(selected.report_text)}
          </div>` : ''}
          ${!selected.report_text ? '<div class="text-sm text-slate-400">正文尚未生成</div>' : ''}

          <!-- 合规扫描 + 模型信息 -->
          <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap items-center gap-3 text-xs text-slate-400">
            ${compHTML}
            ${llmMeta && llmMeta.llm_source === 'remote' ? '<span class="inline-flex items-center gap-1 text-xs text-emerald-600 bg-emerald-50 rounded px-2 py-0.5">真实 LLM 生成</span>' : ''}
            ${llmMeta && llmMeta.llm_source === 'mock' ? '<span class="inline-flex items-center gap-1 text-xs text-amber-600 bg-amber-50 rounded px-2 py-0.5">模板引擎生成</span>' : ''}
            ${unv.length ? `<span class="inline-flex items-center gap-1 text-xs text-amber-600 bg-amber-50 rounded px-2 py-0.5" title="这些数字在指标 JSON 中找不到来源：${unv.join('、')}">⚠ ${unv.length} 个数字未溯源</span>` : ''}
            <span>模型：${esc(selected.llm_model || '—')}</span>
            <span>Prompt 版本：${esc(selected.llm_prompt_ver || '—')}</span>
            <span class="ml-auto">生成于 ${selected.created_at ? new Date(selected.created_at * 1000).toLocaleString('zh-CN') : '—'}</span>
            ${llmMeta && llmMeta.llm_note ? `<div class="w-full mt-1 text-xs text-amber-600">${esc(llmMeta.llm_note)}</div>` : ''}
          </div>
        </div>
      </div>
      `}

      <!-- 底部：历史列表（完整） -->
      ${history.length ? `
      <div class="bg-white rounded-xl border border-slate-200 p-5">
        <h3 class="font-semibold text-sm mb-3">报告历史（${history.length} 份）</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          ${historyHTML}
        </div>
      </div>
      ` : ''}
    </div>`;

    // 事件绑定
    // 同步打印模板：无论屏幕端是否折叠，打印版始终携带完整正文与合规信息；
    // 无报告（noData）时自动清空，避免打印出过期内容
    fillPrintRoot(noData ? null : selected, m, llmMeta, unv, top3List);
    const pdfBtn = el.querySelector('#r-pdf');
    if (pdfBtn) pdfBtn.onclick = () => window.print();
    el.querySelector('#r-period').onchange = e => { state.selectedPeriod = e.target.value; renderOnce(); };
    el.querySelector('#r-gen').onclick = async () => {
      const period = el.querySelector('#r-period').value;
      if (!period) { alert('请选择月份'); return; }
      state.loading = true; renderOnce();
      try {
        await generateReportFor(period);
        // 刷新 history + 选中当前 period
        const refreshed = q(
          `SELECT * FROM review_reports WHERE user_id=$u ORDER BY period DESC`,
          { $u: LOCAL_USER_ID }
        );
        history.splice(0, history.length, ...refreshed);
        state.selectedPeriod = period;
      } catch (e) {
        alert('生成失败：' + e.message);
        console.error(e);
      } finally {
        state.loading = false;
        renderOnce();
      }
    };
    // —— LLM 引擎配置面板 ——
    const panel = el.querySelector('#r-llm-panel');
    el.querySelector('#r-llm').onclick = () => { state.llmPanelOpen = !state.llmPanelOpen; panel.classList.toggle('hidden', !state.llmPanelOpen); };
    // 回退提示条上的「检查设置」直接展开配置面板
    const alertOpen = el.querySelector('#r-llm-alert-open');
    if (alertOpen) alertOpen.onclick = () => { state.llmPanelOpen = true; panel.classList.remove('hidden'); panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
    el.querySelector('#llm-provider').onchange = e => {
      const p = LLM_PROVIDERS[e.target.value];
      if (!p) return;
      if (p.baseUrl) el.querySelector('#llm-base').value = p.baseUrl;
      if (p.model) el.querySelector('#llm-model').value = p.model;
    };
    const readCfg = () => ({
      provider: el.querySelector('#llm-provider').value,
      baseUrl: el.querySelector('#llm-base').value.trim(),
      model: el.querySelector('#llm-model').value.trim(),
      apiKey: el.querySelector('#llm-key').value.trim(),
    });
    el.querySelector('#llm-save').onclick = () => {
      saveLLMConfig(readCfg());
      state.llmMsg = '已保存到本机浏览器';
      state.llmMsgCls = 'text-emerald-600';
      renderOnce();
    };
    el.querySelector('#llm-test').onclick = async () => {
      saveLLMConfig(readCfg());
      state.llmMsg = '测试中…';
      state.llmMsgCls = 'text-slate-500';
      renderOnce();
      const r = await testLLMConnection();
      state.llmMsg = r.msg;
      state.llmMsgCls = r.ok ? 'text-emerald-600' : 'text-red-600';
      renderOnce();
    };
    el.querySelector('#llm-clear').onclick = () => {
      clearLLMConfig();
      state.llmMsg = '已清除，回到本地模板引擎';
      state.llmMsgCls = 'text-slate-500';
      renderOnce();
    };

    const toggle = el.querySelector('#r-toggle');
    if (toggle) toggle.onclick = () => { state.collapsed = !state.collapsed; renderOnce(); };
    el.querySelectorAll('.hist-item, .hist-chip').forEach(b => {
      if (b.dataset.period) b.onclick = () => { state.selectedPeriod = b.dataset.period; renderOnce(); };
    });
  }
}

// ============================================================
// sync.js — Phase 1 云端账号 + 数据同步层
// 设计红线：
//   1. 计算永远留在浏览器；本层只做 push/pull，不碰任何指标计算
//   2. 本地仍写 local-user；推送时服务端强制覆盖为真实 uid，
//      拉取时把 user_id 改写回 local-user —— 其余页面代码零改动
//   3. 增量水位：append-only 表看 created_at，可更新表（trades /
//      trade_plans / review_reports）看 updated_at；冲突规则客户端优先
//      （INSERT OR REPLACE，最后写入者胜）
//   4. 未登录时一切为静默 no-op（离线版/演示版行为完全不变）
// ============================================================

const AUTH_KEY = 'trae_auth_v1';       // {serverUrl, email, uid, token}
const WM_KEY = 'trae_sync_wm_v1';      // 每表水位 {table: ts}
const PLAN_KEY = 'trae_plan_v1';       // /api/me 的 plan 快照（会员判定唯一来源仍是服务端）

// 免费版自定义模板额度（服务端 plan.limits.templates 的兜底值，见 Phase2_会员支付方案.md §2）
const FREE_TEMPLATE_LIMIT = 1;
// 秒级水位安全边距：编辑与上次同步落在同一秒时，严格大于会漏掉该行；
// 回拨 2 秒会重复推送/拉取少量行，由 INSERT OR REPLACE 幂等吸收，无副作用
const SYNC_MARGIN_SEC = 2;

// 同步表清单：append-only 用 created_at；updatable 用 updated_at（迁移已回填）
// broker_templates 带 where：内置模板是代码资产，永不推送（服务端也会强制 is_builtin=0）
const SYNC_TABLES = [
  { name: 'import_batches', wm: 'created_at' },
  { name: 'broker_templates', wm: 'updated_at', where: 'AND is_builtin=0' },
  { name: 'trades', wm: 'updated_at' },
  { name: 'trade_plans', wm: 'updated_at' },
  { name: 'discipline_rules', wm: 'updated_at' },
  { name: 'rule_violations', wm: 'created_at' },
  { name: 'review_reports', wm: 'updated_at' },
  { name: 'signals', wm: 'created_at' },
  { name: 'signal_fills', wm: 'created_at' },
];

// 表名 → 水位列（pull 应用删除时的 LWW 护栏用；同时充当客户端表白名单）
const TABLE_WM = Object.fromEntries(SYNC_TABLES.map(t => [t.name, t.wm]));

function getAuth() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { return null; }
}
function saveAuth(a) {
  const prev = getAuth();
  // 换账号：上一个账号的额度缓存立即作废，避免把会员额度带给免费账号
  if (!prev || prev.uid !== a.uid) localStorage.removeItem(PLAN_KEY);
  localStorage.setItem(AUTH_KEY, JSON.stringify(a));
}
function logout() {
  localStorage.removeItem(AUTH_KEY); localStorage.removeItem(WM_KEY); localStorage.removeItem(PLAN_KEY);
}

function getWM() { try { return JSON.parse(localStorage.getItem(WM_KEY) || '{}'); } catch (e) { return {}; } }
function saveWM(wm) { localStorage.setItem(WM_KEY, JSON.stringify(wm)); }

async function api(path, body) {
  const auth = getAuth();
  if (!auth) throw new Error('未登录');
  const resp = await fetch(auth.serverUrl.replace(/\/+$/, '') + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + auth.token },
    body: JSON.stringify(body || {}),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
  return data;
}

// 带鉴权的写请求（下单 / 模拟回调）：失败抛错，由调用方展示
const apiPost = api;

// 只读 GET（会员状态 / 商品价目用）：未登录、断网、非 2xx 一律返回 null。
// 会员页是纯展示页，任何失败都不该抛错阻塞渲染或影响其他功能。
async function apiGet(path) {
  const auth = getAuth();
  if (!auth) return null;
  try {
    const resp = await fetch(auth.serverUrl.replace(/\/+$/, '') + path, {
      headers: { Authorization: 'Bearer ' + auth.token },
    });
    if (!resp.ok) return null;
    return await resp.json();
  } catch (e) { return null; }
}

// ---------- 会员计划快照（模板额度等权益的唯一来源是服务端 planOf()） ----------
function cachedPlan() {
  try { return JSON.parse(localStorage.getItem(PLAN_KEY) || 'null'); } catch (e) { return null; }
}

// 自定义模板额度：null = 不限（会员）；数字 = 上限（免费版）。
// 缓存缺失（未登录 / 从未刷新 / 读取失败）一律按免费版从严处理 —— 断网不能变成解锁。
function customTemplateQuota() {
  const p = cachedPlan();
  if (!p || !p.limits) return FREE_TEMPLATE_LIMIT;
  if (p.limits.templates === null) {
    // 缓存可能已过期：到期时间本地可见，过点即降回免费额度，不等下次刷新
    return (p.expire_at && p.expire_at <= Math.floor(Date.now() / 1000)) ? FREE_TEMPLATE_LIMIT : null;
  }
  const n = Number(p.limits.templates);
  return Number.isFinite(n) ? n : FREE_TEMPLATE_LIMIT;
}

// 拉取最新计划并写入缓存；失败返回 null（保留旧缓存，不抛错阻塞页面）
async function refreshPlan() {
  const d = await apiGet('/api/me');
  if (!d || !d.plan) return null;
  localStorage.setItem(PLAN_KEY, JSON.stringify(d.plan));
  return d.plan;
}

async function register(serverUrl, email, password) {
  const resp = await fetch(serverUrl.replace(/\/+$/, '') + '/api/auth/register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
  saveAuth({ serverUrl: serverUrl.replace(/\/+$/, ''), email, uid: data.uid, token: data.token });
  return data;
}

async function login(serverUrl, email, password) {
  const resp = await fetch(serverUrl.replace(/\/+$/, '') + '/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
  saveAuth({ serverUrl: serverUrl.replace(/\/+$/, ''), email, uid: data.uid, token: data.token });
  return data;
}

// 全量/增量同步主流程。返回 {pushed, pulled} 计数。
async function syncNow() {
  const auth = getAuth();
  if (!auth) return null;                       // 未登录：静默跳过
  const wm = getWM();
  const sinceMap = {}, payload = {};
  let pushed = 0, pulled = 0, deleted = 0;

  // —— push：本地水位之后的变更 + 删除墓碑 ——
  for (const t of SYNC_TABLES) {
    const since = Math.max(0, (wm[t.name] || 0) - SYNC_MARGIN_SEC);
    const rows = q(
      `SELECT * FROM ${t.name} WHERE user_id=$u AND COALESCE(${t.wm}, created_at) > $s ${t.where || ''}`,
      { $u: LOCAL_USER_ID, $s: since }
    );
    if (rows.length) { payload[t.name] = rows; pushed += rows.length; }
    sinceMap[t.name] = since;
  }
  const delSince = Math.max(0, (wm._deletes || 0) - SYNC_MARGIN_SEC);
  const deletes = q(
    'SELECT table_name, id, deleted_at FROM sync_tombstones WHERE user_id=$u AND deleted_at > $s',
    { $u: LOCAL_USER_ID, $s: delSince }
  ).map(r => ({ table: r.table_name, id: r.id, deleted_at: r.deleted_at }));
  sinceMap._deletes = delSince;
  const pushResp = await api('/api/sync/push', { tables: payload, deletes });
  const serverNow = pushResp.server_time;
  // 服务端硬拒绝（免费版模板额度）：被拒行只留本地、不上云，下次编辑前不再重推。
  // 正常用户走不到这里（import.js 已按额度原地覆盖），这是绕过前端时的兜底。
  const rejectedTpl = (pushResp.rejected && pushResp.rejected.broker_templates) || [];
  if (rejectedTpl.length) {
    console.warn(`[sync] ${rejectedTpl.length} 个自定义模板超出免费版额度，已被服务端拒绝（仅存本机）`);
  }

  // —— pull：服务端水位之后的变更（user_id 改写回 local-user） + 删除墓碑 ——
  const pullResp = await api('/api/sync/pull', { since: sinceMap });
  for (const t of SYNC_TABLES) {
    const rows = pullResp.tables[t.name] || [];
    for (const r of rows) {
      r.user_id = LOCAL_USER_ID;
      const cols = Object.keys(r);
      run(`INSERT OR REPLACE INTO ${t.name} (${cols.join(',')})
           VALUES (${cols.map(c => '$' + c).join(',')})`,
        Object.fromEntries(cols.map(c => ['$' + c, r[c]])));
      pulled++;
    }
  }
  // 删除传播：先 upsert 后删除——LWW 护栏只删「水位列不晚于删除时间」的行，
  // 防止陈旧墓碑误删删除之后重建的新内容（确定性 ID 同 ID 复用场景）
  for (const d of (pullResp.deletes || [])) {
    const wmCol = TABLE_WM[d.table];
    if (!wmCol || typeof d.id !== 'string' || !d.id) continue;
    run(`DELETE FROM ${d.table} WHERE id=$id AND user_id=$u AND COALESCE(${wmCol}, created_at) <= $ts`,
      { $id: d.id, $u: LOCAL_USER_ID, $ts: d.deleted_at });
    if (q1('SELECT changes() c').c) deleted++;
  }

  // 水位推进到服务端时间（双端时间不一致时以服务端为准，避免漏拉）
  for (const t of SYNC_TABLES) wm[t.name] = serverNow;
  wm._deletes = serverNow;
  saveWM(wm);
  return { pushed, pulled, deleted, rejected_templates: rejectedTpl.length, server_time: serverNow };
}

// 登录后首次调用：本地有数据则推送迁移，本地为空则全量拉取
async function initialSync() {
  const wm = getWM();
  if (!Object.keys(wm).length) {
    const localTrades = q('SELECT COUNT(*) c FROM trades WHERE user_id=$u', { $u: LOCAL_USER_ID })[0].c;
    if (localTrades === 0) {
      // 全新设备：拉取云端全部数据
      const r = await syncAll(0);
      return { ...r, mode: 'pull-all' };
    }
    return { ...(await syncAll(0)), mode: 'push-migrate' };
  }
  return { ...(await syncNow()), mode: 'incremental' };
}

async function syncAll(zeroSince) {
  const wm = {};
  for (const t of SYNC_TABLES) wm[t.name] = zeroSince;
  saveWM(wm);
  return syncNow();
}

// 自动同步钩子：数据变更后静默推送（仅已登录时；失败不打扰用户）
function autoSync() {
  if (!getAuth()) return;
  syncNow().catch(e => console.warn('[sync] 自动同步失败（将在下次手动同步时重试）:', e.message));
}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];

  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const cell = 4, margin = 4;
  const size = (n + margin * 2) * cell;
  canvas.width = canvas.height = size;
  canvas.style.width = canvas.style.height = '100%';
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#0f172a';
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (qr.isDark(r, c)) ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell, cell);
    }
  }
}
