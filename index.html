// ============================================================
// shadow.js — 影子账户「反事实回放」（旗舰功能，见 反事实回放_功能方案.md）
// 用用户自己的纪律规则对历史成交做「守规则版」重放，量化违规代价。
// 红线：只重放真实历史数据；缺少行情数据时标 unverifiable，绝不编造价格。
// 不落库、不同步：派生数据，每次打开现算，规则参数变了结果自动变。
// ============================================================

// 影子流里的虚拟卖出单（t1_check 顺延 / stop_loss 修正产生）公共字段
let shadowSeq = 0;
function virtualSell(orig, traded_at, price, note) {
  return {
    ...orig,
    id: orig.id + '#shadow' + (shadowSeq++), // 虚拟 ID，不撞真实主键
    traded_at, price,
    amount: Math.round(orig.quantity * price * 100) / 100,
    fee: 0, // 费用近似沿用原费（已在 ...orig 展开）；v1 不另算
    pair_id: null, is_t1_locked: 0,
    _virtual: note,
  };
}

// 各规则的回放动作：返回 { action:'skip'|'delay_next_day'|'adjust', ... } 或 null
// skip = 影子账户放弃该笔（连锁剔除其衍生卖出）；delay_next_day = T+1 顺延卖出；
// adjust = 止损修正（缺行情证据时返回 { unverifiable }）
function replayAction(rule_key, trade, ctx) {
  const p = ctx.params[rule_key] || {};
  switch (rule_key) {
    case 'no_tail_chase': {
      const [hh, mm] = (p.after || '14:50').split(':').map(Number);
      const d = new Date(trade.traded_at * 1000);
      return (trade.direction === 'buy' && d.getHours() * 60 + d.getMinutes() >= hh * 60 + mm)
        ? { action: 'skip', reason: `尾盘追高（${fmtTime(trade.traded_at)} ≥ ${p.after || '14:50'}）` } : null;
    }
    case 'max_position_pct': {
      const limit = (p.capital || 0) * (p.max_pct || 1);
      return (trade.direction === 'buy' && trade.amount > limit)
        ? { action: 'skip', reason: `单票仓位超限（${Math.round(trade.amount)} > 上限 ${Math.round(limit)}）` } : null;
    }
    case 'max_weekly_trades': {
      const seq = ctx.weeklySeq.get(trade.id) || 0;
      return seq > (p.max || 10)
        ? { action: 'skip', reason: `单周交易次数超上限（当周第 ${seq} 笔 > ${p.max || 10}）` } : null;
    }
    case 'revenge_window': {
      // 复用规则引擎同款窗口语义：同 symbol 上一「买入→连续卖出段」亏损且 N 分钟内再买
      const w = ctx.revenge.get(trade.symbol);
      if (trade.direction === 'buy') {
        if (w && w.sellCnt > 0 && trade.traded_at - w.lastTs <= (p.after_loss_minutes || 30) * 60 && w.proceeds - w.cost < 0) {
          return { action: 'skip', reason: `报复性交易（亏损平仓 ${Math.round((trade.traded_at - w.lastTs) / 60)} 分钟内再买）` };
        }
      }
      return null;
    }
    case 'loss_streak_add': {
      // 需要完整交易口径，无法逐笔预判 → 后处理（见下方 secondPass）
      return null;
    }
    case 't1_check': {
      // 当日买入当日卖出：影子账户顺延到下一自然日，价格取该 symbol 下一笔真实成交价；
      // 找不到下一笔真实成交 → 无价格证据，unverifiable
      if (trade.direction !== 'sell' || !ctx.t1SellIds.has(trade.id)) return null;
      const later = ctx.trades.find(t => t.symbol === trade.symbol && t.id !== trade.id && t.traded_at > trade.traded_at && new Date(t.traded_at * 1000).toDateString() !== new Date(trade.traded_at * 1000).toDateString());
      if (!later) return { action: 'unverifiable', reason: 'T+1 顺延卖出找不到次日真实成交价作为证据' };
      return { action: 'delay_next_day', price: later.price, at: later.traded_at, reason: `T+1 违规卖出，顺延至次日（价格取次日真实成交 ${later.price}）` };
    }
    case 'stop_loss': {
      // 触线日需要持仓期间日线价，库内只有成交价 → 找该完整交易持有期内该 symbol
      // 是否有真实成交价格已跌穿止损线；有 → 在该时点模拟卖出；无 → unverifiable（绝不编价）
      if (trade.direction !== 'sell' || !ctx.stopLossPairs.has(trade.id)) return null;
      const pair = ctx.stopLossPairs.get(trade.id); // {openAt, cost, qty, stopLine}
      const mid = ctx.trades.find(t => t.symbol === trade.symbol && t.traded_at > pair.openAt && t.traded_at < trade.traded_at && t.price <= pair.stopLine);
      if (!mid) return { action: 'unverifiable', reason: '持有期内无真实成交价证明何时触止损线（缺日线行情）' };
      return { action: 'adjust', price: mid.price, at: mid.traded_at, reason: `跌穿止损线 ${pair.stopLine}（证据：${fmtTime(mid.traded_at)} 真实成交 ${mid.price}），影子账户提前卖出` };
    }
  }
  return null;
}

// 回放前预计算上下文（每周计数、T+1 卖出集合、止损完整交易集合、报复性窗口）
function buildCtx(trades, rules) {
  const params = {};
  for (const r of rules) params[r.rule_key] = JSON.parse(r.params_json || '{}');
  // 每笔成交是「当周第几笔」（含买卖，与规则引擎 max_weekly_trades 同口径：按 traded_at 升序数）
  const weeklySeq = new Map();
  {
    const seen = new Map();
    for (const t of trades) {
      const wk = weekKey(t.traded_at);
      const n = (seen.get(wk) || 0) + 1;
      seen.set(wk, n);
      weeklySeq.set(t.id, n);
    }
  }
  const realPairs = computePairs(trades);
  // T+1 违规卖出 ID 集合（与规则引擎同口径）
  const t1SellIds = new Set(realPairs.t1.filter(v => v.buyTrade).map(v => v.sellTrade.id));
  // 止损违规完整交易：收益率 < -max_loss_pct 的 closed pair（取最早买入为成本基准）
  const stopLossPairs = new Map();
  const slp = params.stop_loss || {};
  for (const c of realPairs.closed) {
    if (c.ret < -(slp.max_loss_pct || 0.07)) {
      stopLossPairs.set(c.sellTradeIds[0], {
        openAt: c.openAt, cost: c.cost, qty: c.qty,
        stopLine: Math.round((c.cost / c.qty) * (1 - (slp.max_loss_pct || 0.07)) * 10000) / 10000,
      });
    }
  }
  return { params, weeklySeq, t1SellIds, stopLossPairs, trades, revenge: new Map() };
}

// 指标口径与体检页完全一致（同一 computePairs 输出 → 同一组公式）
function shadowMetrics(pairs) {
  const closed = pairs.closed;
  const pnl = Math.round(closed.reduce((s, c) => s + c.pnl, 0) * 100) / 100;
  const wins = closed.filter(c => c.pnl > 0);
  const losses = closed.filter(c => c.pnl < 0);
  const winRate = closed.length ? wins.length / closed.length : null;
  const expectancy = closed.length ? Math.round(pnl / closed.length * 100) / 100 : null;
  // 最大回撤：按平仓时间升序的累计盈亏曲线
  const curve = closed.slice().sort((a, b) => a.closeAt - b.closeAt);
  let peak = 0, cum = 0, maxDD = 0;
  const equity = [];
  for (const c of curve) {
    cum = Math.round((cum + c.pnl) * 100) / 100;
    peak = Math.max(peak, cum);
    maxDD = Math.min(maxDD, cum - peak);
    equity.push({ at: c.closeAt, cum });
  }
  return { pnl, winRate, expectancy, maxDrawdown: maxDD, tradeCount: closed.length, equity };
}

// ---------- 主入口：影子账户回放 ----------
// 输入：真实成交流（升序）+ 启用规则集；输出：影子指标/真实指标/逐条动作/不可回放条目
function shadowReplay(trades, rules) {
  shadowSeq = 0;
  const sorted = trades.slice().sort((a, b) => a.traded_at - b.traded_at || a.source_row_no - b.source_row_no);
  const ctx = buildCtx(sorted, rules);
  const skipRules = new Set(['no_tail_chase', 'max_position_pct', 'max_weekly_trades', 'revenge_window']);
  const enabledKeys = new Set(rules.map(r => r.rule_key));

  const actions = [];      // { tradeId, ruleKey, action, reason, trade }
  const unverifiable = []; // { tradeId, ruleKey, reason, trade }
  const shadowTrades = [];

  for (const t of sorted) {
    // ① skip 语义：买入被拦截 → 影子流不含该笔；其衍生卖出由 FIFO 超卖检测自然剔除
    if (t.direction === 'buy') {
      let skipHit = null;
      for (const k of skipRules) {
        if (!enabledKeys.has(k)) continue;
        const hit = replayAction(k, t, ctx);
        if (hit && hit.action === 'skip') { skipHit = { k, hit }; break; }
      }
      // 报复性窗口按「真实成交流」推进（无论该笔是否被影子拦截），与规则引擎判定口径一致
      ctx.revenge.set(t.symbol, { cost: t.amount + t.fee, proceeds: 0, lastTs: t.traded_at, sellCnt: 0 });
      if (skipHit) {
        actions.push({ tradeId: t.id, ruleKey: skipHit.k, action: 'skip', reason: skipHit.hit.reason, trade: t });
        continue;
      }
      shadowTrades.push(t);
      continue;
    }
    // ② 卖出先全部进影子流；连锁剔除在下一步统一做：
    // 「影子买入 + 全部真实卖出」跑 FIFO，卖出消耗不到影子买入（超卖）即说明成本来自被拦截买入
    shadowTrades.push(t);
    // 报复性窗口推进
    const w = ctx.revenge.get(t.symbol);
    if (w) { w.proceeds += t.amount - t.fee; w.lastTs = t.traded_at; w.sellCnt++; }
  }

  // ③ 连锁剔除：影子买入 + 真实卖出跑 FIFO，卖出消耗不到买入（超卖）→ 剔除
  const kept = [];
  {
    const queue = {}; // symbol -> [{id, remaining}]
    for (const t of shadowTrades) {
      if (t.direction === 'buy') {
        (queue[t.symbol] = queue[t.symbol] || []).push({ id: t.id, remaining: t.quantity });
        kept.push(t);
      } else {
        let remaining = t.quantity;
        const q = queue[t.symbol] || [];
        for (const head of q) {
          if (remaining <= 0) break;
          const take = Math.min(head.remaining, remaining);
          head.remaining -= take; remaining -= take;
        }
        while (q.length && q[0].remaining <= 0) q.shift();
        if (remaining > 0) {
          // 部分/全部消耗不到影子买入：说明其真实成本来自被 skip 的买入 → 整笔剔除并记录
          const src = trades.find(x => x.id === t.id);
          actions.push({ tradeId: t.id, ruleKey: '_chain', action: 'skip', reason: '连锁剔除：该笔卖出的买入来源已被影子账户拦截', trade: src || t });
          continue;
        }
        kept.push(t);
      }
    }
    shadowTrades.length = 0;
    shadowTrades.push(...kept);
  }

  // ④ t1_check 顺延 / stop_loss 修正（对仍在影子流里的卖出）
  const final = [];
  for (const t of shadowTrades) {
    if (t.direction !== 'sell') { final.push(t); continue; }
    if (enabledKeys.has('t1_check')) {
      const hit = replayAction('t1_check', t, ctx);
      if (hit) {
        if (hit.action === 'unverifiable') { unverifiable.push({ tradeId: t.id, ruleKey: 't1_check', reason: hit.reason, trade: t }); final.push(t); continue; }
        actions.push({ tradeId: t.id, ruleKey: 't1_check', action: 'delay_next_day', reason: hit.reason, trade: t });
        final.push(virtualSell(t, hit.at, hit.price, 't1顺延'));
        continue;
      }
    }
    if (enabledKeys.has('stop_loss')) {
      const hit = replayAction('stop_loss', t, ctx);
      if (hit) {
        if (hit.action === 'unverifiable') { unverifiable.push({ tradeId: t.id, ruleKey: 'stop_loss', reason: hit.reason, trade: t }); final.push(t); continue; }
        actions.push({ tradeId: t.id, ruleKey: 'stop_loss', action: 'adjust', reason: hit.reason, trade: t });
        final.push(virtualSell(t, hit.at, hit.price, '止损修正'));
        continue;
      }
    }
    final.push(t);
  }

  // ⑤ loss_streak_add 后处理：对真实配对计算连亏后加仓的买入，若该买入仍在影子流则 skip
  if (enabledKeys.has('loss_streak_add')) {
    const realPairsAll = computePairs(sorted);
    const hits = evaluateRules(rules.filter(r => r.rule_key === 'loss_streak_add'), sorted, realPairsAll);
    if (hits.length) {
      const removeIds = new Set();
      for (const h of hits) {
        if (final.some(t => t.id === h.trade.id)) {
          removeIds.add(h.trade.id);
          actions.push({ tradeId: h.trade.id, ruleKey: 'loss_streak_add', action: 'skip', reason: h.evidence.说明, trade: h.trade });
        }
      }
      if (removeIds.size) {
        // 剔除这些买入并再次连锁剔除其衍生卖出
        const kept2 = final.filter(t => !removeIds.has(t.id));
        const queue = {};
        const kept3 = [];
        for (const t of kept2) {
          if (t.direction === 'buy') { (queue[t.symbol] = queue[t.symbol] || []).push({ remaining: t.quantity }); kept3.push(t); continue; }
          let remaining = t.quantity;
          const q2 = queue[t.symbol] || [];
          for (const head of q2) { if (remaining <= 0) break; const take = Math.min(head.remaining, remaining); head.remaining -= take; remaining -= take; }
          while (q2.length && q2[0].remaining <= 0) q2.shift();
          if (remaining > 0) { actions.push({ tradeId: t.id, ruleKey: '_chain', action: 'skip', reason: '连锁剔除：买入来源被连败加仓规则拦截', trade: t }); continue; }
          kept3.push(t);
        }
        final.length = 0; final.push(...kept3);
      }
    }
  }

  const realMetrics = shadowMetrics(computePairs(sorted));
  const shadowPairsResult = computePairs(final.slice().sort((a, b) => a.traded_at - b.traded_at || a.source_row_no - b.source_row_no));
  const shadowMet = shadowMetrics(shadowPairsResult);

  return {
    real: realMetrics,
    shadow: shadowMet,
    delta: {
      pnl: Math.round((shadowMet.pnl - realMetrics.pnl) * 100) / 100,
      tradeCount: shadowMet.tradeCount - realMetrics.tradeCount,
      skipped: actions.filter(a => a.action === 'skip').length,
      adjusted: actions.filter(a => a.action === 'adjust' || a.action === 'delay_next_day').length,
      unverifiable: unverifiable.length,
    },
    actions, unverifiable,
  };
}

function metricCard(title, m, accent) {
  return `
  <div class="bg-white rounded-xl border ${accent ? 'border-indigo-300 ring-1 ring-indigo-100' : 'border-slate-200'} p-5">
    <div class="text-xs text-slate-400 mb-1">${title}</div>

}

function renderShadow(el) {
  const trades = q('SELECT * FROM trades WHERE user_id=$u ORDER BY traded_at, source_row_no', { $u: LOCAL_USER_ID });
  if (!trades.length) {
    el.innerHTML = `<div class="p-6"><div class="bg-white rounded-2xl border border-dashed border-slate-300 p-16 text-center">
      <div class="text-lg font-semibold text-slate-700 mb-2">影子账户需要先有真实成交</div>
      <p class="text-sm text-slate-500 mb-5">导入交割单或生成模拟数据后，这里会重放「如果完全按你的规矩来」。</p>
      <a href="#/import" class="inline-block px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm">前往交割单导入中心</a>
    </div></div>`;
    return;
  }
  const rules = q('SELECT * FROM discipline_rules WHERE user_id=$u AND enabled=1', { $u: LOCAL_USER_ID });
  const r = shadowReplay(trades, rules);

  // 会员判定：唯一来源是服务端 planOf() 的缓存快照；缓存缺失/过期按免费版从严（与模板额度同口径）
  const plan = cachedPlan();
  const isMember = !!(plan && plan.is_member && plan.expire_at && plan.expire_at > Math.floor(Date.now() / 1000));

  // 权益曲线合并（真实 vs 影子，按时间对齐）
  const curvePts = [];
  {
    const ev = new Map();
    for (const p of r.real.equity) ev.set(p.at, { real: p.cum });
    for (const p of r.shadow.equity) { const o = ev.get(p.at) || {}; o.shadow = p.cum; ev.set(p.at, o); }
    const ats = Array.from(ev.keys()).sort((a, b) => a - b);
    let lastReal = 0, lastShadow = 0;
    for (const at of ats) {
      const o = ev.get(at);
      if (o.real !== undefined) lastReal = o.real;
      if (o.shadow !== undefined) lastShadow = o.shadow;
      curvePts.push({ at, real: lastReal, shadow: lastShadow });
    }
  }
  const svgW = 720, svgH = 160, pad = 8;
  const minV = Math.min(0, ...curvePts.map(p => Math.min(p.real, p.shadow)));
  const maxV = Math.max(0, ...curvePts.map(p => Math.max(p.real, p.shadow)));
  const span = (maxV - minV) || 1;
  const px = i => pad + (curvePts.length > 1 ? i * (svgW - pad * 2) / (curvePts.length - 1) : 0);
  const py = v => svgH - pad - ((v - minV) / span) * (svgH - pad * 2);
  const line = key => curvePts.map((p, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)},${py(p[key]).toFixed(1)}`).join(' ');

  const FREE_ROWS = 3;
  const visibleActions = isMember ? r.actions : r.actions.slice(0, FREE_ROWS);
  const lockedCount = r.actions.length - visibleActions.length;

  el.innerHTML = `
  <div class="p-6 space-y-6">
    <div class="bg-gradient-to-br from-slate-800 to-indigo-900 rounded-xl p-5 text-white flex flex-wrap items-center gap-4">
      <div class="flex-1 min-w-56">
        <h3 class="font-semibold">如果完全按你的规矩来</h3>
        <p class="text-xs text-slate-300 mt-1">用你当前启用的 ${rules.length} 条纪律规则，对全部真实成交做一次「守规则版」重放。只回放历史，不预测行情；缺证据的条目如实标注，绝不编造价格。</p>
      </div>
      <div class="text-right">
        <div class="text-xs text-slate-300">违规代价（影子 − 真实）</div>
        <div class="text-3xl font-bold ${r.delta.pnl >= 0 ? 'text-emerald-300' : 'text-amber-300'}">${r.delta.pnl >= 0 ? '+' : ''}${fmtMoney(r.delta.pnl)}</div>
        <div class="text-xs text-slate-400 mt-1">拦截 ${r.delta.skipped} 笔 · 修正 ${r.delta.adjusted} 笔 · 不可回放 ${r.delta.unverifiable} 笔</div>
        ${r.delta.pnl < 0 ? '<div class="text-xs text-amber-200/80 mt-1 max-w-56">差额为负 = 这段区间触规交易恰好盈利；纪律的价值在长期一致性与回撤控制，不在单笔运气。</div>' : ''}
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      ${metricCard('真实账户', r.real, false)}
      ${metricCard('影子账户（守规则版）', r.shadow, true)}
    </div>

    <div class="bg-white rounded-xl border border-slate-200 p-5">
      <div class="text-sm text-slate-500 mb-2">累计盈亏曲线对比 <span class="text-slate-400">（灰=真实，靛=影子）</span></div>
      ${curvePts.length > 1 ? `

const TIER_NAME = { free: '免费版', month: '月度会员', year: '年度会员' };
const ORDER_STATUS = { pending: '待支付', paid: '已支付', closed: '已关闭', refunded: '已退款' };

// 分 → 元，去掉无意义的尾零（990 → ¥9.9，16800 → ¥168）
function yuan(cents) {
  if (cents === null || cents === undefined) return '-';
  return '¥' + (cents / 100).toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
}

function renderMember(el) {

  <div class="p-6 space-y-6">

    <div id="mem-products" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    <div id="mem-orders"></div>
    <div id="mem-foot" class="text-xs text-slate-400 leading-relaxed"></div>
  </div>`;
  loadMember(el);
}

  const plan = me.plan;
  const mockOn = !!(chans && chans.channels && chans.channels.mock && chans.channels.mock.configured);
  const usedTpl = q('SELECT COUNT(*) c FROM broker_templates WHERE is_builtin=0')[0].c;
  // limits.templates：null = 不限（会员），数字 = 免费版额度；缺失时按「—」显示，不猜数字

  statusBox.innerHTML = `
    <div class="flex items-start gap-4 flex-wrap">

        <div class="flex items-center gap-2">

          ${plan.is_member ? '<span class="text-xs px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-600">生效中</span>' : ''}
          ${plan.expired ? '<span class="text-xs px-1.5 py-0.5 rounded bg-amber-50 text-amber-600">已到期·权益已降档</span>' : ''}
        </div>
        <div class="text-xs text-slate-500 mt-2 space-y-1">
          <div>到期时间：${plan.expire_at ? esc(fmtDateTime(plan.expire_at)) : '—'}${plan.is_member ? `（剩余 ${plan.days_left} 天）` : ''}</div>
          <div>自定义模板额度：${esc(quotaTxt)}</div>
          <div>首单 ¥9.9 资格：${plan.intro_available ? '可用（仅一次）' : '已使用'}</div>
        </div>
      </div>
      <button id="mem-refresh" class="text-xs px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600">刷新</button>
    </div>
    ${plan.is_member ? '' : `<div class="mt-4 pt-4 border-t border-slate-100 text-xs text-slate-500">
      升级会员解锁：自定义模板不限 · OCR 图片交割单识别 · 多设备云端同步 · 新券商格式 48 小时内适配。
      分析功能（R 倍数 / 期望值 / 蒙特卡洛 / 纪律）全部免费，不受影响。</div>`}`;
  statusBox.querySelector('#mem-refresh').onclick = () => loadMember(el);

  // ---- 价格卡：按服务端探测结果选通道（微信 > 支付宝 > mock），都未配置则禁用 ----
  const chConf = (chans && chans.channels) || {};
  const payChannel = chConf.wechat && chConf.wechat.configured ? 'wechat'
    : chConf.alipay && chConf.alipay.configured ? 'alipay'
    : mockOn ? 'mock' : null;

  const products = (prod && prod.products) || [];
  productsBox.innerHTML = products.length ? products.map(p => {
    const hasIntro = p.intro_price_cents !== null && p.intro_price_cents !== undefined;
    const introOn = hasIntro && plan.intro_available;
    const main = introOn ? p.intro_price_cents : p.price_cents;
    return `<div class="bg-white rounded-xl border border-slate-200 p-5 flex flex-col">
      <div class="flex items-baseline justify-between">

        <span class="text-xs text-slate-400">${p.duration_days} 天</span>
      </div>
      <div class="mt-3 flex items-baseline gap-2">
        <span class="text-2xl font-bold">${yuan(main)}</span>
        ${introOn ? `<span class="text-xs text-slate-400 line-through">${yuan(p.price_cents)}</span>
          <span class="text-xs px-1.5 py-0.5 rounded bg-amber-50 text-amber-600">首单价·仅一次</span>` : ''}
      </div>
      <ul class="mt-4 space-y-1.5 text-xs text-slate-600">
        <li>· 自定义模板不限</li>
        <li>· 云端同步（多设备）</li>
        <li>· OCR 图片交割单识别</li>
      </ul>
      <button data-buy="${esc(p.product_id)}" ${payChannel ? '' : 'disabled'} class="mt-4 w-full px-4 py-2 rounded-lg text-sm ${payChannel
        ? 'bg-indigo-600 text-white hover:bg-indigo-700'
        : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">${payChannel ? CH_BTN[payChannel] : '支付通道接入中'}</button>
      <div data-msg="${esc(p.product_id)}" class="text-xs mt-2 text-center"></div>

  if (payChannel) {
    productsBox.querySelectorAll('[data-buy]').forEach(btn => {

  // ---- 订单记录（只读，供对账）----
  const orders = (ords && ords.orders) || [];
  ordersBox.innerHTML = orders.length ? `
    <div class="bg-white rounded-xl border border-slate-200 p-5">

          <th class="text-left font-normal py-1.5">时间</th><th class="text-left font-normal">商品</th>
          <th class="text-right font-normal">金额</th><th class="text-right font-normal">状态</th>
        </tr></thead>
        <tbody>${orders.map(o => `<tr class="border-b border-slate-50 last:border-0">

          <td>${esc((products.find(p => p.product_id === o.product_id) || {}).title || o.product_id)}</td>
          <td class="text-right">${fmtMoney(o.amount_cents / 100)}</td>
          <td class="text-right ${o.status === 'paid' ? 'text-emerald-600' : 'text-slate-400'}">${esc(ORDER_STATUS[o.status] || o.status)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>` : '';

  footBox.textContent = payChannel === 'mock'

    : payChannel
      ? `当前通道：${CH_BTN[payChannel]}。支付结果以渠道异步回调为准，本页自动轮询订单状态。`
      : '支付通道（微信 Native / 支付宝电脑网站）接入后开放购买，本页不会产生任何扣款。价格与权益以服务端下发为准。';
}

// 轮询订单状态：真实渠道的「支付成功」只能由异步回调确认，客户端不能自封
async function waitOrderPaid(outTradeNo, maxWaitMs = 120000) {
  const deadline = Date.now() + maxWaitMs;
  while (Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 3000));
    const d = await apiGet('/api/orders');
    const o = d && (d.orders || []).find(x => x.out_trade_no === outTradeNo);
    if (o && o.status === 'paid') return true;
  }
  return false;
}

// 统一下单：mock 闭环 / 微信扫码 / 支付宝跳转，最终都走「回调 → applyPaidNotify」同一条发货路径
async function buyChannel(el, productId, plan, channel) {
  const btn = el.querySelector(`[data-buy="${productId}"]`);
  const msg = el.querySelector(`[data-msg="${productId}"]`);
  const paybox = el.querySelector(`[data-paybox="${productId}"]`);
  const say = (t, ok) => { if (msg) { msg.textContent = t; msg.className = 'text-xs mt-2 text-center ' + (ok ? 'text-emerald-600' : 'text-red-600'); } };
  const CH_NAME = { wechat: '微信 Native', alipay: '支付宝', mock: '本地模拟' };
  const priceTip = plan.intro_available ? '按首单价' : '按原价';
  if (!confirm(channel === 'mock'
    ? `将通过本地模拟通道把「${productId}」开通到当前账号（${priceTip}），不产生任何真实扣款。继续？`
    : `将通过${CH_NAME[channel]}购买「${productId}」（${priceTip}）。继续？`)) return;
  btn.disabled = true;
  if (paybox) paybox.innerHTML = '';
  say('下单中…', true);
  try {
    const r = await apiPost('/api/orders', { product_id: productId, channel, use_intro: plan.intro_available });
    const outTradeNo = r.order.out_trade_no;

    // mock：本地直接打模拟回调，立刻闭环
    if (r.pay && r.pay.mock) {
      say('模拟支付回调中…', true);
      await apiPost('/api/pay/mock/notify', { out_trade_no: outTradeNo });
      say('已开通，正在刷新…', true);
      await refreshPlan();   // 先刷新额度缓存，导入页的「自定义模板不限」才会立刻生效
      loadMember(el);
      return;
    }

    // 微信：code_url 转二维码扫码支付，同时轮询
    if (r.pay && r.pay.wechat) {
      say('请用微信扫码支付，支付成功后本页自动刷新…', true);
      if (paybox) {
        paybox.innerHTML = `
          <div class="bg-slate-50 rounded-lg p-3">
            <div class="bg-white rounded-lg p-2 w-44 h-44 mx-auto border border-slate-200"><canvas data-qr class="w-full h-full block"></canvas></div>
            <details class="mt-2 text-xs text-slate-400">
              <summary class="cursor-pointer select-none">扫码地址（weixin://）</summary>
              <div class="font-mono break-all select-all mt-1">${esc(r.pay.wechat.code_url)}</div>
            </details>
          </div>`;
        renderQrToCanvas(paybox.querySelector('canvas[data-qr]'), r.pay.wechat.code_url);
      }
    }

    // 支付宝：新窗口打开收银台，回来等回调
    if (r.pay && r.pay.alipay) {
      say('已打开支付宝收银台（新窗口），支付完成后本页自动刷新…', true);
      window.open(r.pay.alipay.pay_url, '_blank');
    }

    const paid = await waitOrderPaid(outTradeNo);
    if (paid) {
      say('支付成功，正在刷新…', true);
      await refreshPlan();
      loadMember(el);
    } else {
      say('暂未收到支付成功回调。若已完成支付，请稍后点右上角「刷新」。', false);
      btn.disabled = false;
    }
  } catch (e) {
    say('失败：' + e.message, false);
    btn.disabled = false;
  }
}

const ROUTES = [

  { hash: '#/discipline', name: '纪律系统', render: renderDiscipline, sub: '违规自动标记 · 执行率量化' },

  { hash: '#/report', name: '月度体检', render: renderReport, sub: 'AI 自然语言报告 · 确定性指标 JSON → LLM' },
  { hash: '#/ledger', name: '复盘账本', render: renderLedger, sub: 'FIFO 配对 · T+1 校验 · 笔记标签' },
  { hash: '#/import', name: '交割单导入', render: renderImport, sub: '券商模板 · CSV映射 · 模拟数据' },
  { hash: '#/signal', name: '信号对照', render: renderSignal, sub: '三层对照（信号/成交 · 滑点/延迟）' },
  { hash: '#/member', name: '会员方案', render: renderMember, sub: '价格与会员状态由服务端下发 · 支付通道接入中' },
];

function currentRoute() {
  const h = location.hash || '#/dashboard';
  return ROUTES.find(r => r.hash === h) || ROUTES[0];
}

function render() {
  const route = currentRoute();
  document.querySelectorAll('.nav-item').forEach(a => {
    const active = a.dataset.hash === route.hash;
    a.className = `nav-item flex items-center px-4 py-2.5 rounded-lg text-sm transition ${active ? 'bg-indigo-600 text-white font-medium' : 'text-slate-600 hover:bg-slate-100'}`;
  });
  document.getElementById('view-title').textContent = route.name;
  document.getElementById('view-sub').textContent = route.sub;
  route.render(document.getElementById('view'));
  document.querySelector('main').scrollTop = 0;
}

async function boot() {
  const mask = document.getElementById('boot-mask');
  try {
    await initDB();
  } catch (e) {
    mask.innerHTML = `<div class="text-red-600 text-sm">数据库初始化失败：${e.message}<br>请检查网络（sql.js/Tailwind 走 CDN）后刷新。</div>`;
    return;
  }
  // 导航渲染
  document.getElementById('nav').innerHTML = ROUTES.map(r =>
    `<a href="${r.hash}" data-hash="${r.hash}" class="nav-item">${r.name}${r.hash === '#/signal' ? '<span class="ml-auto text-xs opacity-60">P1</span>' : ''}</a>`).join('');
  const user = q1('SELECT * FROM users WHERE id=$id', { $id: LOCAL_USER_ID });
  document.getElementById('user-badge').textContent = `${user.nickname} · ${user.plan_tier === 'free' ? '免费档' : user.plan_tier}`;
  document.getElementById('btn-export').onclick = () => exportSqliteFile();
  document.getElementById('btn-account').onclick = () => openAccountModal();
  refreshAccountBadge();
  // 已登录：启动时静默增量同步一次（失败不阻塞任何功能）
  if (getAuth()) {
    syncNow().then(() => { refreshAccountBadge(); render(); }).catch(e => console.warn('[sync] 启动同步失败:', e.message));
    // 会员计划（模板额度等权益来源）单独刷新，失败静默（额度按免费版从严处理）
    refreshPlan().then(p => { if (p) render(); });
  }
  mask.remove();
  window.addEventListener('hashchange', render);
  render();
}

boot();

// ---------- 账号与云端同步（Phase 1） ----------

  btn.className = `w-full text-xs px-3 py-2 rounded-lg ${auth ? 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`;
}

function openAccountModal() {
  const auth = getAuth();
  const lastSync = localStorage.getItem('trae_sync_last');
  const root = openModal({
    title: '账号与云端同步',
    titleExtra: '数据仍在本地计算，云端仅备份原始明细',
    width: 'max-w-md',
    bodyHTML: auth ? `
      <div class="space-y-4 text-sm">
        <div class="bg-slate-50 rounded-lg p-3">
          <div class="text-slate-500 text-xs mb-1">当前账号</div>
          <div class="font-medium">${esc(auth.email)}</div>
          <div class="text-xs text-slate-400 mt-1 break-all">${esc(auth.serverUrl)}</div>
          ${lastSync ? `<div class="text-xs text-slate-400 mt-1">上次同步：${new Date(+lastSync).toLocaleString('zh-CN')}</div>` : ''}
        </div>
        <div id="acc-msg" class="text-xs"></div>
        <div class="flex gap-2">
          <button id="acc-sync" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">立即同步</button>
          <button id="acc-logout" class="px-4 py-2 bg-slate-100 rounded-lg text-sm hover:bg-slate-200">退出登录</button>
        </div>
        <p class="text-xs text-slate-400">同步内容：成交 / 计划 / 规则 / 违规 / 报告 / 信号等原始明细。派生指标在各设备本地重算，口径永远只有一套。</p>
      </div>` : `
      <div class="space-y-3 text-sm">
        <label class="block text-xs text-slate-500">服务地址<input id="acc-server" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm" value="${(JSON.parse(localStorage.getItem('trae_auth_v1') || 'null') || {}).serverUrl || location.origin}"></label>
        <label class="block text-xs text-slate-500">邮箱<input id="acc-email" type="email" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm" placeholder="you@example.com"></label>
        <label class="block text-xs text-slate-500">密码<input id="acc-pass" type="password" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm" placeholder="至少 6 位"></label>
        <div id="acc-msg" class="text-xs"></div>
        <div class="flex gap-2">
          <button id="acc-login" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">登录</button>
          <button id="acc-register" class="flex-1 px-4 py-2 bg-slate-800 text-white rounded-lg text-sm hover:bg-slate-900">注册并登录</button>
        </div>
        <p class="text-xs text-slate-400">首次登录会自动完成一次全量迁移：本机已有数据则推送上云；本机为空则从云端拉回。</p>
      </div>`,
  });

  const msg = root.querySelector('#acc-msg');
  const say = (t, ok) => { msg.textContent = t; msg.className = 'text-xs ' + (ok ? 'text-emerald-600' : 'text-red-600'); };

  if (auth) {
    root.querySelector('#acc-sync').onclick = async () => {
      say('同步中…', true);
      try {
        const r = await syncNow();
        localStorage.setItem('trae_sync_last', String(Date.now()));
        await refreshPlan();   // 同步后可能已换会员态，额度一并刷新
        say(`完成：推送 ${r.pushed} 条 / 拉取 ${r.pulled} 条`, true);
        refreshAccountBadge(); render();
      } catch (e) { say('同步失败：' + e.message, false); }
    };
    root.querySelector('#acc-logout').onclick = () => {
      logout();
      document.getElementById('modal-root').innerHTML = '';
      refreshAccountBadge(); render();   // 计划缓存已随退出清除，页面额度回到免费版口径
    };
  } else {
    const doAuth = async (fn) => {
      const serverUrl = root.querySelector('#acc-server').value.trim();
      const email = root.querySelector('#acc-email').value.trim();
      const password = root.querySelector('#acc-pass').value;
      if (!serverUrl || !email || password.length < 6) { say('请填写服务地址 / 邮箱，密码至少 6 位', false); return; }
      say('连接中…', true);
      try {
        await fn(serverUrl, email, password);
        say('登录成功，正在执行首次全量迁移…', true);
        const r = await initialSync();
        localStorage.setItem('trae_sync_last', String(Date.now()));
        await refreshPlan();   // 登录后立刻拿到该账号的额度（换账号时缓存已作废）
        say(`迁移完成（${r.mode}）：推送 ${r.pushed} 条 / 拉取 ${r.pulled} 条`, true);
        refreshAccountBadge(); render();
      } catch (e) { say(e.message, false); }
    };
    root.querySelector('#acc-login').onclick = () => doAuth(login);
    root.querySelector('#acc-register').onclick = () => doAuth(register);
  }
}


// ============================================================
// [构建注入] demo.js — 演示模式（非源文件，由 build_demo.py 生成）
//   1) 禁用 IndexedDB 读写（file:// 下不可靠；每次打开即同一份干净演示数据）
//   2) boot 完成后自动载入固定种子模拟数据，直接展示归因看板
//   3) 顶部演示横幅 + 「重置演示数据」「演示导览」
// ============================================================
(function demoMode() {
  // —— 1. 禁用 IndexedDB ——
  // 本段与 app.js 末尾 boot() 同属一个同步任务：boot 内 initDB 在
  // `await initSqlJs(...)` 处让出，其恢复（含 idbGet 调用）必晚于本段执行，禁用必然生效。
  idbGet = async () => null;   // 不读历史 dump，每次打开都是干净库
  idbSet = async () => {};     // 不写 IndexedDB（scheduleSave 防抖回调落空转）

  // 播种：调用现有模拟数据生成函数（固定种子 mulberry32(20261027)，可复现）
  function seedDemoData() {
    const _alert = window.alert;
    const _renderImport = renderImport;
    window.alert = () => {};        // 抑制 generateMock 的完成弹窗
    renderImport = () => {};        // 抑制导入页重渲染（当前停留在看板）
    try { generateMock(null); } finally {
      window.alert = _alert;
      renderImport = _renderImport;
    }
  }

  // 自动播种模拟信号（依赖 generateMock 的 trades 已存在）
  function autoSeedSignals() {
    const _alert = window.alert;
    window.alert = () => {};
    try { generateMockSignals(); } finally { window.alert = _alert; }
  }

  // 自动为最近完整月和再前一个月生成体检报告（让首次打开就有报告可看）
  async function autoSeedReports() {
    // 最近完整月
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
    const period1 = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    d.setMonth(d.getMonth() - 1);
    const period2 = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    for (const p of [period1, period2]) {
      try {
        // 已有报告则跳过（幂等）
        const exists = q1('SELECT id FROM review_reports WHERE user_id=$u AND period=$p',
                          { $u: LOCAL_USER_ID, $p: p });
        if (!exists) {
          await generateReportFor(p);
          console.log('[demo] 体检报告已自动生成：' + p);
        }
      } catch (e) { console.warn('[demo] 体检报告自动生成失败：' + p, e); }
    }
  }

  // 重置：清空业务表 → 重新播种 → 重新生成体检报告 → 回到归因看板
  async function resetDemoData() {
    ['trades', 'rule_violations', 'import_batches', 'trade_plans',
     'metric_snapshots', 'signals', 'signal_fills', 'review_reports']
      .forEach(t => run('DELETE FROM ' + t));
    heatMonth = null;               // 日历热力图回到最新月份
    seedDemoData();
    autoSeedSignals();              // 信号模块：同步重置
    await autoSeedReports();
    location.hash = '#/dashboard';
    render();
  }

  // 演示导览模态框（复用 ui.js openModal 骨架）
  function showGuide() {
    openModal({
      title: '演示导览',
      width: 'max-w-lg',
      bodyHTML: `
        <p class="text-sm text-slate-600 leading-relaxed">面向 A 股散户的「交易复盘 + 纪律」工具：交割单导入 → FIFO 复盘账本 → 确定性归因看板 → 纪律执行率量化，做全行业空白的「AI 行为级复盘」。</p>
        <ol class="space-y-2.5 text-sm text-slate-600 mt-4">
          <li class="flex gap-2.5"><span class="shrink-0 w-5 h-5 rounded-full bg-indigo-600 text-white text-xs flex items-center justify-center mt-0.5">1</span>
            <span><span class="font-medium">归因看板</span>（当前页）：每个数字可点击溯源到底层成交记录——点任意 KPI 卡片、热力图格子、个股/标签行试试。</span></li>
          <li class="flex gap-2.5"><span class="shrink-0 w-5 h-5 rounded-full bg-indigo-600 text-white text-xs flex items-center justify-center mt-0.5">2</span>
            <span><span class="font-medium">纪律系统</span>：执行率 70.8%，含违规明细（判定依据快照可回放）与 5 条 A 股特色规则（尾盘追高 / T+1 / 止损 / 仓位 / 周频率）。</span></li>
          <li class="flex gap-2.5"><span class="shrink-0 w-5 h-5 rounded-full bg-indigo-600 text-white text-xs flex items-center justify-center mt-0.5">3</span>
            <span><span class="font-medium">复盘账本</span>：FIFO 配对生成「完整交易」，T+1 当日买入自动锁定，支持笔记与标签。</span></li>
          <li class="flex gap-2.5"><span class="shrink-0 w-5 h-5 rounded-full bg-indigo-600 text-white text-xs flex items-center justify-center mt-0.5">4</span>
            <span><span class="font-medium">交割单导入</span>：券商模板按表头指纹自动命中（华泰/东财内置），未命中走通用 CSV 映射工具。</span></li>
        </ol>
        <p class="text-xs text-slate-400 border-t border-slate-100 pt-3 mt-4 leading-relaxed">技术说明：SQLite（sql.js WASM）纯前端本地运行，演示数据为固定种子确定性生成，数据不出本地。演示版不读写 IndexedDB，每次打开即同一份干净数据。</p>`,
    });
  }

  // —— 3. 顶部演示横幅（立即挂载，不依赖数据库） ——
  function mountBanner() {
    const app = document.getElementById('app');
    const banner = document.createElement('div');
    banner.id = 'demo-banner';
    banner.className = 'h-10 shrink-0 bg-indigo-700 text-white flex items-center px-4 gap-3 text-xs select-none';
    banner.innerHTML = `
      <span class="font-semibold bg-white/20 rounded px-1.5 py-0.5">演示版</span>
      <span class="text-indigo-100 truncate">全部为本地模拟数据 · 不荐股 / 不承诺收益 / 不自动交易</span>
      <span class="ml-auto flex gap-2 shrink-0">
        <button id="demo-guide-btn" class="px-2.5 py-1 rounded bg-white/15 hover:bg-white/30 transition">演示导览</button>
        <button id="demo-reset-btn" class="px-2.5 py-1 rounded bg-white/15 hover:bg-white/30 transition">重置演示数据</button>
      </span>`;
    document.body.insertBefore(banner, app);
    app.style.height = 'calc(100vh - 2.5rem)';   // 为横幅让出 40px，保持原有 flex 布局
    banner.querySelector('#demo-guide-btn').onclick = showGuide;
    banner.querySelector('#demo-reset-btn').onclick = resetDemoData;
  }
  mountBanner();

  // —— 3b. 演示版不提供云端同步：每次打开都是全新随机 ID 的模拟数据，
  //     同步上云只会污染账号（且与横幅「数据不出本地」承诺冲突）。隐藏入口，
  //     并清除本域下任何已存登录态（autoSync 以 getAuth() 为准，清掉即静默）。
  const accBtn = document.getElementById('btn-account');
  if (accBtn) accBtn.style.display = 'none';
  localStorage.removeItem('trae_auth_v1');
  localStorage.removeItem('trae_sync_wm_v1');

  // —— 2. 等待 app boot 完成（boot-mask 被移除）后播种并刷新看板 ——
  const timer = setInterval(() => {
    if (document.getElementById('boot-mask')) return;
    clearInterval(timer);
    (async () => {
      try {
        seedDemoData();
        autoSeedSignals();            // 信号模块：播种模拟信号 + autoMatch 匹配
        await autoSeedReports();     // 演示版首次打开即有体检报告
        render();                     // 用模拟数据重渲染归因看板（默认首屏）
        console.log('[demo] 演示数据 + 模拟信号 + 体检报告已载入（固定种子，IndexedDB 已禁用）');
      } catch (e) {
        console.error('[demo] 演示数据加载失败', e);
      }
    })();
  }, 40);
  setTimeout(() => clearInterval(timer), 20000);   // 兜底防泄漏
})();

</script>
